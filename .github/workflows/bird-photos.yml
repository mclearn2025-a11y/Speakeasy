name: Build topic photos

# Downloads real, freely licensed bird photos from Wikimedia Commons into photos/,
# with photographer credits. Run it again from the Actions tab to refresh them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/birds.json"
      - "tools/topics.json"
      - "tools/fetch_bird_photos.py"
      - ".github/workflows/bird-photos.yml"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/fetch_bird_photos.py
      - name: Save photos to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add photos
          git diff --cached --quiet || git commit -m "Add real topic photos from Wikimedia Commons with credits"
          git pull --rebase origin main
          git push origin HEAD:main
