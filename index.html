/* ---- Level check ---- */
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const CHECK_QS = [
  ["talk","How do they mostly communicate today?",[["Pointing, sounds or gestures",0],["Single words or pictures",1],["Two or three words together",2],["Full sentences, typing or writing",3]]],
  ["read","Can they read simple words?",[["Not yet",0],["Some familiar words",1],["Most everyday words",2]]],
  ["used","Have they used a talking app or picture board before?",[["Never",0],["A little",1],["Yes, often",2]]],
  ["many","How do they do with lots of choices on a screen?",[["Best with a few big buttons",0],["Fine with some buttons",1],["Can find words on a full board",2]]]
];
function suggestLevel(tasks, a, age){
  const t = tasks.filter(Boolean).length;
  const total = t + (a.talk||0) + (a.read||0) + (a.used||0) + (a.many||0) + (age==="young" ? 0 : 1);
  let L = total<=4 ? 1 : total<=9 ? 2 : 3;
  if (a.many===0) L = Math.min(L, 2);
  if (t===0 && (a.talk||0)<=1) L = 1;
  return {L, total, t};
}
function openLevelCheck(opts={}){
  const {panel, close: rawClose} = makeSheet("Level check","check");
  const done = () => { rawClose(); if (opts.after) opts.after(); };
  panel.parentElement.onclick = e => { if (e.target===panel.parentElement) done(); };
  const P = state.profile, who = P.name || "They";
  const tasks = [null,null,null], ans = {};
  const pics = shuffle([["dog","🐶"],["apple","🍎"],["car","🚗"]]);
  const words = shuffle(["eat","go","help"]);
  const tiles = shuffle(["I","want","more","stop","go","help"].map(w=>CORE.find(c=>(c.en||c.label)===w)));
  const W = w => (CORE.find(c=>(c.en||c.label)===w)||{label:w}).label, goal = ["I","want","more"].map(W).join(" ");
  let step = 0, built = [], locked = false;
  const dots = () => `<div class="dots" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${step>=i?"on":""}"></i>`).join("")}</div>`;
  const head = t => `<div class="phead"><h2>${t}</h2><button class="btn" id="cClose">Close</button></div>`;
  const next = (ok) => { if (step>=1 && step<=3) tasks[step-1] = ok; step++; locked = false; built = []; render(); };
  function cheer(btn, ok, word){ locked = true; if (ok){ btn.classList.add("ok"); say(`Yes! ${word}.`); burst(btn,12); } else say("Thank you!"); setTimeout(()=>next(ok), 1100); }
  function render(){
    if (step===0){
      panel.innerHTML = head("Level check") + `<div class="chk-task">
        <p class="note">About 2 minutes. ${esc(who)} tries 3 quick picture games, then you answer 4 questions. Speakeasy suggests a level to start with.</p>
        <p class="note">This is not a test score or a diagnosis. There are no wrong answers, and you can change the level anytime.</p>
        <div class="row" style="justify-content:flex-start"><button class="btn primary" id="cGo">▶ Start</button><button class="btn" id="cSkip">${opts.offer?"Skip for now":"Not now"}</button></div></div>`;
      panel.querySelector("#cGo").onclick = () => { step=1; render(); };
      panel.querySelector("#cSkip").onclick = done;
    } else if (step===1){
      panel.innerHTML = head("Picture game 1 of 3") + dots() + `<div class="chk-task"><p class="chk-ask">Tap the dog</p>
        <div class="chk-opts">${pics.map(([w,e])=>`<button data-w="${w}" aria-label="${w}"><span class="big">${e}</span></button>`).join("")}</div>
        <div class="row" style="justify-content:space-between"><button class="btn" id="cHear">🔊 Hear it again</button><button class="btn" id="cNext">Skip</button></div></div>`;
      say("Tap the dog.");
      panel.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ if(!locked) cheer(b, b.dataset.w==="dog", cap(T("dog"))); });
      panel.querySelector("#cHear").onclick = () => say("Tap the dog.");
    } else if (step===2){
      panel.innerHTML = head("Picture game 2 of 3") + dots() + `<div class="chk-task"><p class="chk-ask">Find the word: ${esc(W("eat"))}</p>
        <div class="chk-opts words">${words.map(w=>`<button data-w="${w}">${esc(W(w))}</button>`).join("")}</div>
        <div class="row" style="justify-content:space-between"><button class="btn" id="cHear">🔊 Hear it again</button><button class="btn" id="cNext">Skip</button></div></div>`;
      say("Find the word, " + W("eat") + ".");
      panel.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ if(!locked) cheer(b, b.dataset.w==="eat", cap(W("eat"))); });
      panel.querySelector("#cHear").onclick = () => say("Find the word, " + W("eat") + ".");
    } else if (step===3){
      panel.innerHTML = head("Picture game 3 of 3") + dots() + `<div class="chk-task"><p class="chk-ask">Make: ${esc(goal)}</p>
        <div class="chk-built" aria-live="polite">${built.length ? built.map(w=>`<span class="chip">${esc(w)}</span>`).join("") : `<span class="note">Tap 3 words</span>`}</div>
        <div class="chk-opts">${tiles.map(t=>`<button data-w="${esc(t.label)}" aria-label="${esc(t.label)}"><span class="big">${t.sym}</span>${esc(t.label)}</button>`).join("")}</div>
        <div class="row" style="justify-content:space-between"><button class="btn" id="cHear">🔊 Hear it again</button><span><button class="btn" id="cRedo">Start over</button> <button class="btn" id="cNext">Skip</button></span></div></div>`;
      if (!built.length) say("Can you say, " + goal + "?");
      panel.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
        if (locked) return; built.push(b.dataset.w); say(b.dataset.w);
        if (built.length===3){ const ok = built.join(" ")===goal; locked = true; setTimeout(()=>{ if (ok){ say("Yes! " + goal + "."); } else say("Thank you!"); setTimeout(()=>next(ok), 1100); }, 500); }
        render();
      });
      panel.querySelector("#cHear").onclick = () => say("Can you say, " + goal + "?");
      panel.querySelector("#cRedo").onclick = () => { built=[]; locked=false; render(); };
    } else if (step===4){
      const all = CHECK_QS.every(([k])=>ans[k]!==undefined);
      panel.innerHTML = head("A few questions for you") + dots() + `<div class="chk-task">
        <p class="note">Answer for how ${esc(who)} does on a typical day.</p>
        ${CHECK_QS.map(([k,qt,os])=>`<div class="qa"><span class="q">${esc(qt)}</span><div class="opts" role="group" aria-label="${esc(qt)}">${os.map(([t,v])=>`<button data-q="${k}" data-v="${v}" aria-pressed="${ans[k]===v}">${esc(t)}</button>`).join("")}</div></div>`).join("")}
        <div class="row" style="justify-content:flex-start"><button class="btn primary" id="cSee" ${all?"":"disabled"}>See the suggested level</button></div></div>`;
      panel.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ ans[b.dataset.q] = +b.dataset.v; const y = panel.scrollTop; render(); panel.scrollTop = y; });
      panel.querySelector("#cSee").onclick = () => { if (all){ step=5; render(); panel.scrollTop=0; } };
    } else {
      const r = suggestLevel(tasks, ans, P.age);
      P.check = {date:Date.now(), suggested:r.L, games:r.t}; save();
      const talkTxt = T(CHECK_QS[0][2].find(o=>o[1]===ans.talk)[0]).toLowerCase();
      panel.innerHTML = head("Suggested level") + `<div class="chk-task">
        <div class="dcard"><h4>${LEVELS[r.L].sym} Level ${r.L} · ${LEVELS[r.L].tag}</h4><p class="note" style="color:var(--ink)">${esc(LEVELS[r.L].what)}</p>
          <p class="note">Picture games: ${r.t} of 3. Talks today with ${esc(talkTxt)}.</p></div>
        <div class="lvls">${[1,2,3].map(n=>`<button class="lvl" data-lvl="${n}" aria-pressed="${n===r.L}">${n===r.L?`<span class="rec">Suggested</span>`:""}<b>${LEVELS[n].sym} Use Level ${n} · ${LEVELS[n].tag}</b><small>${LEVELS[n].what}</small></button>`).join("")}</div>
        <p class="note">This is a starting point, not a test score or a diagnosis. Watch how ${esc(who)} does for a couple of weeks, then move up or down. The Dashboard tells you when they may be ready for more. A speech-language pathologist can help you choose too.</p></div>`;
      panel.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>{ setLevel(+b.dataset.lvl); syncReg(); done(); });
    }
    const c = panel.querySelector("#cClose"); if (c) c.onclick = done;
    const n = panel.querySelector("#cNext"); if (n) n.onclick = () => { if (!locked) next(null); };
  }
  render();
}

/* the Dashboard's "ready for more?" hint */
function moveUpHint(){
  if (lv()>=3) return null;
  const shown = CORE.filter(it=>coreShown(it) && !it.label.includes(" ")).map(it=>it.label.toLowerCase());
  const used = shown.filter(w=>(state.learned[w]||0)>=3).length;
  return shown.length && used/shown.length >= 0.75 ? {used, shown:shown.length} : null;
}


/* ---------------- Emergency contacts and Help practice (v1.4) ----------------
   Up to three people to call, with phone, email and video. The Help card gives a helper
   one-tap Call, Text, Video and Email. Home address stays hidden unless a caregiver turns it on.
   Help practice teaches what to do, and never really calls anyone. */
const dialable = p => String(p||"").replace(/[^\d+]/g,"");
const spokenNumber = p => String(p||"").replace(/\D/g,"").split("").join(" ");
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const liveContacts = () => (state.help.contacts||[]).filter(c=>c.phone || c.email || c.video);
const hasContacts = () => liveContacts().length > 0;
const whoOf = c => c.relation && c.name ? `${cap(c.relation)} (${c.name})` : cap(c.relation || c.name || "My contact");
const callName = c => c.relation ? `my ${c.relation}` : (c.name || "my contact");
const videoHref = v => /^https?:\/\//i.test(v) ? v : "facetime:" + String(v).replace(/\s/g,"");

// "About me" phrases they can say to a helper, made from the Help card
function aboutMe(){
  const H = state.help, out = [];
  const add = (id, label, sym, sayIt) => out.push({id:"me-"+id, label:T(label), sym, pos:"social", builtin:true, say:sayIt && T(sayIt)});
  if (H.name) add("name", `My name is ${H.name}.`, "🙋");
  liveContacts().filter(c=>c.phone).forEach((c,i)=>{ const t = `${cap(c.relation || c.name)}'s phone number is ${c.phone}.`; add("ph"+i, t, "📞", t.replace(c.phone, spokenNumber(c.phone))); });
  const first = liveContacts().find(c=>c.phone); if (first) add("call", `Please call ${callName(first)}.`, "🙏");
  if (H.showAddress && H.address) add("addr", `I live at ${H.address}.`, "🏠");
  if (H.info) add("info", H.info, "ℹ️");
  return out;
}

function openHelpCard(){
  stopScan();
  const H = state.help, kid = m()==="k", C = liveContacts();
  const line1 = kid ? "I need help. I can't talk right now." : "I can't speak right now. I use this device to communicate.";
  const line2 = kid ? "Please find a grown-up I know." : "Please be patient and read my screen.";
  const msgText = T(H.name ? `This is ${H.name}'s talking app. ${H.name} needs help and can't speak right now.` : "This is a message from a talking app. The person with me needs help and can't speak right now."), subj = T("Help needed");
  const card = el("div","helpcard"); card.setAttribute("role","dialog"); card.setAttribute("aria-label","Help card");
  const contactHTML = c => `<div class="hc-c"><div class="hcwho">${esc(whoOf(c))}</div>${c.phone?`<div class="num">${esc(c.phone)}</div>`:""}
    <div class="acts">${c.phone?`<a class="call" href="tel:${esc(dialable(c.phone))}">📞 Call</a><a class="msg" data-num="${esc(dialable(c.phone))}" href="sms:${esc(dialable(c.phone))}?&body=${encodeURIComponent(msgText)}">💬 Text</a>`:""}${c.video?`<a href="${esc(videoHref(c.video))}" target="_blank" rel="noopener">🎥 Video</a>`:""}${c.email?`<a class="mail" data-mail="${esc(c.email)}" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(msgText)}">✉️ Email</a>`:""}</div></div>`;
  card.innerHTML = `<p class="big">${esc(line1)}</p><p class="info">${esc(line2)}</p>
    ${H.name?`<p class="info">My name is <b>${esc(H.name)}</b>.</p>`:""}
    ${C.length?`<p class="info">Please contact:</p><div class="hc-contacts">${C.map(contactHTML).join("")}</div>`:""}
    ${!C.length && H.contact?`<div><p class="info">Please contact:</p><div class="contact">${esc(H.contact)}</div></div>`:""}
    ${H.showAddress && H.address?`<p class="info">I live at <b>${esc(H.address)}</b>.</p>`:""}
    ${H.info?`<p class="info">${esc(H.info)}</p>`:""}
    ${(!H.name && !C.length && !H.contact)?`<p class="info" style="color:var(--muted)">Caregivers: add a name and emergency contacts in Settings, Help card.</p>`:""}
    <p class="note" id="hcLoc">${C.length?"Call and Text need a phone with service.":""}</p>
    <div class="acts"><button class="btn primary" id="hcSay">🔊 Say this</button><button class="btn" id="hcPractice">🎯 Practice</button><button class="btn" id="hcClose">Close</button></div>`;
  document.body.append(card);
  const first = C.find(c=>c.phone);
  const text = [line1, line2, H.name?`My name is ${H.name}.`:"", first?`Please call ${callName(first)} at ${spokenNumber(first.phone)}.`:(H.contact?`Please contact ${H.contact}.`:""), H.showAddress&&H.address?`I live at ${H.address}.`:"", H.info].filter(Boolean).join(" ");
  card.querySelector("#hcSay").onclick = () => say(text);
  card.querySelector("#hcClose").onclick = () => { card.remove(); restartScan(); };
  card.querySelector("#hcPractice").onclick = () => { card.remove(); openHelpPractice(); };
  // add their location to texts and emails, only when a caregiver turned it on
  if (H.shareLoc && C.length && navigator.geolocation){
    try { navigator.geolocation.getCurrentPosition(pos => {
      const link = `https://maps.google.com/?q=${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`, body = encodeURIComponent(`${msgText} ${T("My location:")} ${link}`);
      card.querySelectorAll("a.msg").forEach(a=>a.href = `sms:${a.dataset.num}?&body=${body}`);
      card.querySelectorAll("a.mail").forEach(a=>a.href = `mailto:${a.dataset.mail}?subject=${encodeURIComponent(subj)}&body=${body}`);
      const n = card.querySelector("#hcLoc"); if (n) n.textContent = "Call and Text need a phone with service. Their location is added to texts and emails.";
    }, ()=>{}, {timeout:8000, maximumAge:60000}); } catch {}
  }
  say(text);
}

function openHelpPractice(){
  const {panel, close} = makeSheet("Help practice","check");
  const H = state.help, nm = H.name || state.profile.name, c = liveContacts().find(x=>x.phone), who = c ? (c.relation || c.name) : "";
  const rounds = [
    {ask:"You are lost and need help. What do you do?", ok:"Show my Help card", ch:[["🆘","Show my Help card"],["🏃","Run away"],["🙈","Hide"]], yes:"Yes! Show your Help card to a helper."},
    {ask:"Who is a good helper to show your card?", ok:"Police officer", ch:[["👮","Police officer"],["🚗","A stranger in a car"],["🙈","Nobody"]], yes:"Yes! Police officers, store workers and moms with kids can help you."}
  ];
  if (nm) rounds.push({ask:"A helper asks your name. Tap your answer.", ok:`My name is ${nm}.`, ch:[["🙋",`My name is ${nm}.`],["🧃","I want juice."],["👋","Bye."]]});
  if (who){
    rounds.push({ask:"Who can you call for help?", ok:cap(who), ch:[["📞",cap(who)],["🍕","Pizza"],["🐶","Dog"]]});
    rounds.push({ask:`Tap Call to call ${who}.`, ok:"Call", note:"This is practice. It won't really call.", ch:[["📞","Call"],["🎮","Play a game"],["😴","Sleep"]], yes:`Yes! In real life, that calls ${who}.`});
    const ph = `${cap(who)}'s phone number is ${c.phone}.`;
    rounds.push({ask:"A helper asks for a phone number. Tap the right one.", ok:ph, sayOk:ph.replace(c.phone, spokenNumber(c.phone)), ch:[["📱",ph],["🎵","I like music."],["😴","I'm tired."]]});
  }
  rounds.push({ask:"Where is your Help button?", ok:"The red Help button", ch:[["🆘","The red Help button"],["⚙️","The gear"],["⭐","Core words"]]});
  let i = 0, stars = 0, misses = 0, busy = false;
  const render = () => {
    if (i >= rounds.length){
      state.helpPracticed = Date.now(); state.practice.right += stars; save();
      panel.innerHTML = `<div class="phead"><h2>Help practice</h2><button class="btn" id="pClose">Close</button></div>
        <div class="chk-task" style="align-items:center;text-align:center"><p class="chk-ask">🌟 You did it!</p><p class="note" style="color:var(--ink);font-size:17px">You know how to get help.</p>
        <div class="row" style="justify-content:center"><button class="btn primary" id="pAgain">Play again</button></div></div>`;
      say("You did it! You know how to get help.");
      panel.querySelector("#pClose").onclick = close;
      panel.querySelector("#pAgain").onclick = () => { i = 0; stars = 0; render(); };
      return;
    }
    const r = rounds[i], ch = shuffle(r.ch), long = ch.some(x=>x[1].length>18);
    misses = 0; busy = false;
    panel.innerHTML = `<div class="phead"><h2>Help practice ${i+1} of ${rounds.length}</h2><button class="btn" id="pClose">Close</button></div>
      <div class="chk-task"><p class="chk-ask">${esc(r.ask)}</p>${r.note?`<p class="note" style="text-align:center">${esc(r.note)}</p>`:""}
      <div class="chk-opts${long?" long":""}">${ch.map(([s,t])=>`<button data-t="${esc(t)}"><span class="big">${s}</span>${esc(t)}</button>`).join("")}</div>
      <div class="row" style="justify-content:space-between"><button class="btn" id="pHear">🔊 Hear it again</button><button class="btn" id="pSkip">Skip</button></div></div>`;
    say(r.ask);
    panel.querySelector("#pClose").onclick = close;
    panel.querySelector("#pHear").onclick = () => say(r.ask);
    panel.querySelector("#pSkip").onclick = () => { i++; render(); };
    panel.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
      if (busy) return;
      if (b.dataset.t===r.ok){ busy = true; stars++; b.classList.add("ok"); burst(b,14); say(r.yes || ("Yes! " + (r.sayOk || r.ok))); setTimeout(()=>{ i++; render(); }, 1700); }
      else { misses++; say("Let's try again. " + r.ask);
        if (misses>=2) panel.querySelector(`[data-t="${CSS.escape(r.ok)}"]`)?.classList.add("hintok"); }
    });
  };
  render();
}

y, so it does not contact other companies while you use it.<\/p>\n<p>Speaking voices come from your own device. Some voices marked “needs internet” are run by the company that made your device or browser.<\/p>\n<p>If you open Speakeasy through a Claude preview link, that page is hosted by Anthropic and loads its fonts from Google. For the most privacy, use Speakeasy from its own web address.<\/p>\n\n<h3>Children\'s privacy<\/h3>\n<p>Speakeasy is made for children and adults who communicate with pictures and words. It does not collect personal information from anyone, including children under 13. Caregivers control all of the information on the device.<\/p>\n\n<h3>Camera and microphone<\/h3>\n<p>Speakeasy does not use the camera or microphone. Photos you add are ones you choose from your device, and they stay on it.<\/p>\n\n<h3>Deleting information<\/h3>\n<ul>\n  <li>To delete one person, open their profile and tap Delete this person.<\/li>\n  <li>To delete everything, clear the browser\'s data for Speakeasy, or remove the app from the home screen and clear its data.<\/li>\n  <li>Backup files you saved are yours. Delete them wherever you keep them.<\/li>\n<\/ul>\n\n<h3>Changes to this policy<\/h3>\n<p>If Speakeasy ever offers an optional account to use the same information on more than one device, we will update this policy first. Nothing will be uploaded unless a caregiver turns that on.<\/p>\n\n<h3>Credits<\/h3>\n<p>Word symbols: Mulberry Symbols by Steve Lee (mulberrysymbols.org), CC BY-SA 4.0, plus symbols drawn by McLearn Media. Photos: Wikimedia Commons contributors under free licenses, credited in the app. Fonts: Atkinson Hyperlegible, Hanken Grotesk and Fraunces, SIL Open Font License.<\/p>\n\n<h3>Contact<\/h3>\n<p>Questions about privacy? Email McLearn Media at Mclearn2025@gmail.com.<\/p>\n';

/* ---------------- "How to talk with me" card (v1.7) ----------------

const CARD_FIELDS = [
  ["yes","How I say yes","I tap Yes, nod or smile."],
  ["no","How I say no","I tap No, push it away or turn my head."],
  ["upset","When I'm upset, I may","cover my ears, rock or walk away."],
  ["calm","What helps me calm down","a quiet place, my headphones, a hug if I ask."],
  ["dont","Please don't","touch me without asking, or talk too loud."],
  ["more","Other things to know","I love to talk about trains!"]
];
const CARD_CSS = `

.tcard h1{font-family:"Fraunces",Georgia,serif;font-weight:600;color:var(--brand);font-size:28px;line-height:1.1;margin:0}
.tcard .tc-sub{margin:4px 0 0;font-size:17px}

.tcard .tc-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}

.tcard h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin:0 0 6px;font-weight:700}
.tcard ol,.tcard ul{margin:0;padding-left:20px}

.tcard .tc-chips{display:flex;flex-wrap:wrap;gap:6px}

@media (max-width:560px){.tcard{padding:16px}.tcard .tc-cols{grid-template-columns:1fr}.tcard h1{font-size:24px}}
@media print{.tcard{border:0;padding:0;max-width:none}.tcard .tc-cols{grid-template-columns:1fr 1fr}.tcard section,.tcard .tc-ct div{break-inside:avoid}}
`;
const cardOpts = () => state.card;
function cardTips(){
  const L = lv();
  return [
    "Give me time. Wait at least 10 seconds for my answer.",
    "Talk to me, not about me. I understand more than I can say.",
    "Point to words on my screen while you talk. That's how I learn to use it.",
    L===1 ? "Ask yes or no questions, or give me two choices." : "Ask one question at a time.",
    "Every message counts, even one word. Answer what I say.",
    "Keep my talking app with me and charged. Please never take it away, even when I'm upset."
  ];
}
function cardLoves(){
  const P = state.profile, out = [];
  for (const k of P.interests||[]){ const n = PACKS[k] ? PACKS[k].name : (INTERESTS.find(i=>i[0]===k)||[])[2]; if (n) out.push(n); }
  for (const t of state.topics||[]) if (t && t.name) out.push(t.name);
  return [...new Set(out)];
}
function cardWords(){
  return Object.entries(state.learned).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([w])=>w.replace(/^i(?=$|['’])/,"I"));
}
function cardHTML(){
  const C = state.card, H = state.help, P = state.profile;
  const nm = H.name || P.name, loves = C.loves ? cardLoves() : [], words = C.words ? cardWords() : [];
  const ct = C.contacts ? liveContacts().filter(c=>c.phone || c.email) : [];
  const ans = k => (C[k]||"").trim();
  const yes = ans("yes") || "I tap Yes on my talking app.", no = ans("no") || "I tap No on my talking app.";
  const lines = [["How I say yes", yes], ["How I say no", no], ...CARD_FIELDS.slice(2,5).filter(f=>ans(f[0])).map(f=>[f[1], ans(f[0])])];
  const date = new Date().toLocaleDateString(LANGS[LANG].tag,{year:"numeric",month:"long",day:"numeric"});
  return `<article class="tcard" aria-label="How to talk with me card">
  <div class="tc-top"><div class="tc-av" aria-hidden="true">${esc(P.avatar||"🙂")}</div><div><h1>How to talk with me</h1><p class="tc-sub">${nm?`My name is <b>${esc(nm)}</b>.`:"Thank you for taking the time to read this."}</p></div></div>
  <p class="tc-voice">🗣️ I may not speak with my mouth, but I have a lot to say. My talking app, Speakeasy, is my voice. When I tap words, it speaks for me.</p>
  <div class="tc-cols">
    <section><h2>Please help me talk</h2><ol>${cardTips().map(t=>`<li>${esc(t)}</li>`).join("")}</ol></section>
    <section><h2>About me</h2><dl>${lines.map(([t,v])=>`<div><dt>${esc(t)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></section>
    ${loves.length?`<section><h2>Things I love</h2><div class="tc-chips">${loves.map(x=>`<span>${esc(x)}</span>`).join("")}</div></section>`:""}
    ${words.length?`<section><h2>Words I use a lot</h2><div class="tc-chips">${words.map(x=>`<span>${esc(x)}</span>`).join("")}</div></section>`:""}
    ${ans("more")?`<section class="tc-full"><h2>Other things to know</h2><p>${esc(ans("more"))}</p></section>`:""}
    ${ct.length?`<section class="tc-full"><h2>If you have questions or I need help</h2><div class="tc-ct">${ct.map(c=>`<div><b>${esc(whoOf(c))}</b>${c.phone?`📞 ${esc(c.phone)}<br>`:""}${c.email?`✉️ ${esc(c.email)}`:""}</div>`).join("")}</div></section>`:""}
  </div>
  <div class="tc-foot"><span>Made with Speakeasy by McLearn Media</span><span>${esc(date)}</span></div>
</article>`;
}
function cardFileText(){
  const nm = state.help.name || state.profile.name;
  return `<!doctype html><html lang="${LANG}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(T("How to talk with me"))}${nm?" · "+esc(nm):""}</title><style>body{margin:0;padding:16px;background:#fff}@page{margin:12mm}@media print{body{padding:0}}${CARD_CSS}</style></head>
<body>${trHTML(cardHTML())}</body></html>`;
}
async function saveCardFile(){
  const nm = (state.help.name || state.profile.name || "me").replace(/[^\w-]+/g,"-").replace(/^-+|-+$/g,"") || "me";
  const name = `How-to-talk-with-${nm}.html`, blob = new Blob([cardFileText()],{type:"text/html"});
  const done = m => { state.cardMade = Date.now(); save(); toast(m); return true; };
  if (window.claude && typeof window.claude.use==="function"){
    let dl = null; try { dl = await window.claude.use("downloads"); } catch {}
    if (!dl){ toast("Saving files isn't available here. Open Speakeasy from its own web address to save the card."); return false; }
    try { await dl.save({filename:name, data:blob}); return done("Card saved. Open the file to print it."); }
    catch(e){ toast(e && e.code==="declined" ? "Card not saved." : "Saving files isn't available here."); return false; }
  }
  const file = new File([blob], name, {type:"text/html"});
  if (matchMedia("(pointer: coarse)").matches && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:"How to talk with me"}); return done("Card sent."); }
    catch(e){ if (e && e.name==="AbortError") return false; }
  }
  try { const url = URL.createObjectURL(file), a = el("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000); return done("Card downloaded. Open the file to print it."); }
  catch { toast("This device blocked the file."); return false; }
}
function printCard(){
  let area = $("printArea"); if (!area){ area = el("div"); area.id = "printArea"; document.body.append(area); }
  area.innerHTML = cardHTML();
  document.body.classList.add("printing");
  const end = () => { document.body.classList.remove("printing"); area.innerHTML = ""; window.removeEventListener("afterprint", end); };
  window.addEventListener("afterprint", end);
  state.cardMade = Date.now(); save();
  try { window.print(); } catch { end(); toast("Printing isn't available here. Use Save card file instead."); return; }
  setTimeout(()=>{ if (!matchMedia("print").matches) end(); }, 1500);
}
function openTalkCard(){
  const {panel, close} = makeSheet("How to talk with me card","tc");
  const C = state.card;
  const chk = (k,t) => `<label class="tc-chk"><input type="checkbox" data-ck="${k}" ${C[k]?"checked":""}> ${esc(t)}</label>`;
  panel.innerHTML = `<div class="phead"><h2>How to talk with me</h2><button class="btn primary" id="tcClose">Done</button></div>
    <p class="note">A one-page card for teachers, sitters, doctors and anyone new. It explains how ${esc(state.profile.name || "they")} ${state.profile.name?"talks":"talk"} and how to help. Fill in what you like. Blank lines are left off the card.</p>
    <div class="tc-wrap"><div class="tc-form">
      ${CARD_FIELDS.map(([k,t,ph])=>`<label>${esc(t)}<input type="text" data-cf="${k}" value="${esc(C[k]||"")}" placeholder="${esc(ph)}" autocomplete="off"></label>`).join("")}
      <div class="tc-chks">${chk("loves","Show favorite things")}${chk("words","Show words they use most")}${chk("contacts","Show emergency contacts")}</div>
      <p class="note">Name and contacts come from the profile and the Help card.</p>
      <div class="row" style="justify-content:flex-start"><button class="btn primary" id="tcPrint">🖨️ Print card</button><button class="btn" id="tcSave">💾 Save card file</button></div>
    </div><div class="tc-prev" aria-live="polite"></div></div>`;
  const prev = panel.querySelector(".tc-prev"), draw = () => { prev.innerHTML = cardHTML(); };
  panel.querySelectorAll("[data-cf]").forEach(i=>i.oninput = () => { C[i.dataset.cf] = i.value; save(); draw(); });
  panel.querySelectorAll("[data-ck]").forEach(i=>i.onchange = () => { C[i.dataset.ck] = i.checked; save(); draw(); });
  panel.querySelector("#tcClose").onclick = close;
  panel.querySelector("#tcPrint").onclick = printCard;
  panel.querySelector("#tcSave").onclick = saveCardFile;
  draw();
}
