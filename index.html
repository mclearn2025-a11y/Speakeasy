ng?":"¿Cómo apago cosas o dejo solo una?","How do I use Nana instead of grandma?":"¿Cómo uso Nana en vez de abuela?","How do the games work?":"¿Cómo funcionan los juegos?","How do they do with lots of choices on a screen?":"¿Cómo le va con muchas opciones en una pantalla?","How do they mostly communicate today?":"¿Cómo se comunica casi siempre hoy?","How does the Help card work?":"¿Cómo funciona la tarjeta de Ayuda?","How to talk":"Cómo hablar","How to talk with me":"Cómo hablar conmigo","How to talk with me card":"Tarjeta Cómo hablar conmigo","How to use":"Cómo usarlo","How to use Speakeasy":"Cómo usar Speakeasy","I can't speak right now. I use this device to communicate.":"Ahora no puedo hablar. Uso este aparato para comunicarme.","I live at":"Vivo en","I love to talk about trains!":"¡Me encanta hablar de trenes!","I made a mistake. Can I undo it?":"Cometí un error. ¿Lo puedo deshacer?","I may not speak with my mouth, but I have a lot to say. My talking app, Speakeasy, is my voice. When I tap words, it speaks for me.":"Quizá no hablo con la boca, pero tengo mucho que decir. Mi app para hablar, Speakeasy, es mi voz. Cuando toco palabras, habla por mí.","I need help. I can't talk right now.":"Necesito ayuda. Ahora no puedo hablar.","I tap No on my talking app.":"Toco No en mi app para hablar.","I tap No, push it away or turn my head.":"Toco No, lo empujo o volteo la cabeza.","I tap Yes on my talking app.":"Toco Sí en mi app para hablar.","I tap Yes, nod or smile.":"Toco Sí, muevo la cabeza o sonrío.","I want juice.":"Quiero jugo.","If files don't work on this device, copy the backup as text and paste it into an email to yourself. Paste it back here to restore.":"Si los archivos no funcionan en este aparato, copia el respaldo como texto y pégalo en un correo para ti. Pégalo aquí otra vez para restaurarlo.","If you have questions or I need help":"Si tienes preguntas o necesito ayuda","Ignore repeat taps":"Ignorar toques repetidos","In Safari, open the File menu and choose Add to Dock.":"En Safari, abre el menú Archivo y elige Agregar al Dock.","In Safari, tap Share, then Add to Home Screen.":"En Safari, toca Compartir y luego Agregar a pantalla de inicio.","In Show and hide, turn off any page or tool they don't use yet, or use Keep only to leave just one thing. Show everything brings it all back. The settings gear always stays.":"En Mostrar y ocultar, apaga cualquier página o herramienta que todavía no use, o usa Dejar solo para dejar una sola cosa. Mostrar todo lo regresa todo. El engrane de ajustes siempre se queda.","In the profile, choose English or Español. Words, phrases, topic pages, the Help card and the screens switch to that language, and Speakeasy speaks it. Each person can have a different language.":"En el perfil, elige English o Español. Las palabras, frases, páginas de temas, la tarjeta de Ayuda y las pantallas cambian a ese idioma, y Speakeasy lo habla. Cada persona puede tener un idioma diferente.","In the profile, pick topic pages like Dogs, Space, Trees or the 50 states. Each one has real photos, names, fun facts and its own game. Type anything else they love, and it gets its own page for your words and photos.":"En el perfil, elige páginas de temas como Perros, El espacio, Árboles o los 50 estados. Cada una tiene fotos reales, nombres, datos curiosos y su propio juego. Escribe cualquier otra cosa que le encante, y tendrá su propia página para tus palabras y fotos.","In the sky":"En el cielo","Install Speakeasy as an app":"Instalar Speakeasy como app","Install Speakeasy now<\/button><\/div>` :":"Instalar Speakeasy ahora","Install Speakeasy to protect it from automatic clean-up.":"Instala Speakeasy para protegerlo de la limpieza automática.","Install app":"Instalar app","Internet":"Internet","It doesn't speak Spanish out loud. What do I do?":"No habla español en voz alta. ¿Qué hago?","It opens like an app from the home screen.":"Se abre como una app desde la pantalla de inicio.","It says each word when I tap it. Can I turn that off?":"Dice cada palabra cuando la toco. ¿Puedo apagar eso?","It shows setup steps, how often they talk, the words they use most, practice scores and backup status. Open the Menu and hold Dashboard.":"Muestra los pasos de configuración, qué tan seguido habla, las palabras que más usa, los puntajes de práctica y los respaldos. Abre el Menú y mantén presionado Panel.","It shows who you are and who to call, and says it out loud. A helper can tap Call or Text.":"Muestra quién eres y a quién llamar, y lo dice en voz alta. Alguien que te ayude puede tocar Llamar o Mensaje.","It takes about 2 minutes. They try 3 picture games, then you answer 4 questions. It suggests a starting level. It is not a test score or a diagnosis.":"Toma unos 2 minutos. Hace 3 juegos de imágenes y luego tú contestas 4 preguntas. Sugiere un nivel para empezar. No es una calificación ni un diagnóstico.","Just say the word":"Solo decir la palabra","Keep flying":"Seguir volando","Keep my talking app with me and charged. Please never take it away, even when I'm upset.":"Deja mi app para hablar conmigo y con carga. Por favor, nunca me la quites, aunque esté molesto.","Keep only":"Dejar solo","Keep only this":"Dejar solo esto","Keep only turns everything else off. The Help button stays on unless you turn it off yourself. We recommend keeping it on so they can always ask for help.":"Dejar solo apaga todo lo demás. El botón de Ayuda sigue encendido a menos que tú lo apagues. Te recomendamos dejarlo encendido para que siempre pueda pedir ayuda.","Keep their words safe":"Cuida sus palabras","Keyboard":"Teclado","Language":"Idioma","Language and voice":"Idioma y voz","Later":"Después","Learn how to get help":"Aprende a pedir ayuda","Leave the game":"Salir del juego","Let's try again.":"Intentemos otra vez.","Level":"Nivel","Level 1 Beginner has 12 big words. Level 2 Middle has all 24 core words, every word group and the keyboard. Level 3 Advanced has 48 words and every tool. Levels show and hide words. They never delete them.":"El nivel 1 Principiante tiene 12 palabras grandes. El nivel 2 Intermedio tiene las 24 palabras básicas, todos los grupos y el teclado. El nivel 3 Avanzado tiene 48 palabras y todas las herramientas. Los niveles muestran y ocultan palabras. Nunca las borran.","Level 1 Beginner has 12 big words. Level 2 Middle has all 24 core words, every word group and the keyboard. Level 3 Advanced has 48 words and every tool. The level check suggests where to start. Move up when it feels easy. Words never disappear, and core words never move.":"El nivel 1 Principiante tiene 12 palabras grandes. El nivel 2 Intermedio tiene las 24 palabras básicas, todos los grupos y el teclado. El nivel 3 Avanzado tiene 48 palabras y todas las herramientas. La prueba de nivel sugiere dónde empezar. Sube de nivel cuando se sienta fácil. Las palabras nunca desaparecen, y las básicas nunca se mueven.","Level 1 hides the keyboard, word endings and Find to keep things simple. A caregiver may also have turned things off in Show and hide.":"El nivel 1 oculta el teclado, las terminaciones y Buscar para que sea sencillo. También puede ser que un cuidador apagó cosas en Mostrar y ocultar.","Level check":"Prueba de nivel","Levels":"Niveles","Like: no sound, add a photo, change the level":"Por ejemplo: no hay sonido, agregar una foto, cambiar el nivel","Listening scanning (speaks each choice)":"Escaneo con voz (dice cada opción)","Little words":"Palabras pequeñas","Little words group":"Grupo de palabras pequeñas","Lock":"Candado","Lock the settings":"Pon candado a los ajustes","Long (1s)":"Largo (1 s)","Look":"Estilo","Look and feel":"Estilo y sensación","Look at your favorite things.":"Mira tus cosas favoritas.","Look for Install app or Add to Home Screen in the browser's menu.":"Busca Instalar app o Agregar a pantalla de inicio en el menú del navegador.","Mac":"Mac","Made with Speakeasy by McLearn Media":"Hecho con Speakeasy de McLearn Media","Make a How to talk with me card":"Haz una tarjeta Cómo hablar conmigo","Make a How to talk with me card. It's one page that explains their talking app, how to help them talk, how they say yes and no, what helps them calm down, and who to call. Print it, or save it as a file to email.":"Haz una tarjeta Cómo hablar conmigo. Es una página que explica su app para hablar, cómo ayudarle a hablar, cómo dice sí y no, qué le ayuda a calmarse y a quién llamar. Imprímela o guárdala como archivo para enviarla por correo.","Make a profile for each person":"Haz un perfil para cada persona","Make their profile":"Haz su perfil","Medium (0.6s)":"Mediano (0.6 s)","Medium dogs":"Perros medianos","Menu":"Menú","Menu button":"Botón del menú","Message bar and Speak button":"Barra del mensaje y botón Hablar","Message. Tap to speak it.":"Mensaje. Tócalo para decirlo.","Middle":"Intermedio","Mon":"lun","Most everyday words":"Casi todas las palabras del día a día","Most used words":"Palabras más usadas","Musical instruments":"Instrumentos musicales","My location:":"Mi ubicación:","My name is":"Me llamo","NO":"NO","Name":"Nombre","Name and contacts come from the profile and the Help card.":"El nombre y los contactos vienen del perfil y de la tarjeta de Ayuda.","Name and emergency contact":"Nombre y contacto de emergencia","Name button (switch people)":"Botón del nombre (cambiar de persona)","Name, age, favorites, level":"Nombre, edad, favoritos, nivel","Nana, Gigi, Granny":"Nana, Lela, Abue","Need help? Tap the red Help button.":"¿Necesitas ayuda? Toca el botón rojo de Ayuda.","Never":"Nunca","New person":"Persona nueva","New topic name":"Nombre del tema nuevo","No backup file yet.":"Todavía no hay archivo de respaldo.","No profile name yet":"Sin nombre todavía","No. It can't call anyone by itself or tell when someone is in trouble. A person has to tap Call. In an emergency, call 911.":"No. No puede llamar a nadie solo ni saber cuándo alguien está en problemas. Una persona tiene que tocar Llamar. En una emergencia, llama al 911.","No. Speakeasy updates by itself the next time it's opened with internet. Their words and settings stay.":"No. Speakeasy se actualiza solo la próxima vez que se abre con internet. Sus palabras y ajustes se quedan.","Nobody":"Nadie","Not installed yet. In Safari, tap Share, then Add to Home Screen.":"Todavía no está instalado. En Safari, toca Compartir y luego Agregar a pantalla de inicio.","Not installed yet. Use your browser's Install app option.":"Todavía no está instalado. Usa la opción Instalar app del navegador.","Not now":"Ahora no","Not ready yet. Open Speakeasy once more with internet, then it works offline.":"Todavía no está listo. Abre Speakeasy una vez más con internet y después funcionará sin internet.","Not saved yet. Tap Save to this device below for the steps.":"Todavía no está guardado. Toca Guardar en este aparato abajo para ver los pasos.","Not sure? Start at Level 1. Next, the level check suggests the best fit.":"¿No estás seguro? Empieza en el nivel 1. Después, la prueba de nivel sugiere el mejor.","Not yet":"Todavía no","Not yet protected from automatic clean-up. Keep backup files.":"Todavía no está protegido de la limpieza automática. Guarda archivos de respaldo.","Numbers":"Números","Numbers group":"Grupo de números","Ocean and ice":"Mar y hielo","Off":"Apagado","Offline now. Speakeasy still works.":"Sin internet ahora. Speakeasy sigue funcionando.","On a topic page, tap the game button. Listen to the name, then tap the right picture.":"En una página de tema, toca el botón del juego. Escucha el nombre y toca la imagen correcta.","On a topic page, tap the game button. Speakeasy says a name and shows three pictures. Tap the right one to hear YES! After two misses, the right one glows, so every round ends in a win.":"En una página de tema, toca el botón del juego. Speakeasy dice un nombre y muestra tres imágenes. Toca la correcta para oír ¡SÍ! Después de dos fallas, la correcta brilla, así que cada ronda termina en un triunfo.","On a topic page, turn on Big picture. Then tap any picture to see all of it on a clean screen. Tap anywhere to go back.":"En una página de tema, activa Imagen grande. Luego toca cualquier imagen para verla completa en una pantalla limpia. Toca donde sea para regresar.","On a topic page, turn on Fun facts. When they tap a picture, Speakeasy says a short fact about it.":"En una página de tema, activa Datos curiosos. Cuando toque una imagen, Speakeasy dice un dato corto sobre ella.","On iPhone and iPad, Safari works best for this. In Chrome, tap the Share button next to the address bar, then Add to Home Screen.<\/p>` :":"En iPhone y iPad, Safari funciona mejor para esto. En Chrome, toca el botón Compartir junto a la barra de direcciones y luego Agregar a pantalla de inicio.","On iPhone or iPad, open it in Safari, tap Share, then Add to Home Screen. On Android or a computer, use the browser's Install app option.":"En iPhone o iPad, ábrelo en Safari, toca Compartir y luego Agregar a pantalla de inicio. En Android o una computadora, usa la opción Instalar app del navegador.","On the Help card, tap Practice. You will learn what to do if you are lost.":"En la tarjeta de Ayuda, toca Practicar. Vas a aprender qué hacer si te pierdes.","On the button, show:":"En el botón, mostrar:","On the old device, save a backup file. On the new one, open Speakeasy, then Settings, Restore from file.":"En el aparato viejo, guarda un archivo de respaldo. En el nuevo, abre Speakeasy, luego Ajustes, Restaurar desde archivo.","On topic pages, Big picture shows the whole photo when they tap it, with nothing covering it. Fun facts reads a short fact about each picture.":"En las páginas de temas, Imagen grande muestra la foto completa cuando la toca, sin nada encima. Datos curiosos lee un dato corto de cada imagen.","Once it's saved, Speakeasy updates by itself whenever it's opened with internet. Their words and settings stay.":"Una vez guardado, Speakeasy se actualiza solo cada vez que se abre con internet. Sus palabras y ajustes se quedan.","Only if you're comfortable with anyone who picks up the device seeing it. It's off by default. Phone numbers are usually enough to get them home safely.":"Solo si te parece bien que cualquiera que agarre el aparato lo vea. Viene apagado. Los teléfonos casi siempre bastan para que llegue a casa seguro.","Only on this device. Nothing is sent to McLearn Media or anyone else, and there's no tracking. Read the full privacy policy in Settings, About.":"Solo en este aparato. No se envía nada a McLearn Media ni a nadie más, y no hay rastreo. Lee la política de privacidad completa en Ajustes, Acerca de.","Open Settings, Edit words. Pick the page, type the word, tap Or a photo, and choose a picture from your phone. Then tap Add word.":"Abre Ajustes, Editar palabras. Elige la página, escribe la palabra, toca O una foto y elige una imagen de tu teléfono. Luego toca Agregar palabra.","Open Settings, Help card and emergency contacts. Add up to three people with phone, email and a video call link. Contact 1 is the one to try first.":"Abre Ajustes, Tarjeta de Ayuda y contactos de emergencia. Agrega hasta tres personas con teléfono, correo y un enlace de videollamada. El contacto 1 es el primero a probar.","Open Settings, Keep their words safe, and tap Save backup file. Keep the file in your email or cloud drive.":"Abre Ajustes, Cuida sus palabras, y toca Guardar archivo de respaldo. Guarda el archivo en tu correo o tu nube.","Open Settings, Show and hide. Uncheck anything they don't need, or pick something in Keep only. Show everything brings it all back.":"Abre Ajustes, Mostrar y ocultar. Quita la marca de lo que no necesite, o elige algo en Dejar solo. Mostrar todo lo regresa todo.","Open Settings, Topics, and check or uncheck it. You can also change favorites in the profile.":"Abre Ajustes, Temas, y márcalo o desmárcalo. También puedes cambiar los favoritos en el perfil.","Open Settings, Touch and access. Turn on Hold to choose, or Ignore repeat taps. Bigger buttons help too.":"Abre Ajustes, Toque y acceso. Activa Mantener para elegir, o Ignorar toques repetidos. Los botones más grandes también ayudan.","Open Settings, Touch and access. Use the Button size slider, High contrast, or Words only.":"Abre Ajustes, Toque y acceso. Usa el control de Tamaño de los botones, Alto contraste o Solo palabras.","Open Settings, Voice. Pick a voice, then use the Speed and Pitch sliders. Tap Test voice to hear it.":"Abre Ajustes, Voz. Elige una voz y usa los controles de Velocidad y Tono. Toca Probar voz para oírla.","Open Settings, then Accessibility, Text-to-speech, Speech engine. Download a voice for the language. Then reopen Speakeasy.":"Abre Configuración, luego Accesibilidad, Texto a voz, Motor de voz. Descarga una voz para el idioma. Luego vuelve a abrir Speakeasy.","Open Speakeasy in Chrome or Edge.":"Abre Speakeasy en Chrome o Edge.","Open Speakeasy in Chrome, Edge or Safari.":"Abre Speakeasy en Chrome, Edge o Safari.","Open Speakeasy in Chrome.":"Abre Speakeasy en Chrome.","Open Speakeasy in Safari.":"Abre Speakeasy en Safari.","Open System Settings, then Accessibility, Spoken Content. Next to System voice, choose Manage Voices and download one for the language. Then reopen Speakeasy.":"Abre Configuración del Sistema, luego Accesibilidad, Contenido leído. Junto a Voz del sistema, elige Administrar voces y descarga una para el idioma. Luego vuelve a abrir Speakeasy.","Open Windows Settings, then Time and language, Speech. Under Manage voices, tap Add voices and pick the language. Then reopen Speakeasy.":"Abre la Configuración de Windows, luego Hora e idioma, Voz. En Administrar voces, toca Agregar voces y elige el idioma. Luego vuelve a abrir Speakeasy.","Open that person's profile and tap Delete this person twice. Save a backup file first if you might want their words back.":"Abre el perfil de esa persona y toca Borrar a esta persona dos veces. Guarda antes un archivo de respaldo si quizá quieres recuperar sus palabras.","Open the Menu and hold Edit profile, or open Settings, Profile and level, Edit profile.":"Abre el Menú y mantén presionado Editar perfil, o abre Ajustes, Perfil y nivel, Editar perfil.","Open the Menu and tap Save to this device. It shows the steps for your phone, tablet or computer. On iPhone or iPad, open it in Safari, tap Share, then Add to Home Screen. On Android, tap Install.":"Abre el Menú y toca Guardar en este aparato. Muestra los pasos para tu teléfono, tableta o computadora. En iPhone o iPad, ábrelo en Safari, toca Compartir y luego Agregar a pantalla de inicio. En Android, toca Instalar.","Open the Menu to go anywhere.":"Abre el Menú para ir a cualquier parte.","Open the Questions tab at the top of this guide and type what you need, like no sound or add a photo.":"Abre la pestaña Preguntas arriba en esta guía y escribe lo que necesitas, como no hay sonido o agregar una foto.","Open the device Settings, then search for Text-to-speech. Tap the gear next to the speech engine, then Install voice data, and download the language. Then reopen Speakeasy.":"Abre la Configuración del aparato y busca Texto a voz. Toca el engrane junto al motor de voz, luego Instalar datos de voz, y descarga el idioma. Luego vuelve a abrir Speakeasy.","Open the device settings and look for Text-to-speech or Spoken content, then add a voice for the language. Then reopen Speakeasy.":"Abre la configuración del aparato y busca Texto a voz o Contenido leído, y agrega una voz para el idioma. Luego vuelve a abrir Speakeasy.","Open the iPhone or iPad Settings, then Accessibility, Spoken Content, Voices. Pick the language and download a voice. Then reopen Speakeasy.":"Abre los Ajustes del iPhone o iPad, luego Accesibilidad, Contenido leído, Voces. Elige el idioma y descarga una voz. Luego vuelve a abrir Speakeasy.","Open the profile and fill in What they call family. Speakeasy says their name for that person. Choose Their name or Both names for the buttons.":"Abre el perfil y llena Cómo le dice a su familia. Speakeasy dice su nombre para esa persona. Elige Su nombre o Los dos nombres para los botones.","Open the profile, go to Favorite things, type the topic and tap Add. Then add its words and photos in Settings, Edit words.":"Abre el perfil, ve a Cosas favoritas, escribe el tema y toca Agregar. Luego agrega sus palabras y fotos en Ajustes, Editar palabras.","Open your browser's menu and choose Install app.":"Abre el menú del navegador y elige Instalar app.","Opens like an app, works offline":"Se abre como app, funciona sin internet","Or in Chrome, click the install icon at the right end of the address bar.":"O en Chrome, haz clic en el ícono de instalar al final de la barra de direcciones.","Other important info":"Otra información importante","Other things to know":"Otras cosas que debes saber","Paste a backup here to restore it.":"Pega aquí un respaldo para restaurarlo.","Paw Paw, Pop":"Abuelito, Tata","People":"Personas","People group":"Grupo de personas","Phone":"Teléfono","Photo credits":"Créditos de las fotos","Photo ready.":"La foto está lista.","Phrases":"Frases","Phrases are whole sentences, ready to say with one tap, like I need a break.":"Las frases son oraciones completas, listas para decir con un toque, como Necesito un descanso.","Pick a voice and speed":"Elige una voz y la velocidad","Pick a voice that fits them. Choose one that doesn't need the internet, so it always works.":"Elige una voz que le quede. Elige una que no necesite internet, para que siempre funcione.","Pick their favorite topics":"Elige sus temas favoritos","Pick their language":"Elige su idioma","Pick what they love. Each topic page has real photos, names, fun facts and its own game.":"Elige lo que le encanta. Cada página de tema tiene fotos reales, nombres, datos curiosos y su propio juego.","Picture":"Imagen","Picture (emoji)":"Imagen (emoji)","Pictures":"Imágenes","Pitch":"Tono","Places":"Lugares","Places group":"Grupo de lugares","Planets":"Planetas","Play":"Jugar","Play a game":"Jugar un juego","Play a game.":"Jugar un juego.","Play and learn":"Jugar y aprender","Play group":"Grupo de juego","Please be patient and read my screen.":"Por favor, ten paciencia y lee mi pantalla.","Please contact:":"Por favor, contacta a:","Please don't":"Por favor, no","Please find a grown-up I know.":"Por favor, busca a un adulto que yo conozca.","Please help me talk":"Por favor, ayúdame a hablar","Point to words on my screen while you talk. That's how I learn to use it.":"Señala palabras en mi pantalla mientras hablas. Así aprendo a usarla.","Pointing, sounds or gestures":"Señala, hace sonidos o gestos","Police officer":"Policía","Practice":"Practicar","Practice and games":"Práctica y juegos","Practice and play":"Practicar y jugar","Practice getting help":"Practica pedir ayuda","Practice getting help.":"Practica pedir ayuda.","Practice is on now":"La práctica está activa","Practice says a word and they find it on the board. Each topic page has a game that shows three pictures, and they pick the right one. Every round ends in a win.":"Practicar dice una palabra y la busca en el tablero. Cada página de tema tiene un juego con tres imágenes, y elige la correcta. Cada ronda termina en un triunfo.","Print a one-page card for teachers, sitters and doctors. It says how they talk, how to help, how they say yes and no, what helps them calm down, and who to call. Fill in what you like, then print it or save it as a file.":"Imprime una tarjeta de una página para maestros, niñeras y doctores. Dice cómo habla, cómo ayudarle, cómo dice sí y no, qué le ayuda a calmarse y a quién llamar. Llena lo que quieras, luego imprímela o guárdala como archivo.","Print card":"Imprimir tarjeta","Printing isn't available here. Use Save card file instead.":"Aquí no se puede imprimir. Usa Guardar archivo de la tarjeta.","Privacy policy":"Política de privacidad","Profile":"Perfil","Profile and level":"Perfil y nivel","Progress, setup steps, safety":"Progreso, pasos de configuración, seguridad","Put Speakeasy on the home screen so it opens like an app, works without Wi-Fi and keeps their words safer. The steps fit your phone, tablet or computer.":"Pon Speakeasy en la pantalla de inicio para que se abra como app, funcione sin Wi-Fi y cuide mejor sus palabras. Los pasos son para tu teléfono, tableta o computadora.","Questions":"Preguntas","Questions group":"Grupo de preguntas","Read it to me":"Léemelo","Read the caregiver guide":"Lee la guía para cuidadores","Real bird photos are built into Speakeasy, so they work offline too. They come from Wikimedia Commons under free licenses, and every photographer is credited. The few birds without a free photo show a drawing.":"Las fotos reales de pájaros vienen dentro de Speakeasy, así que también funcionan sin internet. Vienen de Wikimedia Commons con licencias libres, y cada fotógrafo tiene su crédito. Los pocos pájaros sin foto libre muestran un dibujo.","Real photos":"Fotos reales","Red Help button":"Botón rojo de Ayuda","Restore":"Restaurar","Restore from file":"Restaurar desde archivo","Restore from text":"Restaurar desde texto","Restore points":"Puntos de restauración","Run away":"Salir corriendo","Safety":"Seguridad","Sat":"sáb","Save":"Guardar","Save Speakeasy to this device":"Guarda Speakeasy en este aparato","Save Speakeasy to this device. It opens like an app and works without Wi-Fi.":"Guarda Speakeasy en este aparato. Se abre como una app y funciona sin Wi-Fi.","Save a backup file":"Guarda un archivo de respaldo","Save a backup file after big changes and keep it in your email or cloud drive. Install Speakeasy on the home screen so it works without internet.":"Guarda un archivo de respaldo después de cambios grandes y tenlo en tu correo o tu nube. Instala Speakeasy en la pantalla de inicio para que funcione sin internet.","Save and continue":"Guardar y seguir","Save backup file":"Guardar archivo de respaldo","Save card file":"Guardar archivo de la tarjeta","Save to this device":"Guardar en este aparato","Saved on this device":"Guardado en este aparato","Saved to this device":"Guardado en este aparato","Saved, but with limited room on this device. Keep backup files.":"Guardado, pero con poco espacio en este aparato. Guarda archivos de respaldo.","Saving Speakeasy puts it on the home screen like any other app. It opens full screen, works without Wi-Fi, and keeps their words safer.":"Guardar Speakeasy lo pone en la pantalla de inicio como cualquier otra app. Se abre en pantalla completa, funciona sin Wi-Fi y cuida mejor sus palabras.","Saving files isn't available here.":"Aquí no se pueden guardar archivos.","Saving files isn't available here. Open Speakeasy from its own web address to save the card.":"Aquí no se pueden guardar archivos. Abre Speakeasy desde su propia dirección web para guardar la tarjeta.","Saving files isn't available here. Use Copy backup text instead.":"Aquí no se pueden guardar archivos. Usa Copiar texto de respaldo.","Say each word when tapped":"Decir cada palabra al tocarla","Say it and show it big":"Decirlo y mostrarlo grande","Say this":"Decir esto","Scanning":"Escaneo","Scanning highlights one choice at a time. Choose with the big button at the bottom, the Space key, or a Bluetooth switch set to send Space. Listening scanning reads each choice aloud, for users who are blind or have low vision.":"El escaneo ilumina una opción a la vez. Elige con el botón grande de abajo, la tecla Espacio o un switch Bluetooth que envíe Espacio. El escaneo con voz lee cada opción en voz alta, para personas ciegas o con baja visión.","Scanning lights up one choice at a time, and they choose with one big button or a switch. Listening scanning reads each choice out loud.":"El escaneo ilumina una opción a la vez, y se elige con un botón grande o un switch. El escaneo con voz lee cada opción en voz alta.","School group":"Grupo de escuela","Score":"Puntos","Screen stays on":"La pantalla se queda prendida","Scroll down and tap Add to Home Screen.":"Baja y toca Agregar a pantalla de inicio.","Sea animals":"Animales del mar","See it big.":"Velo en grande.","See the suggested level":"Ver el nivel sugerido","See the words they use most, how often they talk, practice scores, and what to set up next. It tells you when they may be ready for the next level.":"Mira las palabras que más usa, qué tan seguido habla, los puntajes de práctica y qué falta configurar. Te avisa cuando quizá está listo para el siguiente nivel.","See where a word lives":"Ver dónde está una palabra","Set up Help card":"Configurar la tarjeta de Ayuda","Set up emergency contacts":"Configura los contactos de emergencia","Set up, teach and keep safe":"Configurar, enseñar y cuidar","Settings":"Ajustes","Settings sections":"Secciones de ajustes","Settings. Hold to open.":"Ajustes. Mantén presionado para abrir.","Setup steps":"Pasos de configuración","Setup steps done":"Pasos de configuración hechos","Short (0.3s)":"Corto (0.3 s)","Should I show their home address?":"¿Debo mostrar su domicilio?","Show and hide":"Mostrar y ocultar","Show emergency contacts":"Mostrar contactos de emergencia","Show everything":"Mostrar todo","Show favorite things":"Mostrar cosas favoritas","Show home address on the Help card":"Mostrar el domicilio en la tarjeta de Ayuda","Show me":"Muéstrame","Show me how":"Muéstrame cómo","Show my Help card":"Mostrar mi tarjeta de Ayuda","Show names":"Mostrar nombres","Show only what they need":"Muestra solo lo que necesita","Show them how it works":"Muéstrale cómo funciona","Show words they use most":"Mostrar las palabras que más usa","Shows and says who to call":"Muestra y dice a quién llamar","Simple steps for the user":"Pasos sencillos para el usuario","Single words or pictures":"Palabras sueltas o imágenes","Skip":"Saltar","Skip for now":"Saltar por ahora","Small dogs":"Perros pequeños","Small words like it, is and do show just the word, because a picture would confuse. Speech therapists often do the same.":"Las palabras pequeñas como eso, es y hacer muestran solo la palabra, porque una imagen confundiría. Los terapeutas del habla hacen lo mismo.","Social":"Social","Social group":"Grupo social","Some buttons are missing. Where did they go?":"Faltan algunos botones. ¿A dónde se fueron?","Some familiar words":"Algunas palabras conocidas","Something else makes its own topic page. Add its words and photos from your phone in Settings, Edit words.":"Otra cosa crea su propia página de tema. Agrega sus palabras y fotos desde tu teléfono en Ajustes, Editar palabras.","Something else? Like horses or tractors":"¿Otra cosa? Como caballos o tractores","Sounds":"Sonidos","Space":"El espacio","Space game":"Juego del espacio","Spanish":"español","Sparkle":"Destellos","Sparkle adds color bursts, bouncing buttons and a bird that flies by when you speak. Calm turns all movement off. Some autistic kids love the extra excitement and others find it too much, so try both. Core words never move in either look.":"Destellos agrega chispas de color, botones que rebotan y un pájaro que pasa volando cuando hablas. Tranquilo apaga todo el movimiento. A algunos niños autistas les encanta la emoción extra y a otros les parece demasiado, así que prueben los dos. Las palabras básicas nunca se mueven en ningún estilo.","Speak":"Hablar","Speak message":"Decir el mensaje","Speakeasy":"Speakeasy","Speakeasy can't save on this device right now. Open Settings and save a backup file.":"Speakeasy no puede guardar en este aparato ahora. Abre Ajustes y guarda un archivo de respaldo.","Speakeasy fits itself to each person. Tell it a little about who's using it. You can change any of this later.":"Speakeasy se adapta a cada persona. Cuéntale un poco de quién lo va a usar. Puedes cambiar todo esto después.","Speakeasy is a communication tool, not therapy. A speech-language pathologist can help choose the right words, settings and goals.":"Speakeasy es una herramienta para comunicarse, no una terapia. Un terapeuta del habla y lenguaje puede ayudar a elegir las palabras, ajustes y metas correctas.","Speakeasy is a communication tool, not therapy. A speech-language pathologist can help choose the right words, settings and goals. Using a talking device does not stop speech from developing. Research shows it often helps.":"Speakeasy es una herramienta para comunicarse, no una terapia. Un terapeuta del habla y lenguaje puede ayudar a elegir las palabras, ajustes y metas correctas. Usar un aparato para hablar no impide que se desarrolle el habla. Los estudios muestran que muchas veces ayuda.","Speakeasy is already installed on this device.":"Speakeasy ya está instalado en este aparato.","Speakeasy is saved on this device.":"Speakeasy está guardado en este aparato.","Speakeasy saves a restore point each day it's opened and before big changes, and keeps the last 7. Use one to undo a mistake.":"Speakeasy guarda un punto de restauración cada día que se abre y antes de cambios grandes, y guarda los últimos 7. Usa uno para deshacer un error.","Speakeasy shows you where the word lives, so it gets easier to find next time.":"Speakeasy te muestra dónde vive la palabra, para que sea más fácil encontrarla la próxima vez.","Speakeasy v1.8 by McLearn Media LLC. Word symbols are from Mulberry Symbols by Steve Lee (mulberrysymbols.org), used under the CC BY-SA 4.0 license, plus symbols drawn by McLearn Media for feelings and people words. Bird illustrations are original McLearn Media artwork. Photos come from Wikimedia Commons under free licenses, credited in Settings, Photo credits. Everything you add stays on this device. Nothing is sent anywhere, and there's no tracking.":"Speakeasy v1.8 de McLearn Media LLC. Los símbolos de palabras son de Mulberry Symbols de Steve Lee (mulberrysymbols.org), usados bajo la licencia CC BY-SA 4.0, más símbolos dibujados por McLearn Media para sentimientos y personas. Las ilustraciones de pájaros son arte original de McLearn Media. Las fotos vienen de Wikimedia Commons con licencias libres, con crédito en Ajustes, Créditos de las fotos. Todo lo que agregas se queda en este aparato. No se envía nada a ningún lado y no hay rastreo.","Speaking out loud":"Hablar en voz alta","Speed":"Velocidad","Spell any word":"Escribe cualquier palabra","Sports":"Deportes","Start":"Empezar","Start of the day":"Inicio del día","Start over":"Empezar de nuevo","Start practice":"Empezar práctica","Start small and add more as they learn. Words that aren't showing yet keep their real places, so nothing moves when more appear. The 48-button board fits more words and works best on a tablet. Pick one board size and stay with it, because changing sizes moves the words.":"Empieza con poco y agrega más mientras aprende. Las palabras que todavía no se ven guardan su lugar real, así que nada se mueve cuando aparecen más. El tablero de 48 botones tiene más palabras y funciona mejor en tableta. Elige un tamaño de tablero y quédate con él, porque cambiar de tamaño mueve las palabras.","Stay still":"Quedarse quieto","Steps for other devices":"Pasos para otros aparatos","Still stuck?":"¿Sigues con dudas?","Stop practice":"Parar práctica","Stuck on something?":"¿Atorado con algo?","Suggested":"Sugerido","Suggested level":"Nivel sugerido","Suggests the right level":"Sugiere el nivel correcto","Switch and listening access":"Acceso por switch y escucha","Switch between people":"Cambiar de persona","Switch or add a person":"Cambiar o agregar a una persona","Switch scanning":"Escaneo por switch","Switches and keyboards":"Switches y teclados","Take me there":"Llévame ahí","Talk":"Hablar","Talk to me, not about me. I understand more than I can say.":"Háblame a mí, no sobre mí. Entiendo más de lo que puedo decir.","Talking":"Hablar","Talking pages":"Páginas para hablar","Talking this week":"Hablando esta semana","Talking-app symbols":"Símbolos para hablar","Talking-app symbols are drawn to match each word, the same style speech therapists use. Emoji are the small pictures from phones. A few small words, like it and is, show just the word, because a picture would confuse.":"Los símbolos para hablar están dibujados para cada palabra, en el estilo que usan los terapeutas del habla. Los emoji son las imágenes pequeñas de los teléfonos. Algunas palabras pequeñas, como eso y es, muestran solo la palabra, porque una imagen confundiría.","Tap 3 words":"Toca 3 palabras","Tap Add. Speakeasy is now on your home screen.":"Toca Agregar. Speakeasy ya está en tu pantalla de inicio.","Tap Install app, or Add to Home screen.":"Toca Instalar app, o Agregar a pantalla de inicio.","Tap Install when it appears at the bottom, or tap the ⋮ menu at the top right.":"Toca Instalar cuando aparezca abajo, o toca el menú ⋮ arriba a la derecha.","Tap Install. Speakeasy is now with your apps.":"Toca Instalar. Speakeasy ya está con tus apps.","Tap Keyboard at the top. Type letters, then tap a suggested word or the space key. The keyboard shows at Level 2 and up.":"Toca Teclado arriba. Escribe letras y luego toca una palabra sugerida o la tecla de espacio. El teclado se ve desde el nivel 2.","Tap Practice, the target button at the top. Speakeasy says a word, and they find it on the board. Tap Done to stop.":"Toca Practicar, el botón del blanco arriba. Speakeasy dice una palabra y la busca en el tablero. Toca Listo para parar.","Tap Speak to say it all.":"Toca Hablar para decirlo todo.","Tap a picture to just say it.":"Toca una imagen para solo decirla.","Tap a picture to say it and see it big.":"Toca una imagen para decirla y verla grande.","Tap a word. Speakeasy says it.":"Toca una palabra. Speakeasy la dice.","Tap here (or press Space) to choose":"Toca aquí (o presiona Espacio) para elegir","Tap more words to make a sentence.":"Toca más palabras para hacer una oración.","Tap the Share button, the square with an arrow pointing up.":"Toca el botón Compartir, el cuadro con una flecha hacia arriba.","Tap the X at the top left. When the caregiver lock is on, hold the X for one second.":"Toca la X arriba a la izquierda. Cuando el candado para cuidadores está activo, mantén presionada la X un segundo.","Tap the buttons at the top, like Groups or Phrases, to see more words.":"Toca los botones de arriba, como Grupos o Frases, para ver más palabras.","Tap the dog":"Toca el perro","Tap the dog.":"Toca el perro.","Tap the magnifying glass at the top and type the word. Speakeasy takes you to it and makes it glow, so it's easier to find next time.":"Toca la lupa de arriba y escribe la palabra. Speakeasy te lleva a ella y la hace brillar, para que sea más fácil encontrarla la próxima vez.","Tap the name and picture at the top, then tap the person.":"Toca el nombre y la imagen de arriba, luego toca a la persona.","Tap the name at the top, then hold Add a person for 2 seconds. Each person gets their own words, voice, level and progress.":"Toca el nombre de arriba y luego mantén presionado Agregar a una persona 2 segundos. Cada persona tiene sus propias palabras, voz, nivel y progreso.","Tap the plus-minus button to change a word, like want to wants or wanted.":"Toca el botón de más o menos para cambiar una palabra, como want a wants o wanted.","Tap the red Help button. It shows their name and the people to call, with Call, Text, Video and Email buttons, and says it out loud. A helper can tap Call to reach someone right away.":"Toca el botón rojo de Ayuda. Muestra su nombre y las personas a quién llamar, con botones para Llamar, Mensaje, Video y Correo, y lo dice en voz alta. Alguien que ayude puede tocar Llamar para contactar a alguien de inmediato.","Tap the word, then tap the plus-minus button next to the message. Pick the word you want. This shows at Level 2 and up.":"Toca la palabra y luego el botón de más o menos junto al mensaje. Elige la palabra que quieres. Esto se ve desde el nivel 2.","Tap words one after another. They line up in the bar at the top. Then tap Speak, or tap the sentence itself, to say it all.":"Toca palabras una tras otra. Se acomodan en la barra de arriba. Luego toca Hablar, o toca la oración, para decirla toda.","Tap words or type to build a message":"Toca palabras o escribe para hacer un mensaje","Tap words to talk":"Toca palabras para hablar","Teen":"Adolescente","Test voice":"Probar voz","Text":"Mensaje","Thank you!":"¡Gracias!","That file couldn't be opened. Try again.":"No se pudo abrir ese archivo. Inténtalo otra vez.","That file isn't a Speakeasy backup. Choose a file named speakeasy-backup.":"Ese archivo no es un respaldo de Speakeasy. Elige un archivo que se llame speakeasy-backup.","That photo couldn't be opened. Try a JPG or PNG.":"No se pudo abrir esa foto. Prueba con JPG o PNG.","That text isn't a Speakeasy backup. Paste the whole backup and try again.":"Ese texto no es un respaldo de Speakeasy. Pega todo el respaldo e inténtalo otra vez.","That's on purpose. Some voices read I as capital I. Speakeasy always says it as the word I. The screen still shows I.":"Es a propósito. Algunas voces leen I como letra. Speakeasy siempre la dice como la palabra I. La pantalla sigue mostrando I.","The 48-button board with more words and every tool. Words sit in new places on this bigger board.":"El tablero de 48 botones con más palabras y todas las herramientas. Las palabras están en otros lugares en este tablero más grande.","The Call or Text button doesn't work.":"El botón de Llamar o Mensaje no funciona.","The Dashboard tells you when they may be ready for more.":"El Panel te avisa cuando quizá está listo para más.","The Menu has every part of Speakeasy in one place.":"El Menú tiene todas las partes de Speakeasy en un solo lugar.","The Speak button says your whole sentence out loud. You can also tap the sentence.":"El botón Hablar dice toda tu oración en voz alta. También puedes tocar la oración.","The back arrow takes away the last word. The X clears everything.":"La flecha para atrás quita la última palabra. La X borra todo.","The back arrow takes away the last word. The X clears the whole message.":"La flecha para atrás quita la última palabra. La X borra todo el mensaje.","The device could clear storage if it runs low on space. Saving Speakeasy to the device and keeping a backup file protects their words.":"El aparato podría borrar el almacenamiento si se queda sin espacio. Guardar Speakeasy en el aparato y tener un archivo de respaldo protege sus palabras.","The device needs a Spanish voice. Open the Menu, then This device. It shows how to add a Spanish voice on your phone, tablet or computer.":"El aparato necesita una voz en español. Abre el Menú y luego Este aparato. Ahí dice cómo agregar una voz en español en tu teléfono, tableta o computadora.","The level check can suggest the best fit.":"La prueba de nivel puede sugerir el mejor.","The main talking board":"El tablero principal para hablar","The red Help button shows these people with Call, Text, Video and Email buttons, so they or a helper can reach someone fast. The home address stays hidden unless you turn it on, because anyone who picks up the device could see it. Location is added only when they tap Text or Email, and only if the device allows it. Everything stays on this device. Calls and texts need a phone with service.":"El botón rojo de Ayuda muestra a estas personas con botones para Llamar, Mensaje, Video y Correo, para que la persona o alguien que la ayude se comunique rápido. El domicilio queda oculto a menos que lo actives, porque cualquiera que agarre el aparato lo podría ver. La ubicación se agrega solo cuando tocan Mensaje o Correo, y solo si el aparato lo permite. Todo se queda en este aparato. Las llamadas y los mensajes necesitan un teléfono con servicio.","The screen stays awake while Speakeasy is open.":"La pantalla se queda prendida mientras Speakeasy está abierto.","Their favorite words are great ones to model. Use them in short sentences on the board while you talk.":"Sus palabras favoritas son muy buenas para modelar. Úsalas en oraciones cortas en el tablero mientras hablas.","Their first name":"Su primer nombre","Their name":"Su nombre","Their own words and progress":"Sus propias palabras y progreso","There's no sound. What do I do?":"No hay sonido. ¿Qué hago?","These word groups come first for them.":"Estos grupos de palabras salen primero para esta persona.","They come from Wikimedia Commons under free licenses. Each photographer is named under the big picture and in Settings, Topics, Photo credits.":"Vienen de Wikimedia Commons con licencias libres. Cada fotógrafo aparece debajo de la imagen grande y en Ajustes, Temas, Créditos de las fotos.","They tap things by accident. What helps?":"Toca cosas sin querer. ¿Qué ayuda?","Things I love":"Cosas que me encantan","Things that go":"Cosas que se mueven","This browser can't speak out loud. Messages will show as text.":"Este navegador no puede hablar en voz alta. Los mensajes se mostrarán como texto.","This browser can't speak. Messages show as text. Try Safari on iPhone or iPad, Chrome on Android, or Chrome or Edge on a computer.":"Este navegador no puede hablar. Los mensajes se muestran como texto. Prueba Safari en iPhone o iPad, Chrome en Android, o Chrome o Edge en una computadora.","This browser may let the screen dim. Turn up Auto-Lock or Screen timeout in the device settings.":"Este navegador puede dejar que la pantalla se oscurezca. Sube el Bloqueo automático o el Tiempo de pantalla en los ajustes del aparato.","This device":"Este aparato","This device blocked the file.":"Este aparato bloqueó el archivo.","This device blocked the file. Use Copy backup text instead.":"Este aparato bloqueó el archivo. Usa Copiar texto de respaldo.","This device has no voice for this language yet. Open the Menu, then This device, to add one.":"Este aparato todavía no tiene una voz para este idioma. Abre el Menú y luego Este aparato para agregar una.","This device isn't saving changes. Save a backup file now.":"Este aparato no está guardando cambios. Guarda ahora un archivo de respaldo.","This device shows what works here: a voice in their language, working offline, and voice control. If something is missing, it shows how to add it.":"Este aparato muestra lo que funciona aquí: una voz en su idioma, funcionar sin internet y el control por voz. Si falta algo, muestra cómo agregarlo.","This device won't clear Speakeasy's storage on its own.":"Este aparato no borrará solo el almacenamiento de Speakeasy.","This group needs at least 3 words with pictures to play.":"Este grupo necesita por lo menos 3 palabras con imagen para jugar.","This is a starting point, not a test score or a diagnosis.":"Esto es un punto de partida, no una calificación ni un diagnóstico.","This is not a test score or a diagnosis. There are no wrong answers, and you can change the level anytime.":"No es una calificación ni un diagnóstico. No hay respuestas incorrectas, y puedes cambiar el nivel cuando quieras.","This topic is empty. Add words and photos in Settings, Edit words.":"Este tema está vacío. Agrega palabras y fotos en Ajustes, Editar palabras.","Thu":"jue","Time and weather":"Tiempo y clima","Time and weather group":"Grupo de tiempo y clima","Time on each choice":"Tiempo en cada opción","Tools":"Herramientas","Topic pages":"Páginas de temas","Topic pages are about things they love, like Birds, Dogs, Space or Trains. Each has real photos, names, fun facts and a game. Pick them in the profile.":"Las páginas de temas son sobre cosas que le encantan, como Pájaros, Perros, El espacio o Trenes. Cada una tiene fotos reales, nombres, datos curiosos y un juego. Elígelas en el perfil.","Topics":"Temas","Touch":"Toque","Touch and access":"Toque y acceso","Toys and games":"Juguetes y juegos","Trees":"Árboles","Trucks, Dinosaurs, Trains…":"Camiones, dinosaurios, trenes…","Try Help practice":"Prueba la práctica de ayuda","Try other words, like voice, photo, level, backup or game. Or open a topic below.":"Prueba con otras palabras, como voz, foto, nivel, respaldo o juego. O abre un tema abajo.","Tue":"mar","Turn on Big picture on a topic page. Then tap a picture to see all of it, big. Tap anywhere to go back.":"Activa Imagen grande en una página de tema. Luego toca una imagen para verla completa y grande. Toca donde sea para regresar.","Turn on scanning if tapping is hard":"Activa el escaneo si tocar es difícil","Turn the device volume up. On an iPhone or iPad, check the silent switch on the side. Then open Settings, Voice, and tap Test voice. If you picked a voice marked needs internet, choose another one.":"Sube el volumen del aparato. En un iPhone o iPad, revisa el interruptor de silencio del lado. Luego abre Ajustes, Voz, y toca Probar voz. Si elegiste una voz marcada necesita internet, elige otra.","Two or three words together":"Dos o tres palabras juntas","Type a name for the topic first.":"Primero escribe un nombre para el tema.","Type a question, get an answer":"Escribe una pregunta y recibe una respuesta","Type a word, like eat or eagle":"Escribe una palabra, como comer o águila","Type the word first.":"Primero escribe la palabra.","Type their name first.":"Primero escribe su nombre.","Type your question":"Escribe tu pregunta","U.S. states":"Estados de EE. UU.","Uncle Ray":"Tío Ray","Use the names they know":"Usa los nombres que conoce","Video":"Video","Video call":"Videollamada","Voice":"Voz","Voice control":"Control por voz","Voices come from this device. Voices marked “needs internet” stop working offline, so pick one without that label for everyday use.":"Las voces vienen de este aparato. Las voces marcadas “necesita internet” dejan de funcionar sin internet, así que elige una sin esa marca para el día a día.","Voices, offline, voice control":"Voces, sin internet, control por voz","Water birds":"Aves acuáticas","We don't have an answer for that yet.":"Todavía no tenemos una respuesta para eso.","Wed":"mié","Welcome to Speakeasy":"Bienvenido a Speakeasy","What are Phrases?":"¿Qué son las Frases?","What are Word groups?":"¿Qué son los Grupos de palabras?","What are fun facts?":"¿Qué son los datos curiosos?","What are topic pages?":"¿Qué son las páginas de temas?","What do the levels mean?":"¿Qué significan los niveles?","What helps me calm down":"Qué me ayuda a calmarme","What is Help practice?":"¿Qué es la práctica de ayuda?","What is the Dashboard?":"¿Qué es el Panel?","What is the level check?":"¿Qué es la prueba de nivel?","What they call family":"Cómo le dice a su familia","When I'm upset, I may":"Cuando estoy molesto, puedo","When should we move up a level?":"¿Cuándo debemos subir de nivel?","When the words they have feel easy. The Dashboard tells you when they use most of their words often. You can move up or down anytime.":"Cuando las palabras que tiene se sienten fáciles. El Panel te avisa cuando usa casi todas sus palabras seguido. Puedes subir o bajar cuando quieras.","When they tap a picture":"Cuando toca una imagen","When you talk to them, tap the same words on the screen as you say them. This is called modeling, and it's the fastest way people learn to use a talking app. Don't ask them to copy you. Just show.":"Cuando le hables, toca las mismas palabras en la pantalla mientras las dices. Esto se llama modelar, y es la forma más rápida de aprender a usar una app para hablar. No le pidas que te copie. Solo muéstrale.","Where is the keyboard?":"¿Dónde está el teclado?","Where is their information kept?":"¿Dónde se guarda su información?","Who is a good helper to show your card?":"¿Quién es una buena persona para mostrarle tu tarjeta?","Who they are":"Quién es","Who took these photos?":"¿Quién tomó estas fotos?","Who's talking":"Quién habla","Who's talking?":"¿Quién habla?","Whole sentences, ready to say":"Oraciones completas, listas para decir","Why do I see a drawing or a symbol instead of a photo?":"¿Por qué veo un dibujo o un símbolo en vez de una foto?","Why do some buttons have no picture?":"¿Por qué algunos botones no tienen imagen?","Why does it say I like the word eye?":"¿Por qué dice I como la palabra eye?","Will it work on my phone, tablet and computer?":"¿Funcionará en mi teléfono, tableta y computadora?","Windows computer":"computadora Windows","With the caregiver lock on, settings open only when you hold the gear for 2 seconds. That keeps changes safe from curious fingers.":"Con el candado para cuidadores activo, los ajustes solo se abren si mantienes presionado el engrane 2 segundos. Así los cambios están a salvo de deditos curiosos.","Word endings":"Terminaciones","Word endings, like wants or wanted":"Terminaciones, como wants o wanted","Word group":"Grupo de palabras","Word groups":"Grupos de palabras","Word groups hold more words by topic, like Feelings, Food and People. Tap a group to open it. Their favorite groups come first.":"Los grupos de palabras tienen más palabras por tema, como Sentimientos, Comida y Personas. Toca un grupo para abrirlo. Sus grupos favoritos salen primero.","Word pictures":"Imágenes de las palabras","Word suggestions":"Palabras sugeridas","Word to find":"Palabra a buscar","Words I use a lot":"Palabras que uso mucho","Words only (no pictures)":"Solo palabras (sin imágenes)","Words protected":"Palabras protegidas","Words they like to talk about":"Palabras de las que le gusta hablar","Words, photos and games are stored on this device.":"Las palabras, fotos y juegos están guardados en este aparato.","Words, phrases, topic pages and the voice use this language.":"Las palabras, frases, páginas de temas y la voz usan este idioma.","Work":"Trabajo","Work group":"Grupo de trabajo","Works offline from the home screen":"Funciona sin internet desde la pantalla de inicio","Works without Wi-Fi":"Funciona sin Wi-Fi","YES!":"¡SÍ!","Yes!":"¡Sí!","Yes, if you turn on Add their location in the Help card settings. It's added only when they tap Text or Email, and only if the device allows it.":"Sí, si activas Agregar su ubicación en los ajustes de la tarjeta de Ayuda. Se agrega solo cuando toca Mensaje o Correo, y solo si el aparato lo permite.","Yes, often":"Sí, seguido","Yes, once it's installed and opened online one time. Words, photos, games and voices without the needs internet label all work offline.":"Sí, una vez instalado y abierto con internet una vez. Las palabras, fotos, juegos y las voces sin la marca necesita internet funcionan sin internet.","Yes. In the profile, choose Español. Words, phrases, topic pages, the Help card and the screens switch to Spanish, and it speaks Spanish. Each person on the device can have their own language.":"Sí. En el perfil, elige Español. Las palabras, frases, páginas de temas, la tarjeta de Ayuda y las pantallas cambian a español, y habla español. Cada persona en el aparato puede tener su propio idioma.","Yes. Open Settings, Keep their words safe, Restore points. Speakeasy keeps the last 7.":"Sí. Abre Ajustes, Cuida sus palabras, Puntos de restauración. Speakeasy guarda los últimos 7.","Yes. Open Settings, Look and feel, and pick Calm. That turns off all movement.":"Sí. Abre Ajustes, Estilo y sensación, y elige Tranquilo. Eso apaga todo el movimiento.","Yes. Open Settings, Switch and listening access, and turn on scanning. Choices light up one at a time. They choose with the big button, the Space key or a Bluetooth switch.":"Sí. Abre Ajustes, Acceso por switch y escucha, y activa el escaneo. Las opciones se iluminan una a la vez. Elige con el botón grande, la tecla Espacio o un switch Bluetooth.","Yes. Open Settings, Voice, and turn off Say each word when tapped. Then it only talks when you tap Speak.":"Sí. Abre Ajustes, Voz, y apaga Decir cada palabra al tocarla. Así solo habla cuando tocas Hablar.","Yes. Open Settings, Word pictures. Talking-app symbols are drawn to match each word. Emoji are the small pictures from phones. You can also add your own photo for any word in Edit words.":"Sí. Abre Ajustes, Imágenes de las palabras. Los símbolos para hablar están dibujados para cada palabra. Los emoji son las imágenes pequeñas de los teléfonos. También puedes agregar tu propia foto para cualquier palabra en Editar palabras.","Yes. Speakeasy works in the web browser on iPhone, iPad, Android, Chromebooks, Windows and Mac. Open the Menu, then This device, to see what works on the one you're using.":"Sí. Speakeasy funciona en el navegador de iPhone, iPad, Android, Chromebooks, Windows y Mac. Abre el Menú y luego Este aparato para ver qué funciona en el que estás usando.","Yes. Turn on Listening scanning in Settings, Switch and listening access. It reads each choice as it lights up.":"Sí. Activa Escaneo con voz en Ajustes, Acceso por switch y escucha. Lee cada opción cuando se ilumina.","Yes. iPhone and iPad have Voice Control, Android has Voice Access, and computers have voice control too. Every Speakeasy button has a name to say, like Tap Help. Open the Menu, then This device, for the steps.":"Sí. iPhone y iPad tienen Control por voz, Android tiene Voice Access, y las computadoras también tienen control por voz. Cada botón de Speakeasy tiene un nombre para decir, como Toca Ayuda. Abre el Menú y luego Este aparato para ver los pasos.","You are lost and need help. What do you do?":"Estás perdido y necesitas ayuda. ¿Qué haces?","You can save Speakeasy anytime from the Menu.":"Puedes guardar Speakeasy cuando quieras desde el Menú.","You did it! You know how to get help.":"¡Lo lograste! Ya sabes cómo pedir ayuda.","Young child":"Niño pequeño","Your topic pages have real pictures. Tap one to hear its name.":"Tus páginas de temas tienen imágenes reales. Toca una para oír su nombre.","Your words line up at the top, like I want more.":"Tus palabras se acomodan arriba, como Quiero más.","a quiet place, my headphones, a hug if I ask.":"un lugar tranquilo, mis audífonos, un abrazo si lo pido.","age group":"edad","and tell us what happened.":"y cuéntanos qué pasó.","best bird game streak":"mejor racha en el juego de pájaros","core board":"tablero básico","core words showing":"palabras básicas que se ven","cover my ears, rock or walk away.":"taparme los oídos, mecerme o irme.","days used":"días de uso","different words, all time":"palabras diferentes, en total","favorite things":"cosas favoritas","iPhone or iPad":"iPhone o iPad","letter":"letra","messages spoken":"mensajes dichos","of tries were right":"de los intentos fueron correctos","practice right now":"práctica ahora","scanning":"escaneo","space":"espacio","touch me without asking, or talk too loud.":"tocarme sin pedir permiso, o hablar muy fuerte.","voice":"voz","words and birds found":"palabras y pájaros encontrados","words tapped":"palabras tocadas","About 2 minutes.":"Unos 2 minutos.","Speakeasy suggests a level to start with.":"Speakeasy sugiere un nivel para empezar.","A one-page card for teachers, sitters, doctors and anyone new.":"Una tarjeta de una página para maestros, niñeras, doctores y cualquier persona nueva.","Fill in what you like.":"Llena lo que quieras.","Blank lines are left off the card.":"Las líneas vacías no salen en la tarjeta.","Type the name they use.":"Escribe el nombre que usa.","Speakeasy will say that name.":"Speakeasy dirá ese nombre.","Leave a box empty to keep the usual word.":"Deja la casilla vacía para usar la palabra de siempre.","Fewer buttons means fewer distractions.":"Menos botones es menos distracción.","Turn things back on anytime.":"Vuelve a encender lo que quieras cuando quieras.","The settings gear always stays.":"El engrane de ajustes siempre se queda.","This is a preview link":"Este es un enlace de vista previa","A preview can't be saved as a full app.":"Una vista previa no se puede guardar como app completa.","Open Speakeasy from its own web address, which the person who shared it can send you.":"Abre Speakeasy desde su propia dirección web, que te puede enviar la persona que lo compartió.","You can still add this page to your home screen as a shortcut, but it needs internet.":"Aun así puedes agregar esta página a tu pantalla de inicio como acceso directo, pero necesita internet.","Open it from your home screen or app list.":"Ábrelo desde tu pantalla de inicio o tu lista de apps.","It works without Wi-Fi.":"Funciona sin Wi-Fi.","Firefox on computers can't save apps.":"Firefox en computadoras no puede guardar apps.","Use Chrome or Edge instead.":"Usa Chrome o Edge.","Sun":"dom","Beginner":"Principiante","Find it game":"Juego de buscar","dog":"perro","apple":"manzana","car":"carro","Edit profile":"Editar perfil","Edit words":"Editar palabras","Find more words at the top.":"Encuentra más palabras arriba.","Find words on the board":"Busca palabras en el tablero","Find the right level":"Encuentra el nivel correcto","Find the right picture":"Encuentra la imagen correcta","No word like that yet. Caregivers can add it in Settings, Edit words.":"Todavía no hay una palabra así. Los cuidadores la pueden agregar en Ajustes, Editar palabras.","device":"aparato","Next":"Siguiente","Start talking":"Empezar a hablar","Welcome to Speakeasy.":"Bienvenido a Speakeasy.","Here's how it works.":"Así funciona.","You can open this again anytime from the Menu.":"Puedes abrir esto otra vez cuando quieras desde el Menú.","Speakeasy v1.9 by McLearn Media LLC. Word symbols are from Mulberry Symbols by Steve Lee (mulberrysymbols.org), used under the CC BY-SA 4.0 license, plus symbols drawn by McLearn Media for feelings and people words. Bird illustrations are original McLearn Media artwork. Photos come from Wikimedia Commons under free licenses, credited in Settings, Photo credits. Everything you add stays on this device. Nothing is sent anywhere, and there's no tracking.":"Speakeasy v1.9 de McLearn Media LLC. Los símbolos de palabras son de Mulberry Symbols de Steve Lee (mulberrysymbols.org), usados bajo la licencia CC BY-SA 4.0, más símbolos dibujados por McLearn Media para sentimientos y personas. Las ilustraciones de pájaros son arte original de McLearn Media. Las fotos vienen de Wikimedia Commons con licencias libres, con crédito en Ajustes, Créditos de las fotos. Todo lo que agregas se queda en este aparato. No se envía nada a ningún lado y no hay rastreo.","12 big core words, phrases and their favorite topics.":"12 palabras básicas grandes, frases y sus temas favoritos.","Fewer buttons, so it's easy to start.":"Menos botones, para empezar fácil.","48-button board.":"Tablero de 48 botones.","Words have new places now.":"Las palabras ahora están en otros lugares.","A backup file holds this person's profile, words, photos and settings.":"Un archivo de respaldo guarda el perfil, las palabras, las fotos y los ajustes de esta persona.","Save one after big changes and keep it somewhere else, like your email or cloud drive.":"Guarda uno después de cambios grandes y tenlo en otro lugar, como tu correo o tu nube.","To move to a new phone or tablet, open Speakeasy there and choose Restore from file.":"Para pasar a otro teléfono o tableta, abre Speakeasy ahí y elige Restaurar desde archivo.","A few items don't have a free photo yet, so they show a drawing or symbol.":"Algunas cosas todavía no tienen una foto libre, así que muestran un dibujo o un símbolo.","You can add your own photo of anything in Edit words.":"Puedes agregar tu propia foto de cualquier cosa en Editar palabras.","A helper asks your name.":"Alguien que te ayuda te pregunta tu nombre.","Tap your answer.":"Toca tu respuesta.","A level sets the board size, button size, and which words and tools show.":"El nivel define el tamaño del tablero, el tamaño de los botones y qué palabras y herramientas se ven.","You can fine-tune each of those below in Touch and access.":"Puedes ajustar cada cosa abajo en Toque y acceso.","Levels never delete words, and core words never move.":"Los niveles nunca borran palabras, y las palabras básicas nunca se mueven.","A preview link needs internet.":"Un enlace de vista previa necesita internet.","Open Speakeasy from its own web address to use it offline.":"Abre Speakeasy desde su propia dirección web para usarlo sin internet.","A short game that teaches what to do when they need help: show the Help card, find a safe helper, say their name and a phone number.":"Un juego corto que enseña qué hacer cuando necesitan ayuda: mostrar la tarjeta de Ayuda, buscar a alguien seguro, decir su nombre y un número de teléfono.","It never really calls anyone.":"Nunca llama a nadie de verdad.","A topic is a whole page about something the person loves.":"Un tema es una página completa sobre algo que le encanta a la persona.","After you create one, add its words and real photos below in Edit words.":"Después de crearlo, agrega sus palabras y fotos reales abajo en Editar palabras.","Add the names of people, places and favorite things.":"Agrega nombres de personas, lugares y cosas favoritas.","A photo of their real cup or dog works better than a cartoon.":"Una foto de su taza o su perro de verdad funciona mejor que un dibujo.","Add their name and up to three people to call, with phone, email and video.":"Agrega su nombre y hasta tres personas a quién llamar, con teléfono, correo y video.","The red Help button shows them with Call, Text and Video buttons.":"El botón rojo de Ayuda las muestra con botones para Llamar, Mensaje y Video.","Their home address stays hidden unless you turn it on.":"Su domicilio queda oculto a menos que lo actives.","Backup sent.":"Se envió el respaldo.","Keep it somewhere safe.":"Guárdalo en un lugar seguro.","Backup text copied.":"Se copió el texto de respaldo.","Paste it into an email to yourself.":"Pégalo en un correo para ti.","Both names shows Nana with grandma underneath, which helps teachers and new caregivers.":"Los dos nombres muestra Nana con abuela abajo, lo que ayuda a maestros y cuidadores nuevos.","To use a real photo of someone, add them as a new word in People with their photo.":"Para usar una foto real de alguien, agrégalo como palabra nueva en Personas con su foto.","Calls and texts need a phone with service.":"Las llamadas y los mensajes necesitan un teléfono con servicio.","On a tablet or computer without service, use Video or Email instead.":"En una tableta o computadora sin servicio, usa Video o Correo.","In the Claude preview, these buttons may not work.":"En la vista previa de Claude, estos botones quizá no funcionen.","Open Speakeasy from its own web address.":"Abre Speakeasy desde su propia dirección web.","Choose it.":"Elígelo.","Speakeasy will open like an app.":"Speakeasy se abrirá como una app.","Click Add or Install.":"Haz clic en Agregar o Instalar.","Speakeasy is now in your Dock and Launchpad.":"Speakeasy ya está en tu Dock y en Launchpad.","Click Install.":"Haz clic en Instalar.","Speakeasy is now in your app launcher.":"Speakeasy ya está en tus aplicaciones.","Speakeasy opens in its own window and shows in the Start menu.":"Speakeasy se abre en su propia ventana y aparece en el menú Inicio.","Connected now.":"Conectado ahora.","Speakeasy checks for updates when it opens.":"Speakeasy busca actualizaciones cuando se abre.","Copying is blocked here.":"Aquí no se puede copiar.","The address is selected.":"El correo quedó seleccionado.","The text is selected, so copy it by hand.":"El texto quedó seleccionado, así que cópialo a mano.","Core words keep fixed places, so you can hide them but not move them.":"Las palabras básicas tienen lugares fijos, así que puedes ocultarlas pero no moverlas.","Add new words to another group.":"Agrega palabras nuevas en otro grupo.","Does grandma go by Nana or Gigi?":"¿La abuela es Nana o Gigi?","Type it in the profile under What they call family.":"Escríbelo en el perfil en Cómo le dice a su familia.","Speakeasy says that name, and the button can show it alone or with the usual word underneath.":"Speakeasy dice ese nombre, y el botón puede mostrarlo solo o con la palabra de siempre abajo.","Does this person call grandma Nana or Gigi?":"¿Esta persona le dice Nana o Gigi a la abuela?","Every button is a word.":"Cada botón es una palabra.","Tap one and you will hear it.":"Toca uno y lo vas a oír.","Every message counts, even one word.":"Cada mensaje cuenta, aunque sea una palabra.","Answer what I say.":"Contesta lo que digo.","Every word here is hidden.":"Todas las palabras de aquí están ocultas.","Turn some back on in Settings, Edit words.":"Vuelve a mostrar algunas en Ajustes, Editar palabras.","Everyone who uses Speakeasy gets a profile with their name, picture, age group and favorite things.":"Cada persona que usa Speakeasy tiene un perfil con su nombre, imagen, edad y cosas favoritas.","Their words, voice, level and progress stay separate.":"Sus palabras, voz, nivel y progreso quedan aparte.","Tap the name at the top to switch people.":"Toca el nombre de arriba para cambiar de persona.","Hold a button for 2 seconds to open it.":"Mantén presionado un botón 2 segundos para abrirlo.","For example: I'm autistic.":"Por ejemplo: Soy autista.","Loud noise is painful for me.":"Los ruidos fuertes me duelen.","Give me time.":"Dame tiempo.","Wait at least 10 seconds for my answer.":"Espera por lo menos 10 segundos mi respuesta.","Hands-free: install Voice Access from the Play Store, then turn it on in Settings, Accessibility.":"Sin manos: instala Voice Access desde Play Store y actívalo en Ajustes, Accesibilidad.","Then say the name of a button, like Tap Help.":"Luego di el nombre de un botón, como Toca Ayuda.","Hands-free: open Settings, Accessibility, Speech, and turn on Voice access.":"Sin manos: abre Configuración, Accesibilidad, Voz, y activa Acceso por voz.","Then say the name of a button, like Click Help.":"Luego di el nombre de un botón, como Clic en Ayuda.","Hands-free: open Settings, Accessibility, Voice Control, and turn it on.":"Sin manos: abre Ajustes, Accesibilidad, Control por voz, y actívalo.","Hands-free: open System Settings, Accessibility, Voice Control, and turn it on.":"Sin manos: abre Configuración del Sistema, Accesibilidad, Control por voz, y actívalo.","Hello.":"Hola.","I use this device to talk.":"Uso este aparato para hablar.","This is my voice.":"Esta es mi voz.","Help is off.":"Ayuda está apagado.","We recommend keeping it on.":"Te recomendamos dejarlo encendido.","Help practice teaches what to do when they need help: show the Help card, find a safe helper, say their name and a phone number.":"La práctica de ayuda enseña qué hacer cuando necesitan ayuda: mostrar la tarjeta de Ayuda, buscar a alguien seguro, decir su nombre y un número de teléfono.","Hi!":"¡Hola!","I want to play.":"Quiero jugar.","Hold the gear button at the top right for 2 seconds.":"Mantén presionado 2 segundos el engrane de arriba a la derecha.","That's the caregiver lock, so kids don't change things by accident.":"Es el candado para cuidadores, para que los niños no cambien cosas sin querer.","I can't speak right now.":"Ahora no puedo hablar.","I use this device to communicate.":"Uso este aparato para comunicarme.","I made a mistake.":"Cometí un error.","Can I undo it?":"¿Lo puedo deshacer?","I may not speak with my mouth, but I have a lot to say.":"Quizá no hablo con la boca, pero tengo mucho que decir.","My talking app, Speakeasy, is my voice.":"Mi app para hablar, Speakeasy, es mi voz.","When I tap words, it speaks for me.":"Cuando toco palabras, habla por mí.","I need help.":"Necesito ayuda.","I can't talk right now.":"Ahora no puedo hablar.","If files don't work on this device, copy the backup as text and paste it into an email to yourself.":"Si los archivos no funcionan en este aparato, copia el respaldo como texto y pégalo en un correo para ti.","Paste it back here to restore.":"Pégalo aquí otra vez para restaurarlo.","In Show and hide, turn off any page or tool they don't use yet, or use Keep only to leave just one thing.":"En Mostrar y ocultar, apaga cualquier página o herramienta que todavía no use, o usa Dejar solo para dejar una sola cosa.","Show everything brings it all back.":"Mostrar todo lo regresa todo.","In the profile, choose English or Español.":"En el perfil, elige English o Español.","Words, phrases, topic pages, the Help card and the screens switch to that language, and Speakeasy speaks it.":"Las palabras, frases, páginas de temas, la tarjeta de Ayuda y las pantallas cambian a ese idioma, y Speakeasy lo habla.","Each person can have a different language.":"Cada persona puede tener un idioma diferente.","In the profile, pick topic pages like Dogs, Space, Trees or the 50 states.":"En el perfil, elige páginas de temas como Perros, El espacio, Árboles o los 50 estados.","Each one has real photos, names, fun facts and its own game.":"Cada una tiene fotos reales, nombres, datos curiosos y su propio juego.","Type anything else they love, and it gets its own page for your words and photos.":"Escribe cualquier otra cosa que le encante, y tendrá su propia página para tus palabras y fotos.","It doesn't speak Spanish out loud.":"No habla español en voz alta.","What do I do?":"¿Qué hago?","It says each word when I tap it.":"Dice cada palabra cuando la toco.","Can I turn that off?":"¿Puedo apagar eso?","It shows setup steps, how often they talk, the words they use most, practice scores and backup status.":"Muestra los pasos de configuración, qué tan seguido habla, las palabras que más usa, los puntajes de práctica y los respaldos.","Open the Menu and hold Dashboard.":"Abre el Menú y mantén presionado Panel.","It shows who you are and who to call, and says it out loud.":"Muestra quién eres y a quién llamar, y lo dice en voz alta.","A helper can tap Call or Text.":"Alguien que te ayude puede tocar Llamar o Mensaje.","It takes about 2 minutes.":"Toma unos 2 minutos.","They try 3 picture games, then you answer 4 questions.":"Hace 3 juegos de imágenes y luego tú contestas 4 preguntas.","It suggests a starting level.":"Sugiere un nivel para empezar.","It is not a test score or a diagnosis.":"No es una calificación ni un diagnóstico.","Keep my talking app with me and charged.":"Deja mi app para hablar conmigo y con carga.","Please never take it away, even when I'm upset.":"Por favor, nunca me la quites, aunque esté molesto.","Keep only turns everything else off.":"Dejar solo apaga todo lo demás.","The Help button stays on unless you turn it off yourself.":"El botón de Ayuda sigue encendido a menos que tú lo apagues.","We recommend keeping it on so they can always ask for help.":"Te recomendamos dejarlo encendido para que siempre pueda pedir ayuda.","Level 1 Beginner has 12 big words.":"El nivel 1 Principiante tiene 12 palabras grandes.","Level 2 Middle has all 24 core words, every word group and the keyboard.":"El nivel 2 Intermedio tiene las 24 palabras básicas, todos los grupos y el teclado.","Level 3 Advanced has 48 words and every tool.":"El nivel 3 Avanzado tiene 48 palabras y todas las herramientas.","Levels show and hide words.":"Los niveles muestran y ocultan palabras.","They never delete them.":"Nunca las borran.","The level check suggests where to start.":"La prueba de nivel sugiere dónde empezar.","Move up when it feels easy.":"Sube de nivel cuando se sienta fácil.","Words never disappear, and core words never move.":"Las palabras nunca desaparecen, y las básicas nunca se mueven.","Level 1 hides the keyboard, word endings and Find to keep things simple.":"El nivel 1 oculta el teclado, las terminaciones y Buscar para que sea sencillo.","A caregiver may also have turned things off in Show and hide.":"También puede ser que un cuidador apagó cosas en Mostrar y ocultar.","Make a How to talk with me card.":"Haz una tarjeta Cómo hablar conmigo.","It's one page that explains their talking app, how to help them talk, how they say yes and no, what helps them calm down, and who to call.":"Es una página que explica su app para hablar, cómo ayudarle a hablar, cómo dice sí y no, qué le ayuda a calmarse y a quién llamar.","Print it, or save it as a file to email.":"Imprímela o guárdala como archivo para enviarla por correo.","Message.":"Mensaje.","Tap to speak it.":"Tócalo para decirlo.","Need help?":"¿Necesitas ayuda?","Tap the red Help button.":"Toca el botón rojo de Ayuda.","No.":"No.","It can't call anyone by itself or tell when someone is in trouble.":"No puede llamar a nadie solo ni saber cuándo alguien está en problemas.","A person has to tap Call.":"Una persona tiene que tocar Llamar.","In an emergency, call 911.":"En una emergencia, llama al 911.","Speakeasy updates by itself the next time it's opened with internet.":"Speakeasy se actualiza solo la próxima vez que se abre con internet.","Their words and settings stay.":"Sus palabras y ajustes se quedan.","Not installed yet.":"Todavía no está instalado.","Use your browser's Install app option.":"Usa la opción Instalar app del navegador.","Not ready yet.":"Todavía no está listo.","Open Speakeasy once more with internet, then it works offline.":"Abre Speakeasy una vez más con internet y después funcionará sin internet.","Not saved yet.":"Todavía no está guardado.","Tap Save to this device below for the steps.":"Toca Guardar en este aparato abajo para ver los pasos.","Not sure?":"¿No estás seguro?","Start at Level 1.":"Empieza en el nivel 1.","Next, the level check suggests the best fit.":"Después, la prueba de nivel sugiere el mejor.","Not yet protected from automatic clean-up.":"Todavía no está protegido de la limpieza automática.","Keep backup files.":"Guarda archivos de respaldo.","Offline now.":"Sin internet ahora.","Speakeasy still works.":"Speakeasy sigue funcionando.","On a topic page, tap the game button.":"En una página de tema, toca el botón del juego.","Listen to the name, then tap the right picture.":"Escucha el nombre y toca la imagen correcta.","Speakeasy says a name and shows three pictures.":"Speakeasy dice un nombre y muestra tres imágenes.","Tap the right one to hear YES!":"Toca la correcta para oír ¡SÍ!","After two misses, the right one glows, so every round ends in a win.":"Después de dos fallas, la correcta brilla, así que cada ronda termina en un triunfo.","On a topic page, turn on Big picture.":"En una página de tema, activa Imagen grande.","T
