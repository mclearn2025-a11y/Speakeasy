<style>
/* Layout: one-screen communicator — top bar, message strip, word-group tabs, and a fixed-position word grid that fills the rest.
   Chrome uses McLearn DS01; word tiles use the Fitzgerald color key that AAC users and therapists already know. */
:root{
  --bg:#FAF1E5; --bg2:#EAD9C8; --card:#FFFFFF; --ink:#2A2420; --muted:#6E635A; --line:#D1C2B5;
  --brand:#8A3A1A; --brand2:#C45D34; --soft:#F3E2D2; --on-brand:#FFFFFF; --scrim:rgba(42,36,32,.55);
  /* Fitzgerald key: tile fill / border */
  --pron-bg:#FFF2A8; --pron-bd:#C9A400;   /* people words */
  --verb-bg:#D3F0CB; --verb-bd:#3E8E37;   /* action words */
  --desc-bg:#D5E6FF; --desc-bd:#2F66C2;   /* describing words */
  --noun-bg:#FFDFC2; --noun-bd:#D2701A;   /* things and places */
  --social-bg:#FAD6E8; --social-bd:#B83F77;/* social words */
  --q-bg:#E5D9FA;    --q-bd:#7048BE;      /* questions */
  --prep-bg:#F3EFEB; --prep-bd:#8E837A;   /* little words */
  --neg-bg:#FFD3CF;  --neg-bd:#C8372B;    /* no / not */
  --font-brand:"Fraunces",Georgia,"Times New Roman",serif;
  --font-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-tile:"Atkinson Hyperlegible","Hanken Grotesk",system-ui,sans-serif;
  --scale:1.1; --r-sm:8px; --r-md:12px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1815; --bg2:#262019; --card:#2A2420; --ink:#F4EADF; --muted:#B9AC9F; --line:#4A3F37;
  --brand:#E3906A; --brand2:#D2754E; --soft:#3A2C24; --on-brand:#1C1815; --scrim:rgba(0,0,0,.65);
  --pron-bg:#463C0E; --pron-bd:#E0BE2A; --verb-bg:#1E3A1B; --verb-bd:#6BC062;
  --desc-bg:#172A4A; --desc-bd:#6E9FEA; --noun-bg:#46280F; --noun-bd:#EE9446;
  --social-bg:#43172C; --social-bd:#E178AA; --q-bg:#2B1D48; --q-bd:#A88AEB;
  --prep-bg:#322D29; --prep-bd:#A69A90; --neg-bg:#4A1613; --neg-bd:#F0685C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1815; --bg2:#262019; --card:#2A2420; --ink:#F4EADF; --muted:#B9AC9F; --line:#4A3F37;
  --brand:#E3906A; --brand2:#D2754E; --soft:#3A2C24; --on-brand:#1C1815; --scrim:rgba(0,0,0,.65);
  --pron-bg:#463C0E; --pron-bd:#E0BE2A; --verb-bg:#1E3A1B; --verb-bd:#6BC062;
  --desc-bg:#172A4A; --desc-bd:#6E9FEA; --noun-bg:#46280F; --noun-bd:#EE9446;
  --social-bg:#43172C; --social-bd:#E178AA; --q-bg:#2B1D48; --q-bd:#A88AEB;
  --prep-bg:#322D29; --prep-bd:#A69A90; --neg-bg:#4A1613; --neg-bd:#F0685C; color-scheme:dark }

html,body{height:100%}
body{display:flex;flex-direction:column}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);margin:0;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

#app{height:auto;flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px;box-sizing:border-box;max-width:1100px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--font-brand);font-weight:600;font-size:20px;color:var(--brand);letter-spacing:-.01em}
.mode{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.spacer{flex:1}
.ibtn{min-width:44px;height:44px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:600;font-size:14px;position:relative;overflow:hidden}
.ibtn.help{background:var(--neg-bg);border-color:var(--neg-bd)}
.ibtn .ring{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--brand)}
.ibtn.holding .ring{animation:fill var(--hold,1.5s) linear forwards}
@keyframes fill{to{width:100%}}
.sec[hidden],.snav .chipbtn[hidden]{display:none!important}
.dwelling{position:relative;overflow:hidden}.dwelling::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--ink);animation:fill var(--hold,1s) linear forwards}
.bigmsg{position:fixed;inset:0;z-index:90;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:18px}
.bigmsg p{font-size:clamp(40px,9vw,110px);font-weight:800;line-height:1.1;margin:0;word-break:break-word}
.bigmsg small{font-size:18px;color:#555}
.signbadge{position:absolute;top:4px;right:6px;font-size:16px;line-height:1;filter:drop-shadow(0 1px 1px #0003)}
.tile{position:relative}
.bp-pic video{width:100%;height:100%;object-fit:contain;border-radius:var(--r-lg)}
.signbox{display:flex;flex-direction:column;gap:8px;padding:10px;margin:-4px 0 8px;border:2px dashed var(--line,#ccc);border-radius:12px}
.signbox video{width:100%;max-height:260px;border-radius:10px;background:#000}
.signbox .acts{display:flex;flex-wrap:wrap;gap:8px}
.signbox label.btn{cursor:pointer}.signbox input[type=file]{display:none}

/* message strip */
.strip{display:flex;gap:6px;align-items:stretch;background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:6px;min-height:calc(64px*var(--scale))}
.msg{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:4px 6px;overflow-x:hidden;overflow-y:auto;max-height:calc(64px*var(--scale) - 8px);padding:2px;border-radius:var(--r-md);cursor:pointer}
.msg[data-fit="1"] .chip{font-size:calc(13px*var(--scale));padding:3px 7px}
.msg[data-fit="2"] .chip{font-size:calc(11px*var(--scale));padding:2px 6px}.msg[data-fit="2"] .chip img{display:none}
.msg .chip{max-width:100%;white-space:normal}
.msg .ph{color:var(--muted);font-size:15px;padding-left:6px;white-space:nowrap}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--r-sm);background:var(--soft);
  font-family:var(--font-tile);font-weight:700;font-size:calc(16px*var(--scale));white-space:nowrap}
.chip img{width:calc(24px*var(--scale));height:calc(24px*var(--scale));object-fit:cover;border-radius:4px}
.chip.typing{background:transparent;border:2px dashed var(--line)}
.chip.typing::after{content:"";width:2px;height:1.1em;background:var(--brand);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sbtn{flex:none;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--bg);min-width:52px;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.sbtn.speak{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-size:16px;padding:0 14px;gap:6px;min-width:84px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* learn banner */
.banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--soft);border:2px solid var(--brand2);border-radius:var(--r-lg);padding:8px 10px}
.banner .ask{font-family:var(--font-tile);font-weight:700;font-size:20px;flex:1;min-width:140px}
.banner .score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* board */
.board{flex:1;min-height:0;overflow:auto;border-radius:var(--r-md)}
.grid{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:6px;grid-auto-rows:calc(84px*var(--scale))}
.grid.fill{height:100%;grid-template-rows:repeat(var(--rows,4),minmax(calc(58px*var(--scale)),1fr));grid-auto-rows:unset}
.tile{--tbg:var(--prep-bg);--bd:var(--prep-bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:2px solid var(--bd);background:var(--tbg);color:var(--ink);border-radius:var(--r-md);padding:4px 2px;min-width:0;min-height:0;
  font-family:var(--font-tile);font-weight:700;font-size:min(calc(14px*var(--scale)),3.3vw);line-height:1.1;text-align:center;position:relative;overflow:hidden;
  transition:transform .08s ease}
.tile:active{transform:scale(.97)}
.tile .sym{font-size:calc(28px*var(--scale));line-height:1}
.tile img{width:calc(38px*var(--scale));height:calc(38px*var(--scale));object-fit:cover;border-radius:var(--r-sm)}
.tile .lbl{overflow-wrap:break-word;word-break:normal;hyphens:manual;max-width:100%}
.tile.empty{visibility:hidden}
.tile.mine{box-shadow:inset 0 0 0 2px #fff,0 0 0 3px #F2B705}
.grid.fill.hasmore{height:calc(100% - 40px)}
.morewords{position:sticky;bottom:0;z-index:2;display:flex;align-items:center;gap:10px;height:34px;margin:6px 0 0;padding:0 2px;background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;width:100%;border:0;font-family:inherit}
.morewords::before,.morewords::after{content:"";flex:1;border-top:2px dashed var(--line)}
.restgrid{margin-bottom:8px}
body.calm .tile.mine{box-shadow:0 0 0 3px #B8860B}
.tile[data-pos="pron"]{--tbg:var(--pron-bg);--bd:var(--pron-bd)} .tile[data-pos="verb"]{--tbg:var(--verb-bg);--bd:var(--verb-bd)}
.tile[data-pos="desc"]{--tbg:var(--desc-bg);--bd:var(--desc-bd)} .tile[data-pos="noun"]{--tbg:var(--noun-bg);--bd:var(--noun-bd)}
.tile[data-pos="social"]{--tbg:var(--social-bg);--bd:var(--social-bd)} .tile[data-pos="q"]{--tbg:var(--q-bg);--bd:var(--q-bd)}
.tile[data-pos="neg"]{--tbg:var(--neg-bg);--bd:var(--neg-bd)}
.tile.pressing::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--ink);animation:fill var(--hold,.5s) linear forwards}
.tile.right{outline:4px solid var(--verb-bd)}
.tile.hint{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--brand2)}}
.scan-on{outline:5px solid var(--brand)!important;outline-offset:2px;z-index:1}
.words-only .tile .sym,.words-only .tile img{display:none}
.words-only .tile{font-size:calc(17px*var(--scale))}
[data-contrast="on"] .tile{background:var(--card);border-width:4px;font-size:calc(16px*var(--scale))}
[data-contrast="on"] .strip,[data-contrast="on"] .tab,[data-contrast="on"] .ibtn{border-color:var(--ink);border-width:2px}

/* phrases */
.grid.phrases{grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-auto-rows:auto}
.grid.phrases .tile{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px 14px;text-align:left;min-height:calc(56px*var(--scale));font-size:calc(16px*var(--scale))}
.grid.phrases .tile .sym{font-size:calc(24px*var(--scale))}

/* keyboard */
.kbwrap{display:flex;flex-direction:column;gap:6px;height:100%}
.pred{display:flex;gap:6px;overflow-x:auto;min-height:48px}
.pred button{flex:none;border-radius:var(--r-md);border:1.5px solid var(--desc-bd);background:var(--desc-bg);padding:0 14px;font-family:var(--font-tile);font-weight:700;font-size:calc(16px*var(--scale))}
.kb{flex:1;display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:5px;grid-auto-rows:minmax(calc(46px*var(--scale)),1fr)}
.key{grid-column:span 2;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);font-family:var(--font-tile);font-weight:700;font-size:calc(18px*var(--scale));text-transform:lowercase;min-width:0}
.key.off1{grid-column:2 / span 2}.key.off2{grid-column:4 / span 2}
.key.wide{grid-column:span 4;font-size:15px;text-transform:none}.key.space{grid-column:span 8;text-transform:none;font-size:15px}

/* bigger core board, word-group folders, safety checks */
.grid.fill.dense{gap:4px;grid-template-rows:repeat(var(--rows,6),minmax(calc(46px*var(--scale)),1fr))}
.grid.dense .tile{font-size:min(calc(13px*var(--scale)),2.9vw);padding:2px 1px;border-radius:10px;gap:1px}
.grid.dense .tile .sym{font-size:min(calc(24px*var(--scale)),5.4vw)}
.tile.textonly .lbl{font-size:1.15em}
.tile.folder{background:var(--card);border:2px solid var(--line);box-shadow:inset 0 6px 0 var(--soft);min-height:calc(92px*var(--scale))}
.tile.folder .count{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted)}
.grouptitle{flex:none;align-self:center;font-family:var(--font-tile);font-weight:700;font-size:17px;padding-inline:6px}
.ibtn .dot{position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:var(--neg-bd);border:2px solid var(--card)}
.checks{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}
details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}

/* topic packs (birds and custom topics) */
.topichead{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;position:sticky;top:0;background:var(--bg);z-index:2;scrollbar-width:none}
.topichead::-webkit-scrollbar{display:none}
.undoclr{margin-left:10px;pointer-events:auto}
.bigmsg .bignote{display:block;font-size:20px;font-weight:700;margin-bottom:12px;opacity:.95}
.chipbtn{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;min-height:38px;display:inline-flex;gap:6px;align-items:center}
.chipbtn[aria-pressed="true"]{background:var(--brand2);color:var(--on-brand);border-color:var(--brand2)}
.factline{font-family:var(--font-tile);font-size:15px;line-height:1.4;background:var(--soft);border-radius:var(--r-md);padding:8px 12px;margin-bottom:6px}
.factline b{font-weight:700}
.grid.pics{grid-auto-rows:auto}
.grid.pics .tile{padding:4px 4px 6px;gap:4px;justify-content:flex-start}
.tile .art{width:100%;aspect-ratio:1;display:block;max-width:100%;position:relative}
.art img.photo{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:cover;border-radius:10px;opacity:0;transition:opacity .4s ease}
.art img.photo.on{opacity:1}
.chip .art img.photo{border-radius:5px}
.credit{display:block;font-family:var(--font-ui);font-size:11px;color:var(--muted);margin-top:4px;-webkit-user-select:text;user-select:text}
.tile .art svg{width:100%;height:100%;display:block;border-radius:10px}
.grid.pics .tile img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:10px}
.grid.pics .tile .sym{font-size:calc(44px*var(--scale));aspect-ratio:1;display:flex;align-items:center;justify-content:center;width:100%}
.chip .art{width:calc(26px*var(--scale));height:calc(26px*var(--scale));display:inline-block;flex:none}
.chip .art svg{width:100%;height:100%;border-radius:5px}
.words-only .tile .art,.words-only .chip .art{display:none}
.erow .art{width:32px;height:32px;flex:none}.erow .art svg{width:100%;height:100%;border-radius:6px}
.sbtn:disabled{opacity:.35;cursor:default}
.sbtn.small{min-width:44px;font-size:18px}
.formlist{display:flex;flex-wrap:wrap;gap:8px}
.formlist button{border:2px solid var(--verb-bd);background:var(--verb-bg);border-radius:var(--r-md);padding:12px 16px;font-family:var(--font-tile);font-weight:700;font-size:18px;min-height:52px}
.find input{width:100%;font-size:18px}
.fres{display:flex;flex-direction:column;gap:6px}
.fres button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:6px 10px;min-height:48px}
.fres .s{width:32px;font-size:22px;text-align:center;flex:none}
.fres small{color:var(--muted);display:block}

/* sparkle look */
.spark{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:40;animation:spark .75s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.tile.pop{animation:pop .38s ease}
@keyframes pop{40%{transform:scale(1.07)}100%{transform:scale(1)}}
.tile.pop .art svg{animation:flap .5s ease}
@keyframes flap{25%{transform:rotate(-5deg) translateY(-3px)}75%{transform:rotate(5deg)}}
.flyer{position:fixed;left:0;width:64px;height:64px;pointer-events:none;z-index:40;animation:fly 1.7s ease-in-out forwards}
.flyer svg{width:100%;height:100%}
@keyframes fly{0%{transform:translate(-70px,10px)}50%{transform:translate(48vw,-24px)}100%{transform:translate(110vw,0)}}
.sparkle .tab[aria-selected="true"]{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:var(--on-brand)}

/* ---------- Bird game: a sky of its own in both themes ---------- */
.game{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;gap:6px;overflow:hidden;color:#1D2A38;font-family:var(--font-tile);
  background:linear-gradient(180deg,#7CC8F5 0%,#CDEBFF 55%,#E9F7FF 78%,#A9DB8C 78.2%,#8CCB6E 100%);
  padding-inline:16px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none}
.g-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;pointer-events:none}
.g-top{display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.g-tool{min-width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.8);font-size:20px;font-weight:700;color:#1D2A38;position:relative;overflow:hidden;flex:none}
.g-tool .ring{position:absolute;left:0;bottom:0;height:4px;width:0;background:#8A3A1A}
.g-tool.holding .ring{animation:fill 1s linear forwards}
.g-ask{flex:1;min-width:0;text-align:center;background:#fff;border-radius:18px;padding:6px 10px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.g-ask small{display:block;font-size:clamp(14px,3.6vw,20px);color:#4A5A6A;font-weight:700}
.g-ask b{display:block;font-size:clamp(24px,7vw,46px);line-height:1.1;color:#8A3A1A;text-wrap:balance}
.g-stars{display:flex;justify-content:center;gap:2px;min-height:28px;font-size:22px;flex-wrap:wrap;position:relative;z-index:2}
.g-stars .n{font-family:var(--font-ui);font-weight:700;font-size:15px;background:rgba(255,255,255,.8);border-radius:999px;padding:2px 10px;margin-left:6px;font-variant-numeric:tabular-nums}
.g-field{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-evenly;gap:10px;position:relative;z-index:1}

@keyframes yesfly{0%{transform:translateX(-120vw) rotate(-12deg)}30%{transform:translateX(0) scale(1.15) rotate(0)}72%{transform:translateX(0) scale(1)}100%{transform:translateX(120vw) rotate(10deg)}}
.g-banner .popno{animation:nofly 1.5s ease forwards}
@keyframes nofly{0%{transform:scale(.4);opacity:0}18%{transform:scale(1.1);opacity:1}28%,48%{transform:translateX(-14px)}38%,58%{transform:translateX(14px)}82%{opacity:1;transform:none}100%{opacity:0}}

.g-start .go{border:0;border-radius:22px;background:#2E9E3A;color:#fff;font-family:var(--font-tile);font-weight:700;font-size:clamp(26px,7vw,40px);padding:18px 44px;box-shadow:0 8px 0 #1E6E28}

@media (prefers-reduced-motion:reduce){ .g-bird.in{animation:none!important} }

/* switch bar */
.switchbar{border:none;border-radius:var(--r-lg);background:var(--brand);color:var(--on-brand);font-weight:700;font-size:20px;min-height:72px}

/* sheets */
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-end;z-index:10}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding-inline:16px;padding-block:16px calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box;-webkit-user-select:text;user-select:text}

select,input[type=text],textarea{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-height:40px;box-sizing:border-box}

.btn{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

.elist{display:flex;flex-direction:column;gap:6px}
.erow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

/* help card */

.helpcard .acts .btn{font-size:18px;min-height:56px;flex:1}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:var(--r-md);font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}

.phead .mode{flex:none}

.mtile{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);
  padding:10px 12px;min-height:62px;font-weight:600;font-size:15px;position:relative;overflow:hidden;min-width:0}

.fact b{display:block;font-family:var(--font-tile);font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:116px}

.todo:first-child{border-top:0}
.todo .tk{font-size:17px;flex:none}
.todo .tt{flex:1;min-width:0;font-size:14px;line-height:1.35}

.todo .btn{min-height:38px;padding:6px 12px;font-size:13px;flex:none}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.faq .sa{display:flex;gap:6px;flex-wrap:wrap}
.faq .sa .btn{min-height:40px;padding:6px 12px;font-size:14px}
.faq .sel{font-weight:700;-webkit-user-select:all;user-select:all}
.faqgrp{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px}
.faqgrp[open]{padding-bottom:10px}
.faqgrp summary{font-weight:700;font-size:15px}
.faqgrp .faq{border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0 4px}

/* emergency contacts and help practice (v1.4) */
input[type=tel],input[type=email],input[type=search]{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-height:40px;box-sizing:border-box}
.hc-contacts{display:flex;flex-direction:column;gap:10px}
.hc-c{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.hc-c .hcwho{font-family:var(--font-tile);font-weight:700;font-size:clamp(20px,5vw,30px);line-height:1.2}
.hc-c .num{font-family:var(--font-tile);font-weight:700;font-size:clamp(24px,6.5vw,38px);letter-spacing:.03em;-webkit-user-select:all;user-select:all}
.hc-c .acts{display:flex;gap:8px;flex-wrap:wrap}
.hc-c .acts a{flex:1 1 110px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-md);font-weight:700;font-size:18px;text-decoration:none;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.hc-c .acts a.call{background:var(--verb-bg);border-color:var(--verb-bd)}
.cfs{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px 12px;margin:0;min-width:0}
.cfs legend{font-weight:700;font-size:13px;padding:0 4px}
.chk-opts.long{grid-template-columns:1fr}
.chk-opts.long button{min-height:72px;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;text-align:left}
.chk-opts.long button .big{font-size:36px}
.chk-opts button.hintok{box-shadow:0 0 0 5px var(--brand2)}

/* talking-app symbols (v1.5): Mulberry Symbols on a white card so they read in both themes */
:root{--symbg:#FFFFFF}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --symbg:#F4EADF } }
:root[data-theme="dark"]{ --symbg:#F4EADF }
.tile img.symimg{flex:0 1 auto;min-height:0;width:auto;height:calc(66px*var(--scale));max-height:68%;max-width:92%;object-fit:contain;background:var(--symbg);border-radius:8px;padding:2px;box-sizing:border-box}
.grid.dense .tile img.symimg{height:min(calc(40px*var(--scale)),8vw)}
.grid.dense2 .tile{font-size:min(calc(12px*var(--scale)),2.2vw);border-width:2px;border-radius:8px}.grid.dense2 .tile img.symimg{height:min(calc(36px*var(--scale)),5.6vw)}.grid.dense2{gap:4px}
.chip img.symimg{width:auto;height:calc(26px*var(--scale));object-fit:contain;background:var(--symbg);border-radius:4px;padding:1px}
.fres img.symimg,.erow img.symimg{width:32px;height:32px;object-fit:contain;background:var(--symbg);border-radius:6px}
/* 3D pictures carry their own shading, so they sit on the tile with no white card and a little bigger */
body.pics3d img.symimg[src^="data:"]{background:none;padding:0}
body.pics3d .tile img.symimg[src^="data:"]{height:calc(76px*var(--scale));max-height:74%}
.g-bird img.symimg{width:100%;aspect-ratio:1;object-fit:contain;background:#FFFFFF;border-radius:16px;padding:8px;box-sizing:border-box}

/* privacy policy (v1.6) */
.pp h3{margin:16px 0 4px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
.pp p,.pp li{font-size:14px;line-height:1.55;max-width:65ch;margin:4px 0}
.pp ul{margin:4px 0;padding-left:20px}
.pp .pp-meta{color:var(--muted);font-size:13px}

/* How to talk with me card (v1.7) */
.panel.tc{max-width:900px}
.panel.tc .tc-wrap{display:grid;gap:16px;margin-top:12px}
@media (min-width:900px){.panel.tc .tc-wrap{grid-template-columns:minmax(260px,320px) 1fr;align-items:start}}
.panel.tc .tc-form{display:grid;gap:10px;align-content:start}
.panel.tc .tc-form>label{display:grid;gap:4px;font-weight:600}
.panel.tc .tc-chks{display:grid;gap:8px}
.panel.tc .tc-chk{display:flex;gap:8px;align-items:center;font-weight:400;min-height:32px}
.panel.tc .tc-chk input{width:22px;height:22px}
#printArea{display:none}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block}body.printing{background:#fff!important;padding:0!important}}

/* languages, save to device, this device (v1.8) */
.installbar{flex:none;display:flex;gap:8px;align-items:center;background:var(--soft);border-bottom:1.5px solid var(--line);padding:6px 16px;color:var(--ink)}
.installbar .ib-t{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.3}
.installbar .btn{min-height:38px;flex:none;padding-inline:12px}
.isteps{margin:6px 0 0;padding-left:22px}
.isteps li{margin:6px 0;line-height:1.45}
.dcard.ok{border-color:var(--verb-bd)}
.dcard.warn{border-color:#C9A400}
.devrows{display:grid;gap:8px;margin:10px 0}
.devrow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.devrow.bad{border-color:#C0392B}.devrow.warn{border-color:#C9A400}
.devrow .di{font-size:20px;line-height:1.2}
.devrow b{display:block}
.devrow .note{display:block;margin:2px 0 0}
.langpick{display:inline-flex;flex-wrap:wrap}
html[lang="es"] .tile .lbl{hyphens:auto;-webkit-hyphens:auto}
@media print{.installbar{display:none!important}}
/* v2.0: phones held sideways are short, so the whole word board must still fit without scrolling (words never move) */
@media (orientation:landscape) and (max-height:500px){
  .top .brand{display:none} .ibtn{min-height:36px}
  .strip{min-height:46px;padding:4px} .sbtn{min-width:46px;font-size:18px}
  .tabs .tab{min-height:32px;padding-top:2px;padding-bottom:2px}
  .grid.fill{grid-template-rows:repeat(var(--rows,4),minmax(34px,1fr))}
  .grid.fill .tile{flex-direction:row;gap:6px;padding:2px 6px}
  .grid.fill .tile img.symimg,.grid.fill .tile img.symimg[src^="data:"]{height:86%;max-height:86%;width:auto;max-width:48%}
  .grid.fill .tile .sym{font-size:min(30px,7vh);width:auto;aspect-ratio:auto}
  .grid.fill .tile .lbl{text-align:left}
}
</style>

<div id="app">
  <div class="top">
    <span class="brand">Communara</span>
    <button class="who" id="whoBtn" aria-label="Who's talking. Tap to switch."><span class="av" id="whoAv" aria-hidden="true">🙂</span><span class="nm" id="whoNm"></span><span class="lv" id="whoLv">L2</span></button>
    <span class="spacer"></span>
    <button class="ibtn help" id="helpBtn" aria-label="Help card"><span aria-hidden="true">🆘</span><span class="txt">Help</span></button>
    <button class="ibtn" id="findBtn" aria-label="Find a word"><span aria-hidden="true">🔍</span><span class="txt">Find</span></button>
    <button class="ibtn" id="learnBtn" aria-label="Practice"><span aria-hidden="true">🎯</span><span class="txt">Practice</span></button>
    <button class="ibtn menu" id="menuBtn" aria-label="Menu" aria-haspopup="dialog"><span aria-hidden="true">☰</span><span class="txt">Menu</span></button>
    <button class="ibtn" id="gearBtn" aria-label="Settings. Hold to open."><span aria-hidden="true">⚙️</span><span class="ring"></span><span class="dot" id="gearDot" hidden></span></button>
  </div>

  <div class="strip">
    <div class="msg" id="msg" role="button" tabindex="0" aria-label="Message. Tap to speak it." aria-live="polite"></div>
    <button class="sbtn small" id="formBtn" aria-label="Word endings, like wants or wanted" title="Word endings" disabled>±</button>
    <button class="sbtn small" id="delBtn" aria-label="Delete last word"><span aria-hidden="true">⌫</span><span class="txt">Back</span></button>
    <button class="sbtn small" id="clrBtn" aria-label="Clear message"><span aria-hidden="true">✕</span><span class="txt">Clear</span></button>
    <button class="sbtn speak" id="speakBtn" aria-label="Speak message"><span aria-hidden="true">🔊</span><span class="txt">Speak</span></button>
  </div>

  <div class="banner" id="banner" hidden></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Word groups"></div>
  <div class="board" id="board"></div>
  <button class="switchbar" id="switchBar" hidden>Tap here (or press Space) to choose</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="zipbackup.js"></script>
<script src="words-data.js"></script>
<script src="app.js"></script>
</body></html>
