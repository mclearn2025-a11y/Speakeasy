rre el aparato lo vea.","It's off by default.":"Viene apagado.","Phone numbers are usually enough to get them home safely.":"Los teléfonos casi siempre bastan para que llegue a casa seguro.","Only on this device.":"Solo en este aparato.","Nothing is sent to McLearn Media or anyone else, and there's no tracking.":"No se envía nada a McLearn Media ni a nadie más, y no hay rastreo.","Read the full privacy policy in Settings, About.":"Lee la política de privacidad completa en Ajustes, Acerca de.","Open Settings, Edit words.":"Abre Ajustes, Editar palabras.","Pick the page, type the word, tap Or a photo, and choose a picture from your phone.":"Elige la página, escribe la palabra, toca O una foto y elige una imagen de tu teléfono.","Then tap Add word.":"Luego toca Agregar palabra.","Open Settings, Help card and emergency contacts.":"Abre Ajustes, Tarjeta de Ayuda y contactos de emergencia.","Add up to three people with phone, email and a video call link.":"Agrega hasta tres personas con teléfono, correo y un enlace de videollamada.","Contact 1 is the one to try first.":"El contacto 1 es el primero a probar.","Open Settings, Keep their words safe, and tap Save backup file.":"Abre Ajustes, Cuida sus palabras, y toca Guardar archivo de respaldo.","Keep the file in your email or cloud drive.":"Guarda el archivo en tu correo o tu nube.","Open Settings, Show and hide.":"Abre Ajustes, Mostrar y ocultar.","Uncheck anything they don't need, or pick something in Keep only.":"Quita la marca de lo que no necesite, o elige algo en Dejar solo.","Open Settings, Topics, and check or uncheck it.":"Abre Ajustes, Temas, y márcalo o desmárcalo.","You can also change favorites in the profile.":"También puedes cambiar los favoritos en el perfil.","Open Settings, Touch and access.":"Abre Ajustes, Toque y acceso.","Turn on Hold to choose, or Ignore repeat taps.":"Activa Mantener para elegir, o Ignorar toques repetidos.","Bigger buttons help too.":"Los botones más grandes también ayudan.","Use the Button size slider, High contrast, or Words only.":"Usa el control de Tamaño de los botones, Alto contraste o Solo palabras.","Open Settings, Voice.":"Abre Ajustes, Voz.","Pick a voice, then use the Speed and Pitch sliders.":"Elige una voz y usa los controles de Velocidad y Tono.","Tap Test voice to hear it.":"Toca Probar voz para oírla.","Open Settings, then Accessibility, Text-to-speech, Speech engine.":"Abre Configuración, luego Accesibilidad, Texto a voz, Motor de voz.","Download a voice for the language.":"Descarga una voz para el idioma.","Then reopen Speakeasy.":"Luego vuelve a abrir Speakeasy.","Open System Settings, then Accessibility, Spoken Content.":"Abre Configuración del Sistema, luego Accesibilidad, Contenido leído.","Next to System voice, choose Manage Voices and download one for the language.":"Junto a Voz del sistema, elige Administrar voces y descarga una para el idioma.","Open Windows Settings, then Time and language, Speech.":"Abre la Configuración de Windows, luego Hora e idioma, Voz.","Under Manage voices, tap Add voices and pick the language.":"En Administrar voces, toca Agregar voces y elige el idioma.","Open that person's profile and tap Delete this person twice.":"Abre el perfil de esa persona y toca Borrar a esta persona dos veces.","Save a backup file first if you might want their words back.":"Guarda antes un archivo de respaldo si quizá quieres recuperar sus palabras.","Open the Menu and tap Save to this device.":"Abre el Menú y toca Guardar en este aparato.","It shows the steps for your phone, tablet or computer.":"Muestra los pasos para tu teléfono, tableta o computadora.","On Android, tap Install.":"En Android, toca Instalar.","Open the device Settings, then search for Text-to-speech.":"Abre la Configuración del aparato y busca Texto a voz.","Tap the gear next to the speech engine, then Install voice data, and download the language.":"Toca el engrane junto al motor de voz, luego Instalar datos de voz, y descarga el idioma.","Open ra maestros, niñeras y doctores.","It says how they talk, how to help, how they say yes and no, what helps them calm down, and who to call.":"Dice cómo habla, cómo ayudarle, cómo dice sí y no, qué le ayuda a calmarse y a quién llamar.","Fill in what you like, then print it or save it as a file.":"Llena lo que quieras, luego imprímela o guárdala como archivo.","Printing isn't available here.":"Aquí no se puede imprimir.","Use Save card file instead.":"Usa Guardar archivo de la tarjeta.","Put Speakeasy on the home screen so it opens like an app, works without Wi-Fi and keeps their words safer.":"Pon Speakeasy en la pantalla de inicio para que se abra como app, funcione sin Wi-Fi y cuide mejor sus palabras.","The steps fit your phone, tablet or computer.":"Los pasos son para tu teléfono, tableta o computadora.","Real bird photos are built into Speakeasy, so they work offline too.":"Las fotos reales de pájaros vienen dentro de Speakeasy, así que también funcionan sin internet.","They come from Wikimedia Commons under free licenses, and every photographer is credited.":"Vienen de Wikimedia Commons con licencias libres, y cada fotógrafo tiene su crédito.","The few birds without a free photo show a drawing.":"Los pocos pájaros sin foto libre muestran un dibujo.","Save Speakeasy to this device.":"Guarda Speakeasy en este aparato.","It opens like an app and works without Wi-Fi.":"Se abre como una app y funciona sin Wi-Fi.","Save a backup file after big changes and keep it in your email or cloud drive.":"Guarda un archivo de respaldo después de cambios grandes y tenlo en tu correo o tu nube.","Install Speakeasy on the home screen so it works without internet.":"Instala Speakeasy en la pantalla de inicio para que funcione sin internet.","Saved, but with limited room on this device.":"Guardado, pero con poco espacio en este aparato.","Saving Speakeasy puts it on the home screen like any other app.":"Guardar Speakeasy lo pone en la pantalla de inicio como cualquier otra app.","It opens full screen, works without Wi-Fi, and keeps their words safer.":"Se abre en pantalla completa, funciona sin Wi-Fi y cuida mejor sus palabras.","Open Speakeasy from its own web address to save the card.":"Abre Speakeasy desde su propia dirección web para guardar la tarjeta.","Use Copy backup text instead.":"Usa Copiar texto de respaldo.","Scanning highlights one choice at a time.":"El escaneo ilumina una opción a la vez.","Choose with the big button at the bottom, the Space key, or a Bluetooth switch set to send Space.":"Elige con el botón grande de abajo, la tecla Espacio o un switch Bluetooth que envíe Espacio.","Listening scanning reads each choice aloud, for users who are blind or have low vision.":"El escaneo con voz lee cada opción en voz alta, para personas ciegas o con baja visión.","Scanning lights up one choice at a time, and they choose with one big button or a switch.":"El escaneo ilumina una opción a la vez, y se elige con un botón grande o un switch.","Listening scanning reads each choice out loud.":"El escaneo con voz lee cada opción en voz alta.","See the words they use most, how often they talk, practice scores, and what to set up next.":"Mira las palabras que más usa, qué tan seguido habla, los puntajes de práctica y qué falta configurar.","It tells you when they may be ready for the next level.":"Te avisa cuando quizá está listo para el siguiente nivel.","Settings.":"Ajustes.","Hold to open.":"Mantén presionado para abrir.","Small words like it, is and do show just the word, because a picture would confuse.":"Las palabras pequeñas como eso, es y hacer muestran solo la palabra, porque una imagen confundiría.","Speech therapists often do the same.":"Los terapeutas del habla hacen lo mismo.","Some buttons are missing.":"Faltan algunos botones.","Where did they go?":"¿A dónde se fueron?","Something else makes its own topic page.":"Otra cosa crea su propia página de tema.","Add its words and photos from your phone in Settings, Edit words.":"Agre  device could clear storage if it runs low on space.":"El aparato podría borrar el almacenamiento si se queda sin espacio.","Saving Speakeasy to the device and keeping a backup file protects their words.":"Guardar Speakeasy en el aparato y tener un archivo de respaldo protege sus palabras.","The device needs a Spanish voice.":"El aparato necesita una voz en español.","Open the Menu, then This device.":"Abre el Menú y luego Este aparato.","It shows how to add a Spanish voice on your phone, tablet or computer.":"Ahí dice cómo agregar una voz en español en tu teléfono, tableta o computadora.","The red Help button shows these people with Call, Text, Video and Email buttons, so they or a helper can reach someone fast.":"El botón rojo de Ayuda muestra a estas personas con botones para Llamar, Mensaje, Video y Correo, para que la persona o alguien que la ayude se comunique rápido.","The home address stays hidden unless you turn it on, because anyone who picks up the device could see it.":"El domicilio queda oculto a menos que lo actives, porque cualquiera que agarre el aparato lo podría ver.","Location is added only when they tap Text or Email, and only if the device allows it.":"La ubicación se agrega solo cuando tocan Mensaje o Correo, y solo si el aparato lo permite.","Everything stays on this device.":"Todo se queda en este aparato.","Their favorite words are great ones to model.":"Sus palabras favoritas son muy buenas para modelar.","Use them in short sentences on the board while you talk.":"Úsalas en oraciones cortas en el tablero mientras hablas.","There's no sound.":"No hay sonido.","They come from Wikimedia Commons under free licenses.":"Vienen de Wikimedia Commons con licencias libres.","Each photographer is named under the big picture and in Settings, Topics, Photo credits.":"Cada fotógrafo aparece debajo de la imagen grande y en Ajustes, Temas, Créditos de las fotos.","They tap things by accident.":"Toca cosas sin querer.","What helps?":"¿Qué ayuda?","This browser can't speak out loud.":"Este navegador no puede hablar en voz alta.","Messages will show as text.":"Los mensajes se mostrarán como texto.","This browser can't speak.":"Este navegador no puede hablar.","Messages show as text.":"Los mensajes se muestran como texto.","Try Safari on iPhone or iPad, Chrome on Android, or Chrome or Edge on a computer.":"Prueba Safari en iPhone o iPad, Chrome en Android, o Chrome o Edge en una computadora.","This browser may let the screen dim.":"Este navegador puede dejar que la pantalla se oscurezca.","Turn up Auto-Lock or Screen timeout in the device settings.":"Sube el Bloqueo automático o el Tiempo de pantalla en los ajustes del aparato.","This device has no voice for this language yet.":"Este aparato todavía no tiene una voz para este idioma.","Open the Menu, then This device, to add one.":"Abre el Menú y luego Este aparato para agregar una.","This device isn't saving changes.":"Este aparato no está guardando cambios.","Save a backup file now.":"Guarda ahora un archivo de respaldo.","This device shows what works here: a voice in their language, working offline, and voice control.":"Este aparato muestra lo que funciona aquí: una voz en su idioma, funcionar sin internet y el control por voz.","If something is missing, it shows how to add it.":"Si falta algo, muestra cómo agregarlo.","This is not a test score or a diagnosis.":"No es una calificación ni un diagnóstico.","There are no wrong answers, and you can change the level anytime.":"No hay respuestas incorrectas, y puedes cambiar el nivel cuando quieras.","This topic is empty.":"Este tema está vacío.","Add words and photos in Settings, Edit words.":"Agrega palabras y fotos en Ajustes, Editar palabras.","Topic pages are about things they love, like Birds, Dogs, Space or Trains.":"Las páginas de temas son sobre cosas que le encantan, como Pájaros, Perros, El espacio o Trenes.","Each has real photos, names, fun facts and a game.":"Cada una tiene fotos reales, nombres, datos curiosos y un juego.","Pick them in the profile.":"Elígelas en el perfil.","Try other words, like voice, photo, level, backup or game.":"Prueba con otras palabras, como voz, foto, nivel, respaldo o juego.","Or open a topic below.":"O abre un tema abajo.","Turn on Big picture on a topic page.":"Activa Imagen grande en una página de tema.","Then tap a picture to see all of it, big.":"Luego toca una imagen para verla completa y grande.","Turn the device volume up.":"Sube el volumen del aparato.","On an iPhone or iPad, check the silent switch on the side.":"En un iPhone o iPad, revisa el interruptor de silencio del lado.","Then open Settings, Voice, and tap Test voice.":"Luego abre Ajustes, Voz, y toca Probar voz.","If you picked a voice marked needs internet, choose another one.":"Si elegiste una voz marcada necesita internet, elige otra.","U.S.":"Estados de EE.","states":"UU.","Voices come from this device.":"Las voces vienen de este aparato.","Voices marked “needs internet” stop working offline, so pick one without that label for everyday use.":"Las voces marcadas “necesita internet” dejan de funcionar sin internet, así que elige una sin esa marca para el día a día.","When the words they have feel easy.":"Cuando las palabras que tiene se sienten fáciles.","The Dashboard tells you when they use most of their words often.":"El Panel te avisa cuando usa casi todas sus palabras seguido.","You can move up or down anytime.":"Puedes subir o bajar cuando quieras.","When you talk to them, tap the same words on the screen as you say them.":"Cuando le hables, toca las mismas palabras en la pantalla mientras las dices.","This is called modeling, and it's the fastest way people learn to use a talking app.":"Esto se llama modelar, y es la forma más rápida de aprender a usar una app para hablar.","Don't ask them to copy you.":"No le pidas que te copie.","Just show.":"Solo muéstrale.","With the caregiver lock on, settings open only when you hold the gear for 2 seconds.":"Con el candado para cuidadores activo, los ajustes solo se abren si mantienes presionado el engrane 2 segundos.","That keeps changes safe from curious fingers.":"Así los cambios están a salvo de deditos curiosos.","Word groups hold more words by topic, like Feelings, Food and People.":"Los grupos de palabras tienen más palabras por tema, como Sentimientos, Comida y Personas.","Tap a group to open it.":"Toca un grupo para abrirlo.","Their favorite groups come first.":"Sus grupos favoritos salen primero.","Yes, if you turn on Add their location in the Help card settings.":"Sí, si activas Agregar su ubicación en los ajustes de la tarjeta de Ayuda.","It's added only when they tap Text or Email, and only if the device allows it.":"Se agrega solo cuando toca Mensaje o Correo, y solo si el aparato lo permite.","Yes, once it's installed and opened online one time.":"Sí, una vez instalado y abierto con internet una vez.","Words, photos, games and voices without the needs internet label all work offline.":"Las palabras, fotos, juegos y las voces sin la marca necesita internet funcionan sin internet.","Yes.":"Sí.","In the profile, choose Español.":"En el perfil, elige Español.","Words, phrases, topic pages, the Help card and the screens switch to Spanish, and it speaks Spanish.":"Las palabras, frases, páginas de temas, la tarjeta de Ayuda y las pantallas cambian a español, y habla español.","Each person on the device can have their own language.":"Cada persona en el aparato puede tener su propio idioma.","Open Settings, Keep their words safe, Restore points.":"Abre Ajustes, Cuida sus palabras, Puntos de restauración.","Speakeasy keeps the last 7.":"Speakeasy guarda los últimos 7.","Open Settings, Look and feel, and pick Calm.":"Abre Ajustes, Estilo y sensación, y elige Tranquilo.","That turns off all movement.":"Eso apaga todo el movimiento.","Open Settings, Switch and listening access, and turn on scanning.":"Abre Ajustes, Acceso por switch y escucha, y activa el escaneo.","Choices light up one at a time.":"Las opciones se iluminan una a la vez.","They choose with the big button, the Space key or a Bluetooth switch.":"Elige con el botón grande, la tecla Espacio o un switch Bluetooth.","Open Settings, Voice, and turn off Say each word when tapped.":"Abre Ajustes, Voz, y apaga Decir cada palabra al tocarla.","Then it only talks when you tap Speak.":"Así solo habla cuando tocas Hablar.","Open Settings, Word pictures.":"Abre Ajustes, Imágenes de las palabras.","Talking-app symbols are drawn to match each word.":"Los símbolos para hablar están dibujados para cada palabra.","You can also add your own photo for any word in Edit words.":"También puedes agregar tu propia foto para cualquier palabra en Editar palabras.","Speakeasy works in the web browser on iPhone, iPad, Android, Chromebooks, Windows and Mac.":"Speakeasy funciona en el navegador de iPhone, iPad, Android, Chromebooks, Windows y Mac.","Open the Menu, then This device, to see what works on the one you're using.":"Abre el Menú y luego Este aparato para ver qué funciona en el que estás usando.","Turn on Listening scanning in Settings, Switch and listening access.":"Activa Escaneo con voz en Ajustes, Acceso por switch y escucha.","It reads each choice as it lights up.":"Lee cada opción cuando se ilumina.","iPhone and iPad have Voice Control, Android has Voice Access, and computers have voice control too.":"iPhone y iPad tienen Control por voz, Android tiene Voice Access, y las computadoras también tienen control por voz.","Every Speakeasy button has a name to say, like Tap Help.":"Cada botón de Speakeasy tiene un nombre para decir, como Toca Ayuda.","Open the Menu, then This device, for the steps.":"Abre el Menú y luego Este aparato para ver los pasos.","You are lost and need help.":"Estás perdido y necesitas ayuda.","What do you do?":"¿Qué haces?","You did it!":"¡Lo lograste!","You know how to get help.":"Ya sabes cómo pedir ayuda.","Your topic pages have real pictures.":"Tus páginas de temas tienen i async function deviceFacts(){
  const P = platform(), langName = LANGS[LANG].name, vs = synth ? voicesFor(LANG) : [];
  const offline = vs.filter(v=>v.localService);
  const rows = [];
  rows.push(!synth ? ["bad","Speaking out loud", "This browser can't speak. Messages show as text. Try Safari on iPhone or iPad, Chrome on Android, or Chrome or Edge on a computer."]
    : !vs.length ? ["bad",`A ${langName} voice`, `This device has no ${langName} voice yet, so Speakeasy can't say words in ${langName}. ` + VOICE_STEPS[P]]
    : !offline.length ? ["warn",`A ${langName} voice`, `There's a ${langName} voice, but it needs internet. Download one so it talks offline too. ` + VOICE_STEPS[P]]
    : ["ok",`A ${langName} voice`, `${offline.length} ${langName} ${offline.length===1?"voice":"voices"} on this device work offline.`]);
  rows.push(installed() ? ["ok","Saved to this device","It opens like an app from the home screen."] : ["warn","Saved to this device","Not saved yet. Tap Save to this device below for the steps."]);
  const sw = "serviceWorker" in navigator && navigator.serviceWorker.controller;
  rows.push(sw ? ["ok","Works without Wi-Fi","Words, photos and games are stored on this device."] : ["warn","Works without Wi-Fi", installable() ? "Not ready yet. Open Speakeasy once more with internet, then it works offline." : "A preview link needs internet. Open Speakeasy from its own web address to use it offline."]);
  rows.push(health.persisted ? ["ok","Words protected","This device won't clear Speakeasy's storage on its own."] : ["warn","Words protected","The device could clear storage if it runs low on space. Saving Speakeasy to the device and keeping a backup file protects their words."]);
  rows.push(navigator.onLine ? ["ok","Internet","Connected now. Speakeasy checks for updates when it opens."] : ["ok","Internet","Offline now. Speakeasy still works."]);
  rows.push(["info","Voice control", VCONTROL_STEPS[P]]);
  rows.push(["info","Switches and keyboards","Bluetooth switches and keyboards work with Switch scanning in Settings, Switch and listening access."]);
  rows.push("wakeLock" in navigator ? ["ok","Screen stays on","The screen stays awake while Speakeasy is open."] : ["info","Screen stays on","This browser may let the screen dim. Turn up Auto-Lock or Screen timeout in the device settings."]);
  return rows;
}

// bigger and biggest, happier and happiest
const CMP_IRREG = {good:["better","best"],bad:["worse","worst"],little:["less","least"],far:["farther","farthest"]};
const NOCMP = new Set(["okay","same","different","first","last","next","broken","ready","right","wrong","hurt","empty","full","now","later","soon","safe","mean"]);
function canCompare(w, id){
  const k = w.toLowerCase(); if (CMP_IRREG[k]) return true;
  if (id && /^(colors|numbers|time)-/.test(id)) return false;
  return !w.includes(" ") && w.length<=7 && !NOCMP.has(k) && !/(ed|ing|ful|ous)$/.test(k);
}
function cmpForms(a){ if (CMP_IRREG[a]) return CMP_IRREG[a];
  if (/e$/.test(a)) return [a+"r", a+"st"];
  if (/[^aeiou]y$/.test(a)) return [a.slice(0,-1)+"ier", a.slice(0,-1)+"iest"];
  const d = /^[^aeiou]*[aeiou][bdgmnpt]$/.test(a) ? a+a.slice(-1) : a; return [d+"er", d+"est"]; }
const NOPLURAL = new Set(["water","milk","juice","rice","cereal","music","money","laundry","homework","soup","tea","coffee","bread","cheese","pasta","popcorn",
  "yogurt","peanut butter","art","gym","lunch","breakfast","dinner","recess","tv","work","school","home","church","outside","pain","medicine","glue","paper",
  "candy","soda","salad","ice cream","hair","underwear","everyone","tag","hide and seek","today","tomorrow","yesterday","shopping","potty"]);
function formsOf(w){
  if (!w || !w.label || LANG!=="en") return [];
  const base = w.base || w.label, k = base.toLowerCase();
  let list = IRREG[k] ? IRREG[k]
    : w.pos==="verb" && !base.includes(" ") ? verbForms(k)
    : w.pos==="noun" ? (NOPLURAL.has(k) || /[^s]s$/.test(k) ? [] : [plural(base)])
    : w.pos==="desc" && canCompare(base, w.id) ? cmpForms(k) : [];
  return [...new Set([base, ...list])].filter(x=>x!==w.label || x===base);
}

/* ---------------- State ----------------
   Their words are their voice, so saving is layered:
   1) IndexedDB on the device (much more room than simple browser storage)
   2) a quick copy in localStorage so the app opens instantly
   3) restore points (the last 7) to undo mistakes
   4) backup files the family keeps somewhere else */
const LS = "speakeasy.v1";
/* People on this device. The first person keeps the original storage keys, so nothing moves for existing users. */
const PREG = "speakeasy.people";
const readReg = () => { try { const r = JSON.parse(localStorage.getItem(PREG)); return r && Array.isArray(r.list) && r.active ? r : null; } catch { return null; } };
let REG = readReg() || {active:"main", list:[]};
const lsKey = id => id==="main" ? LS : LS+":"+id;
const idbKey = id => id==="main" ? "state" : "state:"+id;
function writeReg(){ try { localStorage.setItem(PREG, JSON.stringify(REG)); } catch {} }
function syncReg(){ const P = state.profile||{}; let e = REG.list.find(x=>x.id===REG.active); if (!e){ e = {id:REG.active}; REG.list.push(e); } e.name = P.name||""; e.avatar = P.avatar||"🙂"; e.lvl = state.settings.lvl||2; writeReg(); }
const DEFAULT = {
  settings:{photos:"photos",look:"sparkle",mode:"k",voiceURI:"",rate:0.9,pitch:1,speakOnTap:true,holdMs:0,debounceMs:300,scale:1.1,contrast:false,wordsOnly:false,
            board:"24",level:"all",scan:"off",scanMs:1500,lock:true,lang:"en"},
  custom:{}, hidden:[], learned:{}, help:{name:"",contact:"",info:"",contacts:[],address:"",showAddress:false,shareLoc:false}, practice:{right:0,tries:0},
  packs:{birds:true}, topics:[], birdGroup:"all", facts:false, savedAt:0, lastBackup:0,
  stats:{days:{}}, guideSeen:false, modeSet:false, profileAsked:false,
  profile:{name:"", avatar:"🙂", age:"", interests:[], check:null}, nicks:{},
  card:{yes:"",no:"",upset:"",calm:"",dont:"",more:"",loves:true,words:true,contacts:true}, cardMade:0
};
function normalize(d){
  d = d && typeof d==="object" ? d : {};
  const n = {...structuredClone(DEFAULT), ...d, settings:{...DEFAULT.settings, ...(d.settings||{})}, help:{...DEFAULT.help, ...(d.help||{})}, packs:{...DEFAULT.packs, ...(d.packs||{})}};
  if (d.settings && d.settings.starter===true && !d.settings.level) n.settings.level = "starter";   // from v0.4
  delete n.settings.starter; delete n._stripped;
  if (!["24","48"].includes(String(n.settings.board))) n.settings.board = "24";
  n.settings.board = String(n.settings.board);
  if (!["starter","24","all"].includes(n.settings.level)) n.settings.level = "all";
  for (const k of ["custom","learned","help","practice","packs","stats","profile","nicks","card"]) if (!n[k] || typeof n[k]!=="object") n[k] = structuredClone(DEFAULT[k]);
  if (!n.stats.days || typeof n.stats.days!=="object") n.stats.days = {};
  n.card = {...structuredClone(DEFAULT.card), ...n.card};
  n.profile = {...structuredClone(DEFAULT.profile), ...n.profile}; if (!Array.isArray(n.profile.interests)) n.profile.interests = [];
  if (!["en","es"].includes(n.settings.lang)) n.settings.lang = "en";
  if (!["nick","both"].includes(n.settings.nickShow)) n.settings.nickShow = "both";
  if (!["say","big"].includes(n.settings.tapView)) n.settings.tapView = "say";
  if (!["symbols","emoji","3d"].includes(n.settings.pics)) n.settings.pics = "3d";
  /* v1.11: move everyone to the new 3D pictures once; they can switch back in Settings, Pictures */
  if (!n.settings.pics3dIntro) { n.settings.pics = "3d"; n.settings.pics3dIntro = true; }
  if (![1,2,3].includes(n.settings.lvl)) n.settings.lvl = n.settings.level==="starter" ? 1 : n.settings.board==="48" ? 3 : 2;
  if (!Array.isArray(n.help.contacts)) n.help.contacts = [];
  if (!n.help.contacts.length && n.help.contact){   // the old single contact moves into contact 1
    const mm = String(n.help.contact).match(/(\+?\d[\d\s().-]{6,}\d)/);
    n.help.contacts.push({name: mm ? n.help.contact.replace(mm[0],"").replace(/[\s,:;-]+$/,"").trim() : n.help.contact, relation:"", phone: mm ? mm[0].trim() : "", email:"", video:""}); }
  while (n.help.contacts.length < 3) n.help.contacts.push({name:"",relation:"",phone:"",email:"",video:""});
  if (!Array.isArray(n.hidden)) n.hidden = []; if (!Array.isArray(n.topics)) n.topics = [];
  return n;
}
function load(){ try { return JSON.parse(localStorage.getItem(lsKey(REG.active))) || {}; } catch { return {}; } }
const saved = load();
const localStripped = !!saved._stripped;
const state = normalize(saved);
const S = state.settings;
function adopt(d){
  const n = normalize(d), s = n.settings;
  for (const k of Object.keys(state)) delete state[k];
  Object.assign(state, n);
  for (const k of Object.keys(S)) delete S[k];
  Object.assign(S, s); state.settings = S;
}

const health = {idb:null, persisted:null, localOK:true};
let idb = null, idbTimer = null, saveWarned = false;
function warnSave(){ if (saveWarned) return; saveWarned = true; toast("Speakeasy can't save on this device right now. Open Settings and save a backup file."); updateSafetyDot(); }
function stripPhotos(st){ const c = JSON.parse(JSON.stringify(st)); for (const k in c.custom) (c.custom[k]||[]).forEach(it=>{ if (it && it.img) it.img="__idb__"; }); c._stripped = true; return c; }
function save(){
  state.savedAt = Date.now();
  let json; try { json = JSON.stringify(state); } catch { return; }
  try { localStorage.setItem(lsKey(REG.active), json); health.localOK = true; }
  catch { health.localOK = false; try { localStorage.setItem(lsKey(REG.active), JSON.stringify(stripPhotos(state))); } catch {} }
  syncReg();
  clearTimeout(idbTimer); idbTimer = setTimeout(flushIDB, 250);
  if (!health.localOK && health.idb===false) warnSave();
  updateSafetyDot();
}
function openIDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open("speakeasy", 1);
      r.onupgradeneeded = () => { const d = r.result;
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        if (!d.objectStoreNames.contains("points")) d.createObjectStore("points", {keyPath:"t"}); };
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      setTimeout(() => res(null), 4000);
    } catch { res(null); }
  });
}
function idbDo(store, mode, fn){
  return new Promise((res, rej) => {
    if (!idb) return rej(new Error("no storage"));
    let req, tx;
    try { tx = idb.transaction(store, mode); req = fn(tx.objectStore(store)); } catch(e){ return rej(e); }
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error("aborted"));
  });
}
async function flushIDB(){
  clearTimeout(idbTimer); idbTimer = null;
  if (!idb) return;
  try { await idbDo("kv","readwrite", st => st.put(JSON.parse(JSON.stringify(state)), idbKey(REG.active))); health.idb = true; idbDo("kv","readwrite", st => st.put(JSON.parse(JSON.stringify(REG)), "people")).catch(()=>{}); }
  catch { health.idb = false; if (!health.localOK) warnSave(); }
}
async function listPoints(){ if (!idb) return []; const all = await idbDo("points","readonly", st => st.getAll()); return (all||[]).filter(p=>(p.pid||"main")===REG.active).sort((a,b)=>b.t-a.t); }
async function addPoint(label){
  if (!idb) return;
  const data = JSON.parse(JSON.stringify(state)), t = Date.now();     // copy now, before anything else changes
  try {
    await idbDo("points","readwrite", st => st.put({t, label, data, pid:REG.active}));
    const pts = await listPoints();
    for (const p of pts.slice(7)) await idbDo("points","readwrite", st => st.delete(p.t));
  } catch {}
}
const dayKey = t => new Date(t).toDateString();
async function initStorage(){
  idb = await openIDB(); health.idb = !!idb;
  if (idb){
    try {
      if (!readReg()){ const r = await idbDo("kv","readonly", st => st.get("people")); if (r && Array.isArray(r.list) && r.active){ REG = r; writeReg(); } }
      const fromDB = await idbDo("kv","readonly", st => st.get(idbKey(REG.active)));
      if (fromDB && ((fromDB.savedAt||0) > (state.savedAt||0) || localStripped)) { adopt(fromDB); apply(); }
      else await flushIDB();                     // first run, or moving data over from an older version
      const pts = await listPoints();
      if (!pts.length || dayKey(pts[0].t)!==dayKey(Date.now())) await addPoint("Start of the day");
    } catch { health.idb = false; }
  }
  try { if (navigator.storage && navigator.storage.persist){ health.persisted = await navigator.storage.persisted(); if (!health.persisted) health.persisted = await navigator.storage.persist(); } } catch {}
  updateSafetyDot();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="hidden" && idbTimer) flushIDB(); });
window.addEventListener("pagehide", () => { if (idbTimer) flushIDB(); });

/* Backup files */
const BACKUP_KIND = "speakeasy-backup";
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const installable = () => !!document.querySelector('link[rel="manifest"]') && "serviceWorker" in navigator && /^https?:$/.test(location.protocol);
const installed = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; } catch { return false; } };
const addedWords = d => Object.values((d&&d.custom)||{}).reduce((n,a)=>n+((a&&a.length)||0),0);
const needsBackup = () => (addedWords(state) > 0 || state.topics.length > 0 || state.help.contact || (state.help.contacts||[]).some(c=>c.phone)) && (!state.lastBackup || Date.now()-state.lastBackup > 14*864e5);
function backupText(){ return JSON.stringify({kind:BACKUP_KIND, version:1, app:"Speakeasy", created:new Date().toISOString(), state}); }
function backupName(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `speakeasy-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`; }
function markBackedUp(){ state.lastBackup = Date.now(); save(); updateSafetyDot(); }
async function saveBackupFile(){
  const name = backupName(), text = backupText();
  if (window.claude && typeof window.claude.use==="function"){       // inside Claude's preview: the viewer confirms the save
    let dl = null; try { dl = await window.claude.use("downloads"); } catch {}
    if (!dl){ toast("Saving files isn't available here. Use Copy backup text instead."); return false; }
    try { await dl.save({filename:name, data:new Blob([text],{type:"application/json"})}); markBackedUp(); toast("Backup file saved."); return true; }
    catch(e){ toast(e && e.code==="declined" ? "Backup file not saved." : "Saving files isn't available here. Use Copy backup text instead."); return false; }
  }
  const file = new File([text], name, {type:"application/json"});
  if (matchMedia("(pointer: coarse)").matches && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:"Speakeasy backup"}); markBackedUp(); toast("Backup sent. Keep it somewhere safe."); return true; }
    catch(e){ if (e && e.name==="AbortError") return false; }
  }
  try {
    const url = URL.createObjectURL(file), a = el("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000); markBackedUp(); toast("Backup file downloaded."); return true;
  } catch { toast("This device blocked the file. Use Copy backup text instead."); return false; }
}
function parseBackup(text){
  const d = JSON.parse(text); const st = d && d.kind===BACKUP_KIND ? d.state : d;
  if (!st || typeof st!=="object" || !st.settings || typeof st.settings!=="object") throw new Error("not a backup");
  return st;
}
async function restoreFrom(st, msgText){ await addPoint("Before restoring"); adopt(st); save(); apply(); toast(msgText || "Restored."); }
function updateSafetyDot(){ const d = $("gearDot"); if (d) d.hidden = !(needsBackup() || (health.idb===false && !health.localOK)); }
const fmtWhen = t => new Date(t).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const fmtDay = t => new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});

let msg = [];            // chosen words: {label, say, sym, img}
let typing = "";         // letters typed but not yet a word
let tab = "core";
let itemsById = new Map();
const learn = {on:false,target:null,misses:0};

/* ---------------- Helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el = (tag, cls, text) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
const m = () => S.mode;
let toastT;
function toast(t){ const n=$("toast"); n.textContent=t; n.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>n.hidden=true,3200); }

/* ---------------- Speech ---------------- */
/* Some voices read a lone "I" as "capital I". Speak it as the word it is. Only the sound changes; the screen still shows I. */
const speakable = t => LANG!=="en" ? String(t) : String(t).replace(/(^|[^A-Za-z'’])I(?![A-Za-z'’])/g, "$1eye");
const synth = window.speechSynthesis || null;
let voices = [];
function loadVoices(){ if(!synth) return; voices = synth.getVoices(); if($("v-voice")) fillVoices(); checkLangVoice(); }
if (synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
function say(text, cue=false){
  if (!text) return;
  if (!synth){ toast(text); return; }
  try{
    synth.cancel();
    const u = new SpeechSynthesisUtterance(speakable(T(text)));
    const v = voiceNow(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = LANGS[LANG].tag;
    u.rate = cue ? Math.min(2, S.rate*1.2) : S.rate; u.pitch = S.pitch; u.volume = cue ? 0.7 : 1;
    synth.speak(u);
  }catch{ toast(text); }
}
const sentence = () => [...msg.map(w=>w.say||w.label), ...(typing?[typing]:[])].join(" ").replace(/\s+([.?!,])/g,"$1");

/* ---------------- Tabs and items ---------------- */
const isTopic = t => !!PACKS[t] || state.topics.some(x=>x.id===t);
let sub = null;   // which word group is open inside the Groups tab
function coreLayout(){ return S.board==="48" ? LAYOUT48 : LAYOUT24; }
function coreShown(it, h=hiddenSet()){
  if (h.has(it.id) || !coreLayout().includes(it.id)) return false;
  if (S.level==="starter") return STARTER.has(it.id);
  if (S.level==="24") return ORIGINAL24.has(it.id);
  return true;
}
function sections(){ return ["core", ...topicTabs(), ...allGroupKeys(), "phrases"]; }
function topicTabs(){ return [...Object.keys(PACKS).filter(k=>k==="birds" ? state.packs[k]!==false : state.packs[k]===true), ...state.topics.map(x=>x.id)]; }
const off = k => !!(S.off && S.off[k]);
function tabsFor(){ const base=MODE_TABS[m()], at = m()==="k" ? 1 : 3; let t = [...base.slice(0,at), ...topicTabs(), ...base.slice(at)]; if (lv()===1) t = t.filter(x=>x!=="keyboard"); return t.filter(x=>!off(x)); }
function tabMeta(t){ return TAB_META[t] || CATS[t] || PACKS[t] || state.topics.find(x=>x.id===t) || {name:t,sym:"⭐"}; }
const pictured = it => !!(it.sym || it.art || (it.img && it.img!=="__idb__"));

function builtinItems(t){
  if (t==="core") return CORE;
  if (PACKS[t]) return PACKS[t].items;
  if (t==="phrases") return [...aboutMe(), ...PHRASES[m()].map((p,i)=>({id:`ph-${m()}-${i}`,label:p,sym:PHRASE_SYM[m()][i],pos:"social",builtin:true}))];
  const c = CATS[t]; if(!c) return [];

/* ---------------- Render ---------------- */
function apply(){
  applyLang(S.lang);
  const root = document.documentElement;
  root.style.setProperty("--scale", S.scale);
  root.dataset.contrast = S.contrast ? "on" : "off";
  document.body.classList.toggle("words-only", S.wordsOnly); document.body.classList.toggle("pics3d", S.pics==="3d");
  renderWho();
  document.body.classList.toggle("sparkle", S.look==="sparkle");
  if (!tabsFor().includes(tab)) tab = tabsFor()[0] || "home";
  if (sub && !groupKeys().includes(sub)) sub = null;
  renderTabs(); renderStrip(); renderBoard(); renderBanner();
  $("switchBar").hidden = S.scan==="off";
  restartScan();
  renderInstallBar(); checkLangVoice();
}

function renderStrip(){
  const box = $("msg"); box.replaceChildren();
  if (!msg.length && !typing){ box.append(el("span","ph", T(m()==="k" ? "Tap words to talk" : "Tap words or type to build a message"))); return; }
  for (const w of msg){
    const c = el("span","chip");
    if (w.img){ const i=el("img"); i.src=w.img; i.alt=""; c.append(i); }
    else if (w.art){ const a=el("span","art"); a.innerHTML=artSVG(w.art); c.append(a); attachPhoto(w.art, a); }
    else if (symOf(w) && !S.wordsOnly) c.append(symImg(w));
    else if (w.sym && !S.wordsOnly) c.append(el("span",null,w.sym));
    c.append(el("span",null,w.label)); box.append(c);
  }
  if (typing) box.append(el("span","chip typing",typing));
  box.scrollLeft = box.scrollWidth;
  $("formBtn").disabled = !(msg.length && !typing && formsOf(msg[msg.length-1]).length>1);
}

function renderTabs(){
  const box = $("tabs"); box.replaceChildren();
  for (const t of tabsFor()){
    const meta = tabMeta(t);
    const b = el("button","tab"); b.setAttribute("role","tab"); b.setAttribute("aria-selected", t===tab);
    b.dataset.tab = t;
    if (!S.wordsOnly) b.append(el("span",null,meta.sym));
    b.append(el("span",null,meta.name));
    b.onclick = () => {
      if (t==="groups" && tab==="groups" && sub){ sub=null; renderBoard(); restartScan(); return; }
      if (tab!==t){ tab=t; if (t==="groups") sub=null; renderTabs(); renderBoard(); restartScan(); }
    };
    box.append(b);
  }
}

function tileFor(it){
  const b = el("button","tile"); b.dataset.act="tile"; b.dataset.id=it.id; b.dataset.pos=it.pos||"noun";
  if (it.img && it.img!=="__idb__"){ const i=el("img"); i.src=it.img; i.alt=""; b.append(i); }
  else if (hasPic(it)){ const a=el("span","art"); a.innerHTML=artSVG(it); b.append(a); watchPhoto(it, a); }
  else if (symOf(it)) b.append(symImg(it));
  else if (it.sym) b.append(el("span","sym",it.sym));
  else b.classList.add("textonly");
  b.append(el("span","lbl",it.label));
  if (it.alt && S.nickShow==="both") b.append(el("small","alt",it.alt));
  b.setAttribute("aria-label", it.say && it.say!==it.label ? `${it.label}, says ${it.say}` : it.label);
  return b;
}

function renderBoard(){
  const board = $("board"); board.replaceChildren(); board.classList.remove("split"); board.scrollTop = 0; itemsById = new Map();
  if (tab==="keyboard") return renderKeyboard(board);
  if (tab==="home") return renderHome(board);
  const grid = el("div","grid");
  const h = hiddenSet();
  if (tab==="core"){
    const big = S.board==="48";
    grid.classList.add("fill"); if (big) grid.classList.add("dense");
    grid.style.setProperty("--cols", big?8:6); grid.style.setProperty("--rows", big?6:4);
    for (const id of coreLayout()){
      const it = CORE_BY_ID.get(id), t = tileFor(it); itemsById.set(it.id,it);
      // hidden or not-yet-introduced words keep their place so muscle memory never breaks
      if (!coreShown(it,h)){ t.classList.add("empty"); t.tabIndex=-1; t.setAttribute("aria-hidden","true"); delete t.dataset.act; }
      grid.append(t);
    }
  } else if (isTopic(tab)){
    board.classList.add("split");
    const pack = PACKS[tab], head = el("div","topichead");
    if (pack && pack.groups){
      const groups = [["all","All",pack.sym], ...pack.groups];
      for (const [g,name,sym] of groups){
        const b = el("button","chipbtn"); b.dataset.scan="1"; b.setAttribute("aria-pressed", grpOf(tab)===g);
        if (!S.wordsOnly) b.append(el("span",null,sym)); b.append(el("span",null,name));
        b.onclick = () => { setGrp(tab,g); save(); renderBoard(); restartScan(); }; head.append(b);
      }
    }
    if (pack && pack.facts && !off("facts")){
      const fb = el("button","chipbtn"); fb.dataset.scan="1"; fb.setAttribute("aria-pressed", state.facts);
      fb.append(el("span",null,"💡"), el("span",null, state.facts ? "Fun facts: on" : "Fun facts: off"));
      fb.onclick = () => { state.facts=!state.facts; save(); renderBoard(); restartScan(); }; head.prepend(fb);

function predictions(){
  const p = typing.toLowerCase();
  const L = state.learned;
  const pool = [...new Set([...Object.keys(L), ...WORDS])];
  const rank = w => (L[w]||0)*1000 - (WORDS.indexOf(w)===-1 ? 999 : WORDS.indexOf(w));
  if (!p) return pool.sort((a,b)=>rank(b)-rank(a)).slice(0,6);
  const fold = x => x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return pool.filter(w=>fold(w).startsWith(fold(p)) && w.toLowerCase()!==p).sort((a,b)=>rank(b)-rank(a)).slice(0,6);
}

let lastAct = 0;
function bump(word){ const w=word.toLowerCase(); if(!w || w.includes(" ")) return; state.learned[w]=(state.learned[w]||0)+1; save(); }
function activate(node){
  const now = performance.now();
  if (now - lastAct < S.debounceMs) return;   // ignore accidental double taps
  lastAct = now;
  const act = node.dataset.act;
  if (act==="folder"){ sub = node.dataset.k; renderBoard(); $("board").scrollTop = 0; restartScan(); return; }
  if (act==="tile"){
    const it = itemsById.get(node.dataset.id); if(!it) return;
    if (learn.on) return learnCheck(it,node);
    commitTyping();
    /* v1.12.1: on topic pages (Birds, Dogs, Cars...) a new pick replaces the last one, so Speak says only the one just chosen */
    const fromTopic = isTopic(tab);
    if (fromTopic) msg = msg.filter(w => !w.topic);
    msg.push({id:it.id, label:it.label, say:it.say, sym:it.sym, img:it.img, art:hasPic(it)?it:null, pos:it.pos, topic:fromTopic});
    const fl = $("factLine");
    if (it.fact && fl){ fl.dataset.touched="1"; fl.replaceChildren(el("b",null,it.label+". "), document.createTextNode(it.fact));
      if (photoSrcOf(it) && photosOn()){ const cr=el("small","credit","Photo: Wikimedia Commons"); fl.append(cr); photoCredit(it).then(t=>{ if(t) cr.textContent=t; }); } }
    if (isTopic(tab) && S.tapView==="big" && !off("bigview") && (hasPic(it) || (it.img && it.img!=="__idb__"))) showBig(it);
    if (it.fact && state.facts) say(`${it.label}. ${it.fact}`);
    else if (S.speakOnTap) say(it.say||it.label);
    track("taps"); bump(it.label); renderStrip(); pop(node);
  } else if (act==="key"){
    const k = node.dataset.k;
    if (k==="back"){ if (typing) typing=typing.slice(0,-1); else msg.pop(); }
    else if (k==="space"){ commitTyping(true); }
    else if (".?".includes(k)){ typing += k; commitTyping(); }
    else typing += k;
    renderStrip(); refreshPred();
  } else if (act==="pred"){
    const w = node.dataset.w; typing=""; msg.push({label:w, pos:guessPos(w)}); track("taps"); bump(w);
    if (S.speakOnTap) say(w);
    renderStrip(); refreshPred();
  }
}
function commitTyping(speakIt){
  const t = typing.trim(); if(!t) { typing=""; return; }
  msg.push({label:t, pos:guessPos(t)}); bump(t.replace(/[.?!]$/,"")); typing="";
  if (speakIt && S.speakOnTap) say(t);
}
function guessPos(w){ const k=w.toLowerCase(); const hit=CORE.find(c=>c.label.toLowerCase()===k); return hit ? hit.pos : ""; }

/* ---------------- Find-it game ----------------
   "Which one is the Blue Jay?" Three birds fly in. Right answer: a big YES flies across, cheers and confetti,
   then the next bird. Wrong answer: a gentle NO, the app says which bird they picked, and asks again.
   After two misses the right bird glows, so every round ends in success. */
let AC = null;
function audio(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==="suspended") AC.resume(); }catch{ AC=null; } return AC; }
function tone(f, t0, dur, type="sine", vol=.14, f2){
  const a = audio(); if(!a) return; const t=a.currentTime+t0, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if (f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(t0, dur, vol, freq, q=0.8){
  const a = audio(); if(!a) return; const t=a.currentTime+t0, n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(0.6+0.4*Math.sin(i/a.sampleRate*2*Math.PI*7));
  const src=a.createBufferSource(); src.buffer=buf; const bp=a.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=freq; bp.Q.value=q;
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*0.3); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp).connect(g).connect(a.destination); src.start(t); src.stop(t+dur);
}
const SND = {
  chirp(){ tone(2300,0,.09,"sine",.07,3500); tone(2700,.13,.09,"sine",.07,3900); tone(2500,.26,.13,"sine",.07,3300); },
  jingle(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.2,"triangle",.11)); },
  yay(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.08,.35,"triangle",.13)); noise(.05,1.6,.22,1400,.6); noise(.15,1.3,.12,2600,1.2);
         for(let i=0;i<8;i++) noise(.2+i*.13+Math.random()*.05,.06,.18,1800,2); },
  uhoh(){ tone(392,0,.22,"sine",.11); tone(311,.25,.34,"sine",.11); }
};

  g.innerHTML = `

    </div>
    <div class="g-stars" id="gStars" aria-label="Score"></div>
    <div class="g-field" id="gField"></div>
    ${S.scan!=="off"?`<button class="g-switch" id="gSwitch">Tap here (or press Space) to choose</button>`:""}
    <div class="g-banner" id="gBanner" aria-live="assertive"></div>
    <div class="g-start" id="gStart">
      <h2>${PACKS[t] ? esc(PACKS[t].game) : esc(tabMeta(t).name)+" game"}</h2>
      <p>Listen to the name, then tap the right ${what}.</p>
      <div class="g-opts" role="group" aria-label="How birds move">
        <button data-mo="fly">🐦 Fly in</button><button data-mo="cross">💨 Keep flying</button><button data-mo="still">✋ Stay still</button></div>
      <div class="g-opts"><button id="gNames">Show names</button><button id="gSnd">Sounds</button></div>
      <button class="go" id="gGo">▶ Play</button>
    </div>`;
  document.body.append(g);
  const $g = id => g.querySelector("#"+id);
  const field=$g("gField"), banner=$g("gBanner"), stars=$g("gStars");
  const syncOpts = () => {
    g.querySelectorAll("[data-mo]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mo===G.motion));
    $g("gNames").setAttribute("aria-pressed", G.names); $g("gSnd").setAttribute("aria-pressed", G.sound);
  };
  g.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{ G.motion=b.dataset.mo; save(); syncOpts(); });
  $g("gNames").onclick=()=>{ G.names=!G.names; save(); syncOpts(); };
  $g("gSnd").onclick=()=>{ G.sound=!G.sound; save(); syncOpts(); };
  syncOpts();

  let score=0, round=null, busy=false, bag=[], timer=null, scanT=null, scanI=-1;
  const play = name => { if (G.sound && SND[name]) SND[name](); };
  const drawStars = () => { stars.replaceChildren(); const shown=Math.min(score,10);
    for(let i=0;i<shown;i++) stars.append(el("span",null,"⭐"));
    if (score) stars.append(el("span","n",`${score} found${G.best?` · best ${G.best}`:""}`)); };
  const nextTarget = () => { if(!bag.length) bag = pool.map((_,i)=>i).sort(()=>Math.random()-.5); return pool[bag.pop()]; };
  const looksDifferent = (a,b) => !a.art || !b.art || a.art.c.b!==b.art.c.b || a.art.tpl!==b.art.tpl;
  function picture(it){
    const wrap = el("span","art");
    if (it.img){ const i=el("img","pic"); i.src=it.img; i.alt=""; return i; }
    if (hasPic(it)){ wrap.innerHTML = artSVG(it); attachPhoto(it, wrap); if (photoDB[it.id] && !photoDB[it.id].src) {} watchPhoto(it, wrap); return wrap; }
    if (symOf(it)) return symImg(it);
    return el("span","gsym",it.sym||"⭐");
  }
  function ask(){ say(`Which ${what} is ${theName(t, round.target)}?`); }
  function newRound(){
    busy=false; clearTimeout(timer);
    const target = nextTarget();
    const others = pool.filter(it=>it.id!==target.id).sort(()=>Math.random()-.5);
    const picks = [...others.filter(o=>looksDifferent(o,target)), ...others].filter((v,i,a)=>a.indexOf(v)===i).slice(0,2);
    const choices = [target, ...picks].sort(()=>Math.random()-.5);
    round = {target, choices, misses:0};
    $g("gName").textContent = theName(t, target);
    field.className = "g-field" + (G.motion==="cross" ? " cross" : "");
    field.replaceChildren();
    choices.forEach((it,i)=>{
      const b = el("button","g-bird"); b.dataset.id = it.id; b.setAttribute("aria-label", it.label);
      b.append(picture(it)); b.append(el("span","gname", G.names ? it.label : ""));
      if (G.motion==="fly"){ b.classList.add("in"); b.style.animationDelay = `${i*0.25}s, ${0.9+i*0.25}s`; }
      if (G.motion==="cross"){ b.style.top = (6+i*31)+"%"; b.style.setProperty("--dur",(9+i*1.7)+"s"); b.style.setProperty("--delay",(-i*3.1)+"s"); }
      b.addEventListener("pointerdown", e=>{ e.preventDefault(); choose(it,b); });
      b.addEventListener("click", e=>{ if (e.detail===0) choose(it,b); });
      field.append(b);
    });
    play("chirp"); setTimeout(ask, 350); restartGameScan();
  }
  function showBanner(kind, sub){
    banner.replaceChildren();
    const big = el("div","big "+kind, kind==="yes" ? "YES!" : "NO");
    const still = reduced || S.look!=="sparkle";
    big.classList.add(still ? "still" : kind==="yes" ? "flyyes" : "popno");
    banner.append(big); if (sub) banner.append(Object.assign(el("div","sub",sub),{className:"sub "+(still?"still":kind==="yes"?"flyyes":"popno")}));
  }
  function choose(it, node){
    if (busy || !round) return;
    if (it.id===round.target.id){
      busy=true; stopGameScan(); score++; if (score>G.best){ G.best=score; } state.practice.right++; state.practice.tries++; save();
      field.classList.add("done");
      field.querySelectorAll(".g-bird").forEach(b=>{ b.classList.remove("hint"); b.classList.add(b===node?"right":"fade"); });
      node.querySelector(".gname").textContent = it.label;
      showBanner("yes", `That's ${theName(t, it)}!`);
      play("yay"); confetti(score%5===0 ? 140 : 70);
      say(score%5===0 ? `Yes! That's ${theName(t, it)}! Wow, ${score} in a row!` : `Yes! That's ${theName(t, it)}!`);
      drawStars();
      timer = setTimeout(newRound, score%5===0 ? 3400 : 2700);
    } else {
      round.misses++; state.practice.tries++; save();
      node.classList.remove("wrong"); void node.offsetWidth; node.classList.add("wrong");
      showBanner("no", "Try again!"); play("uhoh");
      say(`No, that's ${theName(t, it)}. Which ${what} is ${theName(t, round.target)}?`);
      if (round.misses>=2){ const right = field.querySelector(`[data-id="${CSS.escape(round.target.id)}"]`); right && right.classList.add("hint"); }
    }
  }
  // switch and listening access inside the game
  function stopGameScan(){ clearInterval(scanT); scanT=null; g.querySelectorAll(".scan-on").forEach(n=>n.classList.remove("scan-on")); }
  function restartGameScan(){ stopGameScan(); if (S.scan==="off") return; scanI=-1;
    scanT=setInterval(()=>{ const bs=[...field.querySelectorAll(".g-bird")]; if(!bs.length) return; g.querySelectorAll(".scan-on").forEach(n=>n.classList.remove("scan-on"));
      scanI=(scanI+1)%bs.length; bs[scanI].classList.add("scan-on"); if (S.scan==="listen") say(bs[scanI].getAttribute("aria-label"), true); }, S.scanMs); }
  function scanPick(){ const bs=[...field.querySelectorAll(".g-bird")]; const b=bs[scanI]; if(!b) return; const it=round.choices.find(c=>c.id===b.dataset.id); choose(it,b); }
  const onKey = e => { if (!g.isConnected) return; if (S.scan!=="off" && (e.key===" "||e.key==="Enter") && !$g("gStart")){ e.preventDefault(); scanPick(); } };
  document.addEventListener("keydown", onKey);
  if ($g("gSwitch")) $g("gSwitch").addEventListener("pointerdown", e=>{ e.preventDefault(); scanPick(); });

  $g("gHear").onclick = () => { if (round){ play("chirp"); ask(); } };
  $g("gGo").onclick = () => { audio(); play("jingle"); $g("gStart").remove(); drawStars(); setTimeout(newRound, 450); };
  // leaving: a hold when the caregiver lock is on, so a child doesn't exit by accident
  const close = () => { clearTimeout(timer); stopGameScan(); document.removeEventListener("keydown", onKey); if (synth) synth.cancel(); g.remove(); renderBoard(); restartScan(); };
  const x = $g("gX"); let xt=null;
  x.addEventListener("pointerdown", ()=>{ if(!S.lock) return; x.classList.add("holding"); xt=setTimeout(()=>{ xt="done"; close(); },1000); });
  x.addEventListener("pointerup", ()=>{ if(!S.lock) return; if(xt && xt!=="done"){ clearTimeout(xt); x.classList.remove("holding"); toast("Hold ✕ to leave the game."); } });
  x.addEventListener("pointerleave", ()=>{ if(xt && xt!=="done"){ clearTimeout(xt); x.classList.remove("holding"); } });
  x.addEventListener("click", e=>{ if (!S.lock || e.detail===0) close(); });
}

/* ---------------- Practice ---------------- */
function startLearn(){ learn.on=true; learn.tab = (isTopic(tab) || (tab==="groups" && sub)) ? tab : "core"; tab = learn.tab; apply(); nextTarget(); }
function stopLearn(){ learn.on=false; learn.target=null; document.querySelectorAll(".tile.hint,.tile.right").forEach(t=>t.classList.remove("hint","right")); renderBanner(); restartScan(); }
function nextTarget(){
  document.querySelectorAll(".tile.hint,.tile.right").forEach(t=>t.classList.remove("hint","right"));
  const h = hiddenSet();
  let pool;
  if (learn.tab && learn.tab!=="core"){ pool = [...itemsById.values()].filter(it=>it!==learn.target); }
  else pool = CORE.filter(it=>coreShown(it,h) && it!==learn.target);
  learn.target = pool[Math.floor(Math.random()*pool.length)] || CORE[0]; learn.misses=0;
  renderBanner(); say("Find " + learn.target.label);
}
function learnCheck(it,node){
  state.practice.tries++;
  if (it.id===learn.target.id){
    state.practice.right++; save(); node.classList.add("right"); say("Yes! " + it.label); burst(node,16);
    renderBanner(); setTimeout(()=>{ if(learn.on) nextTarget(); }, 1500);
  } else {
    learn.misses++; save(); say(it.label);
    if (learn.misses>=2){
      const t = board.querySelector(`[data-id="${learn.target.id}"]`); if (t){ t.classList.remove("hint"); void t.offsetWidth; t.classList.add("hint"); }
      setTimeout(()=>say("Find " + learn.target.label), 900);
    }
  }
}
$("learnBtn").onclick = () => learn.on ? stopLearn() : startLearn();

/* ---------------- Switch and listening scanning ---------------- */
const scan = {timer:null,i:-1,els:[]};
function scanTargets(){
  return [...board.querySelectorAll("[data-scan],[data-act]"), $("speakBtn"), $("formBtn"), $("delBtn"), $("clrBtn"), ...$("tabs").querySelectorAll(".tab")];
}
function stopScan(){ clearInterval(scan.timer); scan.timer=null; document.querySelectorAll(".scan-on").forEach(n=>n.classList.remove("scan-on")); }
function restartScan(delay=0){
  stopScan();
  if (S.scan==="off" || document.querySelector(".sheet,.helpcard,.game,.bigpic")) return;
  setTimeout(()=>{
    if (S.scan==="off" || scan.timer) return;
    scan.els = scanTargets(); scan.i = -1;
    scan.timer = setInterval(stepScan, S.scanMs); stepScan();
  }, delay);
}
function stepScan(){
  document.querySelectorAll(".scan-on").forEach(n=>n.classList.remove("scan-on"));
  if (!scan.els.length) return;
  scan.i = (scan.i+1) % scan.els.length;
  const n = scan.els[scan.i]; n.classList.add("scan-on"); n.scrollIntoView({block:"nearest",inline:"nearest"});
  if (S.scan==="listen") say(n.dataset.w || n.getAttribute("aria-label") || n.textContent, true);
}
function scanSelect(){
  const n = scan.els[scan.i]; if(!n) return;
  stopScan();
  if (n.dataset.act) activate(n); else n.click();
  restartScan(S.scan==="listen" ? 1400 : 250);
}
$("switchBar").addEventListener("pointerdown", e=>{ e.preventDefault(); scanSelect(); });
document.addEventListener("keydown", e=>{
  if (S.scan==="off" || document.querySelector(".sheet,.helpcard,.game,.bigpic")) return;
  if (e.key===" " || e.key==="Enter"){ e.preventDefault(); scanSelect(); }
});

function shrink(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s=160, c=document.createElement("canvas"); c.width=c.height=s; const g=c.getContext("2d");
      const k=Math.min(img.width,img.height); g.drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,s,s);
      res(c.toDataURL("image/jpeg",0.8)); }; img.onerror=rej; img.src=r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function safetyRows(){
    const rows = [];
    rows.push(health.idb ? ["ok","Saved on this device"] : health.idb===false ? ["warn", health.localOK ? "Saved, but with limited room on this device. Keep backup files." : "This device isn't saving changes. Save a backup file now."] : ["wait","Checking this device's storage…"]);
    rows.push(health.persisted ? ["ok","Protected from automatic clean-up"] : ["warn", !installable() ? "This preview can't be protected from clean-up. Open Speakeasy from its own web address and install it. Keep backup files until then." : installed() ? "Not yet protected from automatic clean-up. Keep backup files." : "Install Speakeasy to protect it from automatic clean-up."]);
    rows.push(installed() ? ["ok","Installed as an app"] : ["warn", !installable() ? "This preview can't be installed or used offline. Open Speakeasy from its own web address to install it." : isIOS ? "Not installed yet. In Safari, tap Share, then Add to Home Screen." : "Not installed yet. Use your browser's Install app option."]);
    const lb = state.lastBackup;
    rows.push(lb && Date.now()-lb < 14*864e5 ? ["ok",`Backup file saved ${fmtDay(lb)}`] : ["warn", lb ? `Last backup file ${fmtDay(lb)}. Time for a new one.` : "No backup file yet."]);
  return rows;
}

const stampOf = d => { const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
function track(kind){
  const D = state.stats.days, k = stampOf(new Date()); const r = D[k] ||= {taps:0, said:0}; r[kind] = (r[kind]||0) + 1;
  const keys = Object.keys(D).sort(); while (keys.length > 60) delete D[keys.shift()];

function guarded(btn, action){
  let t = null;
  btn.addEventListener("pointerdown", ()=>{ if (!S.lock) return; btn.classList.add("holding"); t = setTimeout(()=>{ t="done"; btn.classList.remove("holding"); action(); }, 1500); });
  const cancel = tell => { if (t && t!=="done"){ clearTimeout(t); t=null; btn.classList.remove("holding"); if (tell) toast("Caregivers: hold for 2 seconds to open this."); } };
  btn.addEventListener("pointerup", ()=>cancel(true));
  btn.addEventListener("pointerleave", ()=>cancel(false));
  btn.addEventListener("click", e=>{ if (!S.lock || e.detail===0) action(); t = null; });
}

    if (k==="install") return openInstall();
    if (k==="device") return openDeviceCheck();
    if (k==="settings") return openSettings();
    if (["words","help-set","voice","safe"].includes(k)) return openSettings(k==="help-set" ? "help" : k);
    tab = k; if (k==="groups") sub = null;                      // a word board
    renderTabs(); renderBoard(); restartScan();
    document.querySelector(`.tab[data-tab="${CSS.escape(k)}"]`)?.scrollIntoView({inline:"center",block:"nearest"});
  };
  const group = (title, items, opts={}) => {
    items = items.filter(x=>(!(["core","groups","phrases","keyboard"].includes(x[0]) || isTopic(x[0])) || tabsFor().includes(x[0])) && (x[0]!=="find" || lv()>1)
      && !(x[0].startsWith("game:") && off("games")) && !(["find","practice","help","people"].includes(x[0]) && off(x[0])) && !(x[0]==="helppractice" && off("help")));
    const sec = el("div","sec"); sec.append(el("h3",null,title));
    if (opts.care) sec.append(el("p","note", S.lock ? "For caregivers. Hold a button for 2 seconds to open it." : "For caregivers."));
    const grid = el("div","mgrid");
    for (const [k,sym,name,desc,extra] of items){
      const b = el("button","mtile"+(opts.care?" care":"")+(extra?" "+extra:"")+(k===tab?" here":""));
      if (k===tab) b.setAttribute("aria-current","page");
      b.append(el("span","mi",sym));
      const t = el("span","mt"); t.append(document.createTextNode(name)); if (desc) t.append(el("small",null,desc)); b.append(t);
      if (opts.care){ b.append(el("span","ring")); guarded(b, ()=>go(k)); } else b.onclick = () => go(k);
      grid.append(b);
    }
    sec.append(grid); panel.append(sec);
  };
  const topicRows = topicTabs().map(t => [t, tabMeta(t).sym, tabMeta(t).name, PACKS[t] ? `${PACKS[t].items.length} ${PACKS[t].plural} with fun facts` : `${(state.custom[t]||[]).length} words`]);
  group("Talk", [
    ["core","⭐","Core words","The main talking board"], ...topicRows,
    ["groups","🗂️","Word groups","Feelings, food, people and more"],
    ["phrases","💬","Phrases","Whole sentences, ready to say"],
    ["keyboard","⌨️","Keyboard","Spell any word"]
  ]);
  group("Play and learn", [
    ...topicTabs().filter(t=>PACKS[t]).map(t=>["game:"+t,"🎮",PACKS[t].game, PACKS[t].noun==="one" ? "Find the right picture" : `Find the right ${PACKS[t].noun}`]),
    ["practice","🎯", learn.on ? "Stop practice" : "Practice", learn.on ? "Practice is on now" : "Find words on the board"],
    ["find","🔍","Find a word","See where a word lives"],
    ["helppractice","🆘","Help practice","Learn how to get help"]
  ]);
  group("People", [["people","👥","Who's talking", REG.list.length>1 ? `${REG.list.length} people on this device` : "Switch between people"]]);
  group("How to use", [
    ["guide-talk","👋","How to talk","Simple steps for the user"],
    ["guide-care","📘","Caregiver guide","Set up, teach and keep safe"],
    ["guide-faq","❓","Questions","Type a question, get an answer"]
  ]);
  group("Help", [["help","🆘","Help card","Shows and says who to call","sos"]]);
  group("Caregivers 🔒", [
    ["dash","📊","Dashboard","Progress, setup steps, safety"],
    ["profile","🪪","Edit profile","Name, age, favorites, level"],
    ["check","🧭","Level check","Suggests the right level"],
    ["add","➕","Add a person","Their own words and progress"],
    ["words","✏️","Edit words","Add words and photos"],
    ["help-set","🆘","Set up Help card","Name and emergency contact"],
    ["card","🖨️","How to talk with me","A card for teachers and sitters"],
    ["voice","🔊","Voice","Pick a voice and speed"],
    ["safe","💾","Backups","Keep their words safe"],
    ...(installed() ? [] : [["install","📲","Save to this device","Opens like an app, works offline"]]),
    ["device","📱","This device","Voices, offline, voice control"],
    ["settings","⚙️","All settings","Every option in one list"]
  ], {care:true});
}

/* ---- Caregiver dashboard ---- */
function openDashboard(){
  const {panel, close} = makeSheet("Caregiver dashboard","dash");
  const render = () => {
    const D = state.stats.days, days = [];
    for (let i=6; i>=0; i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push({d, r:D[stampOf(d)]||{taps:0,said:0}, today:i===0}); }
    const taps = days.reduce((n,x)=>n+(x.r.taps||0),0), said = days.reduce((n,x)=>n+(x.r.said||0),0), used = days.filter(x=>x.r.taps>0).length;
    const maxT = Math.max(1, ...days.map(x=>x.r.taps||0));
    const top = Object.entries(state.learned).sort((a,b)=>b[1]-a[1]).slice(0,12);
    const P = state.practice, pct = P.tries ? Math.min(100, Math.round(P.right/P.tries*100)) : null;
    const lb = state.lastBackup, backupOK = !!lb && Date.now()-lb < 14*864e5;
    const tasks = [
      ["Make their profile", !!(state.profile.name && state.profile.age), "profile"],
      ["Do the level check", !!state.profile.check, "check"],
      ["Read the caregiver guide", !!state.guideSeen, "guide"],
      ["Add emergency contacts", hasContacts(), "help"],
      ["Practice getting help", !!state.helpPracticed, "helppractice"],
      ["Make a How to talk with me card", !!state.cardMade, "card"],
      ["Choose a voice", !!S.voiceURI, "voice"],
      ["Add their own words or photos", addedWords(state)>0, "words"],
      ["Save a backup file", backupOK, "backup"],
      ["Save Speakeasy to this device", installed(), "install"]
    ];
    const done = tasks.filter(t=>t[1]).length;
    const voice = voices.find(v=>v.voiceURI===S.voiceURI);
    const fact = (v,l) => `<div class="fact"><b>${esc(v)}</b><span>${esc(l)}</span></div>`;
    const who = state.profile.name || "This person", hint = moveUpHint();
    const hintHTML = hint ? `<div class="dcard" style="border-color:var(--verb-bd);margin-bottom:10px"><h4>🌱 Ready for more?</h4><p class="note" style="color:var(--ink)">${esc(who)} uses ${hint.used} of the ${hint.shown} core words showing, at least 3 times each. They may be ready for Level ${lv()+1}.</p><div class="row" style="justify-content:flex-start"><button class="btn primary" data-do="up">Move up to Level ${lv()+1}</button></div></div>` : "";
    panel.innerHTML = `<div class="phead"><h2>Dashboard</h2><button class="btn primary" id="dClose">Done</button></div>
      <p class="note">${esc(state.profile.avatar||"🙂")} ${esc(who)} · Level ${lv()} ${LEVELS[lv()].tag}. These numbers stay on this device and are never sent anywhere.</p>${hintHTML}
      <div class="dgrid">
        <div class="dcard"><h4>✅ Setup steps</h4>
          <div class="progress" role="progressbar" aria-label="Setup steps done" aria-valuemin="0" aria-valuemax="${tasks.length}" aria-valuenow="${done}"><i style="width:${Math.round(done/tasks.length*100)}%"></i></div>
          <p class="note">${done} of ${tasks.length} done${done===tasks.length?". Everything is set up.":""}</p>
          <div>${tasks.map(([t,ok,k])=>`<div class="todo${ok?" done":""}"><span class="tk" aria-hidden="true">${ok?"✅":"⬜"}</span><span class="tt">${esc(t)}</span>${ok?"":`<button class="btn" data-do="${k}">Do it</button>`}</div>`).join("")}</div></div>
        <div class="dcard"><h4>💬 Talking this week</h4>
          <div class="facts">${fact(taps,"words tapped")}${fact(said,"messages spoken")}${fact(used+" of 7","days used")}${fact(Object.keys(state.learned).length,"different words, all time")}</div>
          <div class="bars" role="img" aria-label="Words tapped each day this week: ${days.map(x=>(x.r.taps||0)).join(", ")}">${days.map(x=>`<div class="bar${x.today?" today":""}"><span>${x.r.taps||0}</span><i style="height:${Math.round((x.r.taps||0)/maxT*72)}px"></i><span>${esc(x.d.toLocaleDateString(undefined,{weekday:"short"}))}</span></div>`).join("")}</div></div>
        <div class="dcard"><h4>⭐ Most used words</h4>
          ${top.length ? `<div class="toplist">${top.map(([w,n])=>`<span>${esc(w.replace(/^i(?=$|['’])/,"I"))}<small>${n}</small></span>`).join("")}</div>` : `<p class="note">The words they tap most will show here.</p>`}
          <p class="note">Their favorite words are great ones to model. Use them in short sentences on the board while you talk.</p></div>
        <div class="dcard"><h4>🎯 Practice and games</h4>
          <div class="facts">${fact(P.right,"words and birds found")}${fact(pct===null?"–":pct+"%","of tries were right")}${fact((state.game&&state.game.best)||0,"best bird game streak")}${fact(learn.on?"On":"Off","practice right now")}</div>
          <div class="row" style="justify-content:flex-start"><button class="btn" data-do="practice">${learn.on?"Stop practice":"Start practice"}</button>${topicTabs().find(t=>PACKS[t])?`<button class="btn" data-do="game">${esc(PACKS[topicTabs().find(t=>PACKS[t])].game)}</button>`:""}</div></div>
        <div class="dcard"><h4>💾 Keep their words safe</h4>
          <div class="checks">${checksHTML(safetyRows())}</div>
          <div class="row" style="justify-content:flex-start"><button class="btn primary" data-do="backup">Save backup file</button></div></div>
        <div class="dcard"><h4>⚙️ Current setup</h4>
          <div class="facts">${fact("Level "+lv(),LEVELS[lv()].tag)}${fact(state.profile.age?ageOf(state.profile.age)[1]:"Not set","age group")}${fact(state.profile.interests.length,"favorite things")}${fact(S.board+" buttons","core board")}${fact(S.level==="starter"?"12":S.level==="24"?"24":"All","core words showing")}${fact(voice?voice.name:"Device default","voice")}${fact(S.scan==="off"?"Off":S.scan==="switch"?"Switch":"Listening","scanning")}</div>
          <div class="row" style="justify-content:flex-start"><button class="btn" data-do="settings">Change settings</button><button class="btn" data-do="guide">Caregiver guide</button></div></div>
      </div>`;
    panel.querySelector("#dClose").onclick = close;
    panel.querySelectorAll("[data-do]").forEach(b=>b.onclick = async () => {
      const k = b.dataset.do;
      if (k==="backup"){ if (await saveBackupFile()) render(); return; }
      if (k==="install"){ close(); openInstall(); return; }
      close();
      if (k==="profile") return openProfileEditor();
      if (k==="check") return openLevelCheck();
      if (k==="helppractice") return openHelpPractice();
      if (k==="card") return openTalkCard();
      if (k==="up"){ setLevel(lv()+1); return; }
      if (k==="guide") openGuide("care");
      else if (k==="practice") learn.on ? stopLearn() : startLearn();
      else if (k==="game") openGame(topicTabs().find(t=>PACKS[t]));
      else if (k==="settings") openSettings();
      else openSettings(k);
    });
  };
  render();
}

const STOPWORDS = new Set("a an the i my me to do how can is it its what why where when does on in of and or for with this that you your be are am not dont don't won't wont cant can't there their they them we our please help want".split(" "));
function faqMatches(text){
  if (L10) return faqMatchesL10(text);
  const words = text.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(w=>w.length>1 && !STOPWORDS.has(w)).map(w=>w.replace(/(ing|es|s)$/,"")).filter(w=>w.length>1);
  if (!words.length) return [];
  return FAQ.map(f=>{ const keys = f[3].toLowerCase(), hay = (f[1]+" "+f[2]+" "+f[3]).toLowerCase(); let sc = 0;
      for (const w of words){ if (keys.includes(w)) sc += 3; else if (f[1].toLowerCase().includes(w)) sc += 2; else if (hay.includes(w)) sc += 1; } return {f, sc}; })
    .filter(x=>x.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,6).map(x=>x.f);
}

const fold = x => String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function faqMatchesL10(text){
  const stop = new Set((L10.stop||"").split(" "));
  const words = fold(text).replace(/[^a-z0-9ñ\s]/g," ").split(/\s+/).filter(w=>w.length>2 && !stop.has(w)).map(w=>w.replace(/(es|s)$/,"")).filter(w=>w.length>2);
  if (!words.length) return [];
  return FAQ.map((f,i)=>{ const q = fold(T(f[1])), keys = fold((L10.faqkw||{})[f[1]]||"") + " " + fold(f[3]), hay = q + " " + fold(T(f[2])); let sc = 0;
      for (const w of words){ if (keys.includes(w)) sc += 3; else if (q.includes(w)) sc += 2; else if (hay.includes(w)) sc += 1; } return {f, sc}; })
    .filter(x=>x.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,6).map(x=>x.f);
}

function openGuide(which="talk", first=false){
  const {panel, close} = makeSheet("How to use Speakeasy","guide");
  let cur = which, query = "";
  // where a step or answer can take you; settings and the profile need the caregiver hold when the lock is on
  const act = (o, btn) => {
    if (o.show){ btn.onclick = () => { const n = typeof o.show==="string" ? document.querySelector(o.show) : o.show(); close(); setTimeout(()=>spotlight(n, cur==="talk" ? o.h : ""), 150); }; return; }
    if (o.faq){ btn.onclick = () => { cur = "faq"; render(); panel.scrollTop = 0; }; return; }
    guarded(btn, () => { close(); if (o.dash) openDashboard(); else if (o.card) openTalkCard(); else if (o.install) openInstall(); else if (o.device) openDeviceCheck(); else if (o.profile) openProfileEditor(); else openSettings(o.go); });
  };
  const actLabel = o => o.show ? "👀 Show me" : o.faq ? "❓ Ask a question" : "Take me there";
  const hasAct = o => o.show || o.go || o.dash || o.profile || o.faq || o.card || o.install || o.device;
  const faqCard = (f, i) => `<div class="faq"><b>${esc(f[1])}</b><p>${esc(f[2])}</p>${hasAct(f[4])?`<span class="sa"><button class="btn" data-fa="${i}">${actLabel(f[4])}${f[4].show?"":`<span class="ring"></span>`}</button></span>`:""}</div>`;
  const groupsHTML = () => [...new Set(FAQ.map(f=>f[0]))].map(t=>`<details class="faqgrp"><summary>${esc(t)}</summary>${FAQ.map((f,i)=>f[0]===t?faqCard(f,i):"").join("")}</details>`).join("");
  const resultsHTML = () => { const q = query.trim(); if (!q) return groupsHTML(); const hits = faqMatches(q);
    return hits.length ? hits.map(f=>faqCard(f, FAQ.indexOf(f))).join("")
      : `<div class="faq"><b>We don't have an answer for that yet.</b><p>Try other words, like voice, photo, level, backup or game. Or open a topic below.</p></div>${groupsHTML()}`; };
  const bindFa = () => panel.querySelectorAll("[data-fa]").forEach(b=>act(FAQ[+b.dataset.fa][4], b));
  const render = () => {
    if (cur==="care" && !state.guideSeen){ state.guideSeen = true; save(); }
    panel.classList.toggle("kid", cur==="talk");
    const steps = cur==="faq" ? [] : GUIDE[cur].filter(s=>!s.need || s.need());
    let body = "";
    if (cur==="faq"){
      body = `<div class="faqbox"><label for="gq" class="note" style="color:var(--ink);font-weight:600">Type your question</label>
        <input type="search" id="gq" value="${esc(query)}" placeholder="Like: no sound, add a photo, change the level" autocomplete="off" enterkeyhint="search"></div>
        <div id="gRes" class="faqlist">${resultsHTML()}</div>
        <div class="faq"><b>Still stuck?</b><p>Email McLearn Media at <span class="sel">${esc(SUPPORT_EMAIL)}</span> and tell us what happened.</p><span class="sa"><button class="btn" id="gCopy">Copy email address</button></span></div>`;
    } else {
      body = `<ol class="steps">${steps.map((s,i)=>`<li class="step"><span class="num" aria-hidden="true">${i+1}</span><span class="sh">${esc(s.h)}</span><span class="sb">${esc(s.b)}</span>
        <span class="sa">${cur==="talk"?`<button class="btn" data-say="${i}">🔊 Read it to me</button>`:""}${hasAct(s)?`<button class="btn" data-go="${i}">${actLabel(s)}${s.show||s.faq?"":`<span class="ring"></span>`}</button>`:""}</span></li>`).join("")}</ol>
        ${cur==="care"?`<p class="note" style="margin-top:12px">${S.lock?"Take me there buttons open settings, so hold them for 2 seconds. ":""}Speakeasy is a communication tool, not therapy. A speech-language pathologist can help choose the right words, settings and goals.</p>`:""}`;
    }
    panel.innerHTML = `<div class="phead"><h2>How to use</h2><button class="btn primary" id="gClose">${first?"Start talking":"Close"}</button></div>
      ${first?`<p class="note">Welcome to Speakeasy. Here's how it works. You can open this again anytime from the Menu.</p>`:""}
      <div class="row" style="justify-content:flex-start;margin-block:8px"><span class="seg" role="group" aria-label="Guide sections">
        <button data-g="talk" aria-pressed="${cur==="talk"}">For the user</button><button data-g="care" aria-pressed="${cur==="care"}">For caregivers</button><button data-g="faq" aria-pressed="${cur==="faq"}">Questions</button></span></div>
      ${body}`;
    panel.querySelector("#gClose").onclick = close;
    panel.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ cur=b.dataset.g; render(); panel.scrollTop=0; });
    panel.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{ const s=steps[+b.dataset.say]; say(`${s.h} ${s.b}`); });
    panel.querySelectorAll("[data-go]").forEach(b=>act(steps[+b.dataset.go], b));
    bindFa();
    const gq = panel.querySelector("#gq");
    if (gq){
      gq.oninput = e => { query = e.target.value; panel.querySelector("#gRes").innerHTML = resultsHTML(); bindFa(); };
      panel.querySelector("#gCopy").onclick = async () => { try { await navigator.clipboard.writeText(SUPPORT_EMAIL); toast("Email address copied."); } catch { const r=document.createRange(); r.selectNodeContents(panel.querySelector(".sel")); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r); toast("Copying is blocked here. The address is selected."); } };
    }
  };
  render();
  if (cur==="faq") setTimeout(()=>panel.querySelector("#gq")?.focus(), 80);
}

async function deletePerson(id){
  if (REG.list.length < 2) return;
  try { localStorage.removeItem(lsKey(id)); } catch {}
  if (idb){ try {
    await idbDo("kv","readwrite", st => st.delete(idbKey(id)));
    const all = await idbDo("points","readonly", st => st.getAll());
    for (const p of all||[]) if ((p.pid||"main")===id) await idbDo("points","readwrite", st => st.delete(p.t));
