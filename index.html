<style>
/* Layout: one-screen communicator — top bar, message strip, word-group tabs, and a fixed-position word grid that fills the rest.
   Chrome uses McLearn DS01; word tiles use the Fitzgerald color key that AAC users and therapists already know. */
:root{
  --bg:#FAF1E5; --bg2:#EAD9C8; --card:#FFFFFF; --ink:#2A2420; --muted:#6E635A; --line:#D1C2B5;
  --brand:#8A3A1A; --brand2:#C45D34; --soft:#F3E2D2; --on-brand:#FFFFFF; --scrim:rgba(42,36,32,.55);
  /* Fitzgerald key: tile fill / border */
  --pron-bg:#FFF2A8; --pron-bd:#C9A400;   /* people words */
  --verb-bg:#D3F0CB; --verb-bd:#3E8E37;   /* action words */
  --desc-bg:#D5E6FF; --desc-bd:#2F66C2;   /* describing words */
  --noun-bg:#FFDFC2; --noun-bd:#D2701A;   /* things and places */
  --social-bg:#FAD6E8; --social-bd:#B83F77;/* social words */
  --q-bg:#E5D9FA;    --q-bd:#7048BE;      /* questions */
  --prep-bg:#F3EFEB; --prep-bd:#8E837A;   /* little words */
  --neg-bg:#FFD3CF;  --neg-bd:#C8372B;    /* no / not */
  --font-brand:"Fraunces",Georgia,"Times New Roman",serif;
  --font-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-tile:"Atkinson Hyperlegible","Hanken Grotesk",system-ui,sans-serif;
  --scale:1.1; --r-sm:8px; --r-md:12px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1815; --bg2:#262019; --card:#2A2420; --ink:#F4EADF; --muted:#B9AC9F; --line:#4A3F37;
  --brand:#E3906A; --brand2:#D2754E; --soft:#3A2C24; --on-brand:#1C1815; --scrim:rgba(0,0,0,.65);
  --pron-bg:#463C0E; --pron-bd:#E0BE2A; --verb-bg:#1E3A1B; --verb-bd:#6BC062;
  --desc-bg:#172A4A; --desc-bd:#6E9FEA; --noun-bg:#46280F; --noun-bd:#EE9446;
  --social-bg:#43172C; --social-bd:#E178AA; --q-bg:#2B1D48; --q-bd:#A88AEB;
  --prep-bg:#322D29; --prep-bd:#A69A90; --neg-bg:#4A1613; --neg-bd:#F0685C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1815; --bg2:#262019; --card:#2A2420; --ink:#F4EADF; --muted:#B9AC9F; --line:#4A3F37;
  --brand:#E3906A; --brand2:#D2754E; --soft:#3A2C24; --on-brand:#1C1815; --scrim:rgba(0,0,0,.65);
  --pron-bg:#463C0E; --pron-bd:#E0BE2A; --verb-bg:#1E3A1B; --verb-bd:#6BC062;
  --desc-bg:#172A4A; --desc-bd:#6E9FEA; --noun-bg:#46280F; --noun-bd:#EE9446;
  --social-bg:#43172C; --social-bd:#E178AA; --q-bg:#2B1D48; --q-bd:#A88AEB;
  --prep-bg:#322D29; --prep-bd:#A69A90; --neg-bg:#4A1613; --neg-bd:#F0685C; color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);margin:0;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px;box-sizing:border-box;max-width:1100px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--font-brand);font-weight:600;font-size:20px;color:var(--brand);letter-spacing:-.01em}
.mode{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.spacer{flex:1}
.ibtn{min-width:44px;height:44px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:600;font-size:14px;position:relative;overflow:hidden}
.ibtn.help{background:var(--neg-bg);border-color:var(--neg-bd)}
.ibtn .ring{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--brand)}
.ibtn.holding .ring{animation:fill var(--hold,1.5s) linear forwards}
@keyframes fill{to{width:100%}}

/* message strip */
.strip{display:flex;gap:6px;align-items:stretch;background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:6px;min-height:calc(64px*var(--scale))}
.msg{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:2px;border-radius:var(--r-md);cursor:pointer}
.msg .ph{color:var(--muted);font-size:15px;padding-left:6px;white-space:nowrap}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--r-sm);background:var(--soft);
  font-family:var(--font-tile);font-weight:700;font-size:calc(16px*var(--scale));white-space:nowrap}
.chip img{width:calc(24px*var(--scale));height:calc(24px*var(--scale));object-fit:cover;border-radius:4px}
.chip.typing{background:transparent;border:2px dashed var(--line)}
.chip.typing::after{content:"";width:2px;height:1.1em;background:var(--brand);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sbtn{flex:none;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--bg);min-width:52px;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.sbtn.speak{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-size:16px;padding:0 14px;gap:6px;min-width:84px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* learn banner */
.banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--soft);border:2px solid var(--brand2);border-radius:var(--r-lg);padding:8px 10px}
.banner .ask{font-family:var(--font-tile);font-weight:700;font-size:20px;flex:1;min-width:140px}
.banner .score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* board */
.board{flex:1;min-height:0;overflow:auto;border-radius:var(--r-md)}
.grid{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:6px;grid-auto-rows:calc(84px*var(--scale))}
.grid.fill{height:100%;grid-template-rows:repeat(var(--rows,4),minmax(calc(58px*var(--scale)),1fr));grid-auto-rows:unset}
.tile{--tbg:var(--prep-bg);--bd:var(--prep-bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:2px solid var(--bd);background:var(--tbg);color:var(--ink);border-radius:var(--r-md);padding:4px 2px;min-width:0;min-height:0;
  font-family:var(--font-tile);font-weight:700;font-size:min(calc(14px*var(--scale)),3.3vw);line-height:1.1;text-align:center;position:relative;overflow:hidden;
  transition:transform .08s ease}
.tile:active{transform:scale(.97)}
.tile .sym{font-size:calc(28px*var(--scale));line-height:1}
.tile img{width:calc(38px*var(--scale));height:calc(38px*var(--scale));object-fit:cover;border-radius:var(--r-sm)}
.tile .lbl{overflow-wrap:break-word;word-break:normal;hyphens:manual;max-width:100%}
.tile.empty{visibility:hidden}
.tile[data-pos="pron"]{--tbg:var(--pron-bg);--bd:var(--pron-bd)} .tile[data-pos="verb"]{--tbg:var(--verb-bg);--bd:var(--verb-bd)}
.tile[data-pos="desc"]{--tbg:var(--desc-bg);--bd:var(--desc-bd)} .tile[data-pos="noun"]{--tbg:var(--noun-bg);--bd:var(--noun-bd)}
.tile[data-pos="social"]{--tbg:var(--social-bg);--bd:var(--social-bd)} .tile[data-pos="q"]{--tbg:var(--q-bg);--bd:var(--q-bd)}
.tile[data-pos="neg"]{--tbg:var(--neg-bg);--bd:var(--neg-bd)}
.tile.pressing::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--ink);animation:fill var(--hold,.5s) linear forwards}
.tile.right{outline:4px solid var(--verb-bd)}
.tile.hint{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--brand2)}}
.scan-on{outline:5px solid var(--brand)!important;outline-offset:2px;z-index:1}
.words-only .tile .sym,.words-only .tile img{display:none}
.words-only .tile{font-size:calc(17px*var(--scale))}
[data-contrast="on"] .tile{background:var(--card);border-width:4px;font-size:calc(16px*var(--scale))}
[data-contrast="on"] .strip,[data-contrast="on"] .tab,[data-contrast="on"] .ibtn{border-color:var(--ink);border-width:2px}

/* phrases */
.grid.phrases{grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-auto-rows:auto}
.grid.phrases .tile{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px 14px;text-align:left;min-height:calc(56px*var(--scale));font-size:calc(16px*var(--scale))}
.grid.phrases .tile .sym{font-size:calc(24px*var(--scale))}

/* keyboard */
.kbwrap{display:flex;flex-direction:column;gap:6px;height:100%}
.pred{display:flex;gap:6px;overflow-x:auto;min-height:48px}
.pred button{flex:none;border-radius:var(--r-md);border:1.5px solid var(--desc-bd);background:var(--desc-bg);padding:0 14px;font-family:var(--font-tile);font-weight:700;font-size:calc(16px*var(--scale))}
.kb{flex:1;display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:5px;grid-auto-rows:minmax(calc(46px*var(--scale)),1fr)}
.key{grid-column:span 2;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);font-family:var(--font-tile);font-weight:700;font-size:calc(18px*var(--scale));text-transform:lowercase;min-width:0}
.key.off1{grid-column:2 / span 2}.key.off2{grid-column:4 / span 2}
.key.wide{grid-column:span 4;font-size:15px;text-transform:none}.key.space{grid-column:span 8;text-transform:none;font-size:15px}

/* bigger core board, word-group folders, safety checks */
.grid.fill.dense{gap:4px;grid-template-rows:repeat(var(--rows,6),minmax(calc(46px*var(--scale)),1fr))}
.grid.dense .tile{font-size:min(calc(13px*var(--scale)),2.9vw);padding:2px 1px;border-radius:10px;gap:1px}
.grid.dense .tile .sym{font-size:min(calc(24px*var(--scale)),5.4vw)}
.tile.textonly .lbl{font-size:1.15em}
.tile.folder{background:var(--card);border:2px solid var(--line);box-shadow:inset 0 6px 0 var(--soft);min-height:calc(92px*var(--scale))}
.tile.folder .count{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted)}
.grouptitle{flex:none;align-self:center;font-family:var(--font-tile);font-weight:700;font-size:17px;padding-inline:6px}
.ibtn .dot{position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:var(--neg-bd);border:2px solid var(--card)}
.checks{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}
details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}

/* topic packs (birds and custom topics) */
.topichead{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;position:sticky;top:0;background:var(--bg);z-index:2;scrollbar-width:none}
.topichead::-webkit-scrollbar{display:none}
.chipbtn{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;min-height:38px;display:inline-flex;gap:6px;align-items:center}
.chipbtn[aria-pressed="true"]{background:var(--brand2);color:var(--on-brand);border-color:var(--brand2)}
.factline{font-family:var(--font-tile);font-size:15px;line-height:1.4;background:var(--soft);border-radius:var(--r-md);padding:8px 12px;margin-bottom:6px}
.factline b{font-weight:700}
.grid.pics{grid-auto-rows:auto}
.grid.pics .tile{padding:4px 4px 6px;gap:4px;justify-content:flex-start}
.tile .art{width:100%;aspect-ratio:1;display:block;max-width:100%;position:relative}
.art img.photo{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:cover;border-radius:10px;opacity:0;transition:opacity .4s ease}
.art img.photo.on{opacity:1}
.chip .art img.photo{border-radius:5px}
.credit{display:block;font-family:var(--font-ui);font-size:11px;color:var(--muted);margin-top:4px;-webkit-user-select:text;user-select:text}
.tile .art svg{width:100%;height:100%;display:block;border-radius:10px}
.grid.pics .tile img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:10px}
.grid.pics .tile .sym{font-size:calc(44px*var(--scale));aspect-ratio:1;display:flex;align-items:center;justify-content:center;width:100%}
.chip .art{width:calc(26px*var(--scale));height:calc(26px*var(--scale));display:inline-block;flex:none}
.chip .art svg{width:100%;height:100%;border-radius:5px}
.words-only .tile .art,.words-only .chip .art{display:none}
.erow .art{width:32px;height:32px;flex:none}.erow .art svg{width:100%;height:100%;border-radius:6px}
.sbtn:disabled{opacity:.35;cursor:default}
.sbtn.small{min-width:44px;font-size:18px}
.formlist{display:flex;flex-wrap:wrap;gap:8px}
.formlist button{border:2px solid var(--verb-bd);background:var(--verb-bg);border-radius:var(--r-md);padding:12px 16px;font-family:var(--font-tile);font-weight:700;font-size:18px;min-height:52px}
.find input{width:100%;font-size:18px}
.fres{display:flex;flex-direction:column;gap:6px}
.fres button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:6px 10px;min-height:48px}
.fres .s{width:32px;font-size:22px;text-align:center;flex:none}
.fres small{color:var(--muted);display:block}

/* sparkle look */
.spark{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:40;animation:spark .75s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.tile.pop{animation:pop .38s ease}
@keyframes pop{40%{transform:scale(1.07)}100%{transform:scale(1)}}
.tile.pop .art svg{animation:flap .5s ease}
@keyframes flap{25%{transform:rotate(-5deg) translateY(-3px)}75%{transform:rotate(5deg)}}
.flyer{position:fixed;left:0;width:64px;height:64px;pointer-events:none;z-index:40;animation:fly 1.7s ease-in-out forwards}
.flyer svg{width:100%;height:100%}
@keyframes fly{0%{transform:translate(-70px,10px)}50%{transform:translate(48vw,-24px)}100%{transform:translate(110vw,0)}}
.sparkle .tab[aria-selected="true"]{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:var(--on-brand)}

/* ---------- Bird game: a sky of its own in both themes ---------- */
.game{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;gap:6px;overflow:hidden;color:#1D2A38;font-family:var(--font-tile);
  background:linear-gradient(180deg,#7CC8F5 0%,#CDEBFF 55%,#E9F7FF 78%,#A9DB8C 78.2%,#8CCB6E 100%);
  padding-inline:16px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none}
.g-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;pointer-events:none}
.g-top{display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.g-tool{min-width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.8);font-size:20px;font-weight:700;color:#1D2A38;position:relative;overflow:hidden;flex:none}
.g-tool .ring{position:absolute;left:0;bottom:0;height:4px;width:0;background:#8A3A1A}
.g-tool.holding .ring{animation:fill 1s linear forwards}
.g-ask{flex:1;min-width:0;text-align:center;background:#fff;border-radius:18px;padding:6px 10px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.g-ask small{display:block;font-size:clamp(14px,3.6vw,20px);color:#4A5A6A;font-weight:700}
.g-ask b{display:block;font-size:clamp(24px,7vw,46px);line-height:1.1;color:#8A3A1A;text-wrap:balance}
.g-stars{display:flex;justify-content:center;gap:2px;min-height:28px;font-size:22px;flex-wrap:wrap;position:relative;z-index:2}
.g-stars .n{font-family:var(--font-ui);font-weight:700;font-size:15px;background:rgba(255,255,255,.8);border-radius:999px;padding:2px 10px;margin-left:6px;font-variant-numeric:tabular-nums}
.g-field{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-evenly;gap:10px;position:relative;z-index:1}
.g-bird{border:0;background:#fff;border-radius:24px;padding:8px;width:min(29vw,230px);box-shadow:0 8px 0 rgba(0,0,0,.12);color:#1D2A38;
  font-family:var(--font-tile);font-weight:700;font-size:clamp(13px,3.4vw,18px);display:flex;flex-direction:column;gap:4px;align-items:center;flex:none;transition:opacity .3s,box-shadow .2s}
.g-bird .art{width:100%;aspect-ratio:1;display:block;position:relative}
.g-bird .art svg{width:100%;height:100%;border-radius:16px;display:block}
.g-bird .art img.photo{border-radius:16px}
.g-bird img.pic{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}
.g-bird .gsym{font-size:min(18vw,120px);line-height:1.2}
.g-bird .gname{min-height:1.2em}
.g-bird.in{animation:gin .9s cubic-bezier(.2,.8,.3,1.1) both,bob 2.6s ease-in-out infinite}
@keyframes gin{from{transform:translateX(-110vw) rotate(-10deg)}to{transform:none}}
@keyframes bob{50%{transform:translateY(-12px)}}
.g-field.cross{display:block}
.g-field.cross .g-bird{position:absolute;left:0;animation:cross var(--dur) linear var(--delay) infinite;width:min(27vw,200px)}
@keyframes cross{from{transform:translateX(-35vw)}to{transform:translateX(105vw)}}
.g-field.done .g-bird{animation-play-state:paused}
.g-bird.right{box-shadow:0 0 0 8px #3E9B3A,0 8px 0 rgba(0,0,0,.12)}
.g-bird.fade{opacity:.25}
.g-bird.wrong .art,.g-bird.wrong .gsym,.g-bird.wrong img.pic{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.g-bird.hint{box-shadow:0 0 0 8px #F2C230,0 8px 0 rgba(0,0,0,.12)}
.g-bird.scan-on{outline:6px solid #8A3A1A;outline-offset:3px}
.g-banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:4}
.g-banner .big{font-family:var(--font-tile);font-weight:700;font-size:clamp(84px,27vw,250px);line-height:1;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.15)}
.g-banner .sub{font-family:var(--font-tile);font-weight:700;font-size:clamp(22px,6vw,44px);background:#fff;border-radius:16px;padding:4px 14px;margin-top:6px;text-align:center}

function shade(hex,amt){
  let x=hex.replace("#",""); if(x.length===3) x=[...x].map(c=>c+c).join("");
  const n=parseInt(x,16); const cl=v=>Math.max(0,Math.min(255,v));
  const r=cl((n>>16)+amt), g=cl(((n>>8)&255)+amt), b=cl((n&255)+amt);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

    if (f.shoulder) P(E(wx+wrx*0.45,wy-wry*0.2,wrx*0.32,wry*0.45,wr,f.shoulder));
    if (f.speculum) P(E(wx+wrx*0.1,wy+wry*0.1,wrx*0.3,wry*0.35,wr,f.speculum));
    if (f.sail) P(PG([[wx+2,wy-wry],[wx+8,wy-wry-9],[wx+12,wy-wry+1]],f.sail));
    if (f.wingtip) P(E(wx-wrx*0.75,wy+wry*0.15,wrx*0.35,wry*0.5,wr,f.wingtip));
    if (f.back) P(E(wx+2,wy-wry*0.5,wrx*0.6,wry*0.4,wr,f.back));
    if (f.spots){ const [cx,cy,rx,ry]=G.body; for(let i=0;i<12;i++) P(C(cx-rx*0.6+((i*41)%100)/100*rx*1.2, cy-ry*0.45+((i*67)%100)/100*ry*1.05, B.group==="farm"?1.3:1, f.spots)); }
  };

  /* ---- neck ---- */
  const neck = () => {
    const nc = f.neck && f.neck.startsWith("#") ? f.neck : c.h;
    if (tpl==="water"){
      if (G.n===0) P(E(hx-3,hy+6,7,8,0,c.h));
      if (G.n===1) P(`<path d="M${B.bs==="pouch"?52:62} 60 Q${B.bs==="pouch"?58:70} 50 ${hx-1} ${hy+4}" stroke="${tpl==="water"&&B.f.cheek?c.h:nc}" stroke-width="7" fill="none" stroke-linecap="round"/>`);
      if (G.n===2) P(`<path d="M60 60 C78 50 54 34 ${hx-1} ${hy+3}" stroke="${nc}" stroke-width="6" fill="none" stroke-linecap="round"/>`);
    }
    if (tpl==="wader") P(`<path d="M58 46 Q72 38 ${hx-2} ${hy+4}" stroke="${nc}" stroke-width="5" fill="none" stroke-linecap="round"/>`);
    if (tpl==="tall") P(`<path d="M58 40 Q68 28 ${hx-1} ${hy+3}" stroke="${nc}" stroke-width="5" fill="none" stroke-linecap="round"/>`);
    if (tpl==="ground") P(L(61,46,hx-2,hy+4,c.h,11));
    if (tpl==="perch") P(E(hx-4,hy+8,9,8,-20,c.h));
    if (tpl==="hover") P(E(hx-3,hy+4,5,4,-20,c.h));
    if (tpl==="flight") P(E(hx-4,hy+2,6,4.5,-10,c.h));
  };

  /* ---- head ---- */
  const head = () => {
    if (f.crest) { const cc = f.crest===true ? c.h : f.crest;
      P(PG([[hx-hr*0.2,hy-hr*0.8],[hx-hr*0.95,hy-hr*1.75],[hx-hr*0.15,hy-hr*1.35],[hx+hr*0.35,hy-hr*0.85]],cc)); }
    if (f.tufts){ P(PG([[hx-hr*0.75,hy-hr*0.6],[hx-hr*0.95,hy-hr*1.45],[hx-hr*0.3,hy-hr*0.85]],c.h)); P(PG([[hx+hr*0.75,hy-hr*0.6],[hx+hr*0.95,hy-hr*1.45],[hx+hr*0.3,hy-hr*0.85]],c.h)); }
    if (f.comb){ for(let i=0;i<4;i++) P(C(hx-hr*0.5+i*hr*0.38,hy-hr*0.95-(i%2)*1.5,hr*0.32,"#E0202A")); }
    if (f.plume) P(`<path d="M${hx-hr*0.6} ${hy-hr*0.4} Q${hx-hr*2.6} ${hy-hr*0.3} ${hx-hr*3.2} ${hy+hr*0.8}" stroke="${f.plume}" stroke-width="1.6" fill="none"/>`);
    if (f.casque && tpl!=="perch") P(E(hx+hr*0.1,hy-hr*1.05,hr*0.5,hr*0.75,-10,f.casque));
    P(C(hx,hy,hr,f.bald&&tpl==="upright"?c.h:c.h));
    if (f.bald && tpl==="upright") P(E(hx-hr*0.6,hy+hr*0.95,hr*0.9,hr*0.45,0,c.b));
    // features inside the head outline
    const inside=[];
    if (f.cap) inside.push(`<rect x="${hx-hr}" y="${hy-hr}" width="${hr*2}" height="${hr*0.85}" fill="${f.cap}"/>`);
    if (f.forehead) inside.push(C(hx+hr*0.55,hy-hr*0.75,hr*0.5,f.forehead));
    if (f.nape) inside.push(C(hx-hr*0.9,hy-hr*0.3,hr*0.45,f.nape));
    if (f.face) inside.push(E(hx+hr*0.35,hy,hr*0.6,hr*0.55,0,f.face));
    if (f.cheek) inside.push(E(hx-hr*0.05,hy+hr*0.45,hr*0.55,hr*0.4,0,f.cheek));
    if (f.mask) inside.push(`<rect x="${hx-hr*0.2}" y="${G.eye[1]-hr*0.28}" width="${hr*1.3}" height="${hr*0.5}" fill="${f.mask}"/>`);
    if (f.brow) inside.push(`<rect x="${hx-hr*0.6}" y="${G.eye[1]-hr*0.42}" width="${hr*1.4}" height="${hr*0.17}" fill="${f.brow}"/>`);
    if (f.facestripe) inside.push(`<rect x="${hx-hr}" y="${G.eye[1]+hr*0.15}" width="${hr*2}" height="${hr*0.18}" fill="${f.facestripe}"/>`);
    if (f.mustache) inside.push(`<rect x="${G.eye[0]-hr*0.15}" y="${G.eye[1]}" width="${hr*0.22}" height="${hr*0.9}" fill="${f.mustache}"/>`);
    if (f.earpatch) inside.push(E(hx-hr*0.35,hy+hr*0.35,hr*0.35,hr*0.6,15,f.earpatch));
    if (f.disc) inside.push(E(hx,hy+hr*0.05,hr*0.85,hr*0.72,0,f.disc));
    if (f.heart) inside.push(`<path d="M${hx} ${hy-hr*0.45} Q${hx-hr*0.95} ${hy-hr*1.05} ${hx-hr*0.85} ${hy+hr*0.1} Q${hx-hr*0.5} ${hy+hr*0.8} ${hx} ${hy+hr*0.85} Q${hx+hr*0.5} ${hy+hr*0.8} ${hx+hr*0.85} ${hy+hr*0.1} Q${hx+hr*0.95} ${hy-hr*1.05} ${hx} ${hy-hr*0.45}Z" fill="#FFFDF8"/>`);
    if (f.jaw) inside.push(E(hx+hr*0.7,hy+hr*0.35,hr*0.3,hr*0.2,0,f.jaw));
    if (inside.length) P(`<g clip-path="url(#${u}h)">${inside.join("")}</g>`);
    if (f.earpatch && tpl==="penguin") P(E(hx-hr*0.2,hy+hr*1.1,hr*0.3,hr*0.5,-20,f.earpatch));
    if (f.neckring) P(`<path d="M${hx-hr*0.9} ${hy+hr*0.55} Q${hx} ${hy+hr*1.35} ${hx+hr*0.85} ${hy+hr*0.6}" stroke="${f.neckring}" stroke-width="${Math.max(1.6,hr*0.22)}" fill="none"/>`);
    if (f.band) P(`<path d="M${G.body[0]+4} ${G.body[1]-G.body[3]*0.75} Q${G.body[0]+G.body[2]*0.75} ${G.body[1]-G.body[3]*0.2} ${G.body[0]+G.body[2]*0.8} ${G.body[1]-G.body[3]*0.65}" stroke="${f.band}" stroke-width="2.4" fill="none"/>`);
    if (f.throat && tpl!=="hover") P(E(hx+hr*0.35,hy+hr*0.78,hr*0.5,hr*0.42,0,f.throat));
    if (f.throat && tpl==="hover") P(E(hx+1.5,hy+4.5,3.6,2.8,-20,f.throat));
    if (f.bib) P(E(hx+hr*0.15,hy+hr*1.05,hr*0.65,hr*0.5,0,f.bib));
    if (f.beard) for(let i=0;i<3;i++) P(PG([[hx+hr*0.1+i*2.5,hy+hr*0.75],[hx+hr*0.25+i*2.5,hy+hr*1.25],[hx+hr*0.45+i*2.5,hy+hr*0.7]],c.h));
    if (f.balloon) P(E(hx+hr*0.25,hy+hr*1.55,hr*0.85,hr*0.95,0,f.balloon));
  };

  /* ---- beak ---- */
  const beak = () => {
    const [bx,by]=G.beak, bl=B.bl, s=hs;
    let d;
    switch(B.bs){
      case "cone": { const Ln=9*bl*s; d=`M${bx-1} ${by-4*s} L${bx+Ln} ${by} L${bx-1} ${by+4*s}Z`; break; }
      case "chisel": { const Ln=13*bl*s; d=`M${bx-1} ${by-2.6*s} L${bx+Ln} ${by-0.4*s} L${bx+Ln} ${by+0.6*s} L${bx-1} ${by+2.6*s}Z`; break; }
      case "hook": { const Ln=8*bl*s;
        if (tpl==="owl") { d=`M${bx-2.2} ${by-1} L${bx+2.2} ${by-1} L${bx} ${by+4.5*bl}Z`; break; }
        d=`M${bx-1} ${by-4.2*s} Q${bx+Ln*0.95} ${by-5*s} ${bx+Ln} ${by+2.5*s} Q${bx+Ln*0.75} ${by+1*s} ${bx+Ln*0.55} ${by+3.8*s} L${bx-1} ${by+4*s}Z`; break; }
      case "flat": { const Ln=11*bl*s; d=`M${bx-2} ${by-3*s} L${bx+Ln-2.5*s} ${by-2.6*s} Q${bx+Ln} ${by-2.6*s} ${bx+Ln} ${by} Q${bx+Ln} ${by+2.4*s} ${bx+Ln-2.5*s} ${by+2.4*s} L${bx-2} ${by+2.4*s}Z`; break; }
      case "long": { const Ln=(tpl==="kiwi"?16:24)*bl, dy=tpl==="kiwi"?14:0; d=`M${bx-1} ${by-1.6} L${bx+Ln} ${by+dy} L${bx-1} ${by+1.8}Z`; break; }
      case "curve": { const Ln=22*bl; d=`M${bx-1} ${by-1.8} Q${bx+Ln*0.65} ${by-2.5} ${bx+Ln} ${by+9*bl} Q${bx+Ln*0.55} ${by+1.5} ${bx-1} ${by+1.8}Z`; break; }
      case "spoon": { const Ln=20*bl; d=`M${bx-1} ${by-1.6} L${bx+Ln-3} ${by-0.8} Q${bx+Ln+4} ${by-3.5} ${bx+Ln+4} ${by+1.2} Q${bx+Ln+3} ${by+4.5} ${bx+Ln-3} ${by+1.2} L${bx-1} ${by+1.8}Z`; break; }
      case "bent": d=`M${bx-1} ${by-2.6} L${bx+8} ${by-2.2} Q${bx+13.5} ${by+0.5} ${bx+12.5} ${by+9} L${bx+9.5} ${by+8.2} Q${bx+9.5} ${by+2.4} ${bx-1} ${by+2.6}Z`; break;
      case "shoe": d=`M${bx-2} ${by-5} Q${bx+15} ${by-6.5} ${bx+15} ${by+0.5} Q${bx+12} ${by+7} ${bx-2} ${by+5}Z`; break;
      case "huge": { const Ln=26*bl*s; d=`M${bx-1.5} ${by-6.5*s} Q${bx+Ln*0.7} ${by-10*s} ${bx+Ln} ${by-1} Q${bx+Ln*0.75} ${by+5*s} ${bx-1.5} ${by+6.5*s}Z`; break; }
      case "puffin": d=`M${bx-1.5} ${by-6} L${bx+10} ${by+1} L${bx-1.5} ${by+7}Z`; break;
      case "pouch": { const Ln=22*bl; P(`<path d="M${bx} ${by+1.5} Q${bx+Ln*0.45} ${by+12} ${bx+Ln} ${by+2}Z" fill="${shade(c.k,-10)}"/>`);
        d=`M${bx-1} ${by-2} L${bx+Ln} ${by} L${bx+Ln} ${by+2} L${bx-1} ${by+2}Z`; break; }
      default: { const Ln=12*bl*s; d=`M${bx-1} ${by-2.2*s} L${bx+Ln} ${by+0.6*s} L${bx-1} ${by+2.4*s}Z`; }
    }
    P(`<clipPath id="${u}k"><path d="${d}"/></clipPath><path d="${d}" fill="${c.k}"/>`);
    const over=[];
    if (f.billtip) over.push(`<rect x="${bx+18*hs}" y="0" width="30" height="100" fill="${f.billtip}"/>`);
    if (f.rainbowbill){ ["#F28A1A","#E0202A","#2E7AD0"].forEach((col,i)=>over.push(`<rect x="${bx+6*hs+i*6*hs}" y="0" width="${5*hs}" height="100" fill="${col}"/>`)); }
    if (B.bs==="puffin"){ over.push(`<rect x="${bx-2}" y="0" width="3.2" height="100" fill="#3A5A8A"/>`); over.push(`<rect x="${bx+3}" y="0" width="1.6" height="100" fill="#F2D21B"/>`); }
    if (f.billspot) over.push(C(bx+(B.bs==="cone"?7*hs:4),by+1.6*hs,1.8,f.billspot));
    if (B.bs==="bent") over.push(`<rect x="${bx+8}" y="${by+3}" width="10" height="10" fill="#111"/>`);
    if (over.length) P(`<g clip-path="url(#${u}k)">${over.join("")}</g>`);
    if (f.knob) P(E(bx+1,by-3.2*hs,2.2*hs,2*hs,0,f.knob));
    if (f.shield) P(E(bx-0.5,by-3.5*hs,2*hs,3.6*hs,0,f.shield));
    if (f.casque && tpl==="perch") P(`<path d="M${bx-1} ${by-6*hs} Q${bx+8*hs} ${by-13*hs} ${bx+16*hs} ${by-8*hs} Q${bx+8*hs} ${by-6*hs} ${bx-1} ${by-6*hs}Z" fill="${f.casque}"/>`);
    if (f.wattle) P(`<path d="M${bx-1} ${by+3*hs} Q${bx+2} ${by+10*hs} ${bx-3} ${by+11*hs} Q${bx-6} ${by+7*hs} ${bx-1} ${by+3*hs}Z" fill="${f.wattle===true?"#E0202A":f.wattle}"/>`);
  };

  /* ---- eye ---- */
  const eye = () => {
    const er = Math.max(1.4, hr*0.17);
    if (tpl==="owl"){
      const ec = f.eye || "#F2C230";
      [[hx-hr*0.38,hy-hr*0.05],[hx+hr*0.38,hy-hr*0.05]].forEach(([x,y])=>{ P(C(x,y,hr*0.27,ec)); P(C(x,y,hr*0.15,"#111")); P(C(x-hr*0.06,y-hr*0.07,hr*0.05,"#fff")); });
      return;
    }
    const [ex,ey]=G.eye;
    if (f.eyering) P(C(ex,ey,er*1.7,f.eyering));
    if (f.eye){ P(C(ex,ey,er*1.25,f.eye)); }
    P(C(ex,ey,er,"#111")); P(C(ex+er*0.35,ey-er*0.35,er*0.38,"#fff"));
  };

  /* ---- assemble by scene ---- */
  if (tpl==="flight"){ farWing(); tail(); body(); nearWing(); neck(); head(); beak(); eye(); }
  else if (tpl==="hover"){
    P(E(42,38,4.5,13,-25,"#DDEEFF","opacity=\".75\"")); tail(); body(); neck(); head(); beak(); eye();
    P(E(46,34,4.5,14,-5,"#EEF6FF","opacity=\".8\""));
  }
  else if (tpl==="water"){ tail(); body(); wing(); neck(); head(); beak(); eye();
    P(`<path d="M0 68 Q12 65 25 68 T50 68 T75 68 T100 68 V100 H0Z" fill="#4FA8DA"/>`); P(`<path d="M8 78 Q16 75 24 78 M56 84 Q64 81 72 84" stroke="#BFE6FF" stroke-width="1.6" fill="none"/>`); }
  else if (tpl==="penguin"){ body(); wing(); head(); beak(); eye();
    P(E(44,87,5,2,0,c.g)); P(E(57,87,5,2,0,c.g)); }
  else { tail(); legs(); body(); wing(); neck(); head(); beak(); eye(); }

  if (tpl==="flight"){ const parts=o.splice(birdStart); o.push(`<g transform="translate(8 16) scale(0.84)">${parts.join("")}</g>`); }
  if (opt.nobg) o.splice(1, birdStart-1);
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${B.name}">${o.join("")}</svg>`;
}

                   8, 9,35,12,13,40,44,11,

  document.body.classList.toggle("words-only", S.wordsOnly);
  renderWho();

  if (!tabsFor().includes(tab)) tab = tabsFor()[0] || "home";
  if (sub && !groupKeys().includes(sub)) sub = null;
  renderTabs(); renderStrip(); renderBoard(); renderBanner();
  $("switchBar").hidden = S.scan==="off";
  restartScan();
}

function renderStrip(){
  const box = $("msg"); box.replaceChildren();
  if (!msg.length && !typing){ box.append(el("span","ph", m()==="k" ? "Tap words to talk" : "Tap words or type to build a message")); return; }
  for (const w of msg){
    const c = el("span","chip");
    if (w.img){ const i=el("img"); i.src=w.img; i.alt=""; c.append(i); }
    else if (w.art){ const a=el("span","art"); a.innerHTML=artSVG(w.art); c.append(a); attachPhoto(w.art, a); }
    else if (w.sym && !S.wordsOnly) c.append(el("span",null,w.sym));
    c.append(el("span",null,w.label)); box.append(c);
  }
  if (typing) box.append(el("span","chip typing",typing));
  box.scrollLeft = box.scrollWidth;
  $("formBtn").disabled = !(msg.length && !typing && formsOf(msg[msg.length-1]).length>1);

function renderTabs(){
  const box = $("tabs"); box.replaceChildren();
  for (const t of tabsFor()){
    const meta = tabMeta(t);
    const b = el("button","tab"); b.setAttribute("role","tab"); b.setAttribute("aria-selected", t===tab);
    b.dataset.tab = t;
    if (!S.wordsOnly) b.append(el("span",null,meta.sym));
    b.append(el("span",null,meta.name));
    b.onclick = () => {
      if (t==="groups" && tab==="groups" && sub){ sub=null; renderBoard(); restartScan(); return; }
      if (tab!==t){ tab=t; if (t==="groups") sub=null; renderTabs(); renderBoard(); restartScan(); }

function tileFor(it){
  const b = el("button","tile"); b.dataset.act="tile"; b.dataset.id=it.id; b.dataset.pos=it.pos||"noun";
  if (it.img && it.img!=="__idb__"){ const i=el("img"); i.src=it.img; i.alt=""; b.append(i); }
  else if (hasPic(it)){ const a=el("span","art"); a.innerHTML=artSVG(it); b.append(a); watchPhoto(it, a); }
  else if (it.sym) b.append(el("span","sym",it.sym));
  else b.classList.add("textonly");
  b.append(el("span","lbl",it.label));
  if (it.alt && S.nickShow==="both") b.append(el("small","alt",it.alt));
  b.setAttribute("aria-label", it.say && it.say!==it.label ? `${it.label}, says ${it.say}` : it.label);
  return b;
}

function renderBoard(){
  const board = $("board"); board.replaceChildren(); board.classList.remove("split"); board.scrollTop = 0; itemsById = new Map();
  if (tab==="keyboard") return renderKeyboard(board);
  if (tab==="home") return renderHome(board);

    for (const id of coreLayout()){
      const it = CORE_BY_ID.get(id), t = tileFor(it); itemsById.set(it.id,it);
      // hidden or not-yet-introduced words keep their place so muscle memory never breaks
      if (!coreShown(it,h)){ t.classList.add("empty"); t.tabIndex=-1; t.setAttribute("aria-hidden","true"); delete t.dataset.act; }

        const b = el("button","chipbtn"); b.dataset.scan="1"; b.setAttribute("aria-pressed", grpOf(tab)===g);

      }
    }
    if (pack && pack.facts && !off("facts")){
      const fb = el("button","chipbtn"); fb.dataset.scan="1"; fb.setAttribute("aria-pressed", state.facts);
      fb.append(el("span",null,"💡"), el("span",null, state.facts ? "Fun facts: on" : "Fun facts: off"));
      fb.onclick = () => { state.facts=!state.facts; save(); renderBoard(); restartScan(); }; head.prepend(fb);
    }
    if (!off("games") && visibleItems(tab).length >= 3){
      const gb = el("button","chipbtn"); gb.dataset.scan="1"; gb.style.fontWeight="700";
      gb.append(el("span",null,"🎮"), el("span",null, pack ? pack.game : "Play a game"));
      gb.onclick = () => openGame(tab); head.prepend(gb);
    }
    if (!off("bigview")){
      const bv = el("button","chipbtn"); bv.dataset.scan="1"; bv.setAttribute("aria-pressed", S.tapView==="big");
      bv.append(el("span",null,"🔍"), el("span",null, S.tapView==="big" ? "Big picture: on" : "Big picture: off"));
      bv.onclick = () => { S.tapView = S.tapView==="big" ? "say" : "big"; save(); renderBoard(); restartScan(); toast(S.tapView==="big" ? "Tap a picture to say it and see it big." : "Tap a picture to just say it."); };
      head.append(bv);
    }
    if (head.children.length) board.append(head);
    if (pack && pack.facts){ const fl = el("div","factline"); fl.id="factLine"; fl.setAttribute("aria-live","polite");
      const nn = pack.noun==="one" ? "picture" : pack.noun; fl.textContent = state.facts ? `Tap a ${nn} to hear its name and a fun fact.` : `Tap a ${nn} to say its name. Turn on fun facts to learn more.`; board.append(fl);
      if (photoBlocked && photosOn()) markBlocked(); }
    grid.classList.add("pics");
    const wide = window.innerWidth>700;
    grid.style.setProperty("--cols", m()==="k" ? (wide?5:3) : (wide?6:4));
    let list = visibleItems(tab);
    if (pack && pack.groups && grpOf(tab)!=="all") list = list.filter(it=>it.group===grpOf(tab) || !it.builtin);
    for (const it of list){ itemsById.set(it.id,it); grid.append(tileFor(it)); }
    if (!list.length) board.append(el("p","note", pack ? "Every word here is hidden. Turn some back on in Settings, Edit words." : "This topic is empty. Add words and photos in Settings, Edit words."));
  } else if (tab==="phrases"){
    grid.classList.add("phrases"); grid.style.setProperty("--cols", window.innerWidth>700 ? 2 : 1);
    for (const it of visibleItems(tab)){ itemsById.set(it.id,it); grid.append(tileFor(it)); }
  } else if (tab==="groups" && !sub){
    grid.style.setProperty("--cols", window.innerWidth>700 ? 6 : 3);
    for (const k of groupKeys()){
      const c = CATS[k], b = el("button","tile folder"); b.dataset.act="folder"; b.dataset.k=k;
      if (!S.wordsOnly) b.append(el("span","sym",c.sym));
      b.append(el("span","lbl",c.name), el("span","count",`${visibleItems(k).length} words`));
      b.setAttribute("aria-label", `${c.name} group`); grid.append(b);
    }
  } else {
    const key = tab==="groups" ? sub : tab;

      board.classList.add("split");
      const head = el("div","topichead");
      const back = el("button","chipbtn"); back.dataset.scan="1"; back.append(el("span",null,"◀"), el("span",null,"All groups"));
      back.onclick = () => { sub=null; renderBoard(); restartScan(); board.scrollTop=0; };
      const title = el("span","grouptitle", (S.wordsOnly?"":tabMeta(key).sym+" ")+tabMeta(key).name);
      head.append(back, title);
      if (!off("games") && visibleItems(key).filter(pictured).length >= 3){
        const gb = el("button","chipbtn"); gb.dataset.scan="1"; gb.style.fontWeight="700";
        gb.append(el("span",null,"🎮"), el("span",null,"Play a game")); gb.onclick = () => openGame(key); head.append(gb);
      }
      board.append(head);
    }
    const cols = m()==="k" ? (window.innerWidth>700?6:4) : (window.innerWidth>700?8:5);
    grid.style.setProperty("--cols",cols);
    for (const it of visibleItems(key)){ itemsById.set(it.id,it); grid.append(tileFor(it)); }
    if (!grid.children.length) board.append(el("p","note","Every word here is hidden. Turn some back on in Settings, Edit words."));
  }
  if (board.classList.contains("split")){ const sc = el("div","scroller"); sc.append(grid); board.append(sc); } else board.append(grid);

function showBig(it){

  if (src || own){ const im = el("img"); im.src = src || own; im.alt = it.label; im.onerror = () => { im.remove(); if (it.art) fig.innerHTML = birdSVG(it.art); }; fig.append(im); }
  else if (it.art) fig.innerHTML = birdSVG(it.art);
  else fig.append(el("span","bp-sym", it.sym || "⭐"));
  v.append(fig, el("div","bp-name", it.label));

  const again = el("button","btn","🔊 Say it again"), close = el("button","btn primary","Close");
  const row = el("div","bp-acts"); row.append(again, close); v.append(row);
  if (src){ const cr = el("small","credit","Photo: Wikimedia Commons"); v.append(cr); photoCredit(it).then(t=>{ if (t) cr.textContent = t; }); }

  document.addEventListener("keydown", onKey);

}
function predictions(){
  const p = typing.toLowerCase();
  const L = state.learned;
  const pool = [...new Set([...Object.keys(L), ...WORDS])];
  const rank = w => (L[w]||0)*1000 - (WORDS.indexOf(w)===-1 ? 999 : WORDS.indexOf(w));
  if (!p) return pool.sort((a,b)=>rank(b)-rank(a)).slice(0,6);
  return pool.filter(w=>w.toLowerCase().startsWith(p) && w.toLowerCase()!==p).sort((a,b)=>rank(b)-rank(a)).slice(0,6);
}
function renderKeyboard(board){
  const wrap = el("div","kbwrap"), pred = el("div","pred"), kb = el("div","kb");
  pred.setAttribute("aria-label","Word suggestions");

function renderBanner(){

/* ---------------- Choosing ---------------- */
let lastAct = 0;
function bump(word){ const w=word.toLowerCase(); if(!w || w.includes(" ")) return; state.learned[w]=(state.learned[w]||0)+1; save(); }
function activate(node){
  const now = performance.now();
  if (now - lastAct < S.debounceMs) return;   // ignore accidental double taps
  lastAct = now;
  const act = node.dataset.act;
  if (act==="folder"){ sub = node.dataset.k; renderBoard(); $("board").scrollTop = 0; restartScan(); return; }
  if (act==="tile"){
    const it = itemsById.get(node.dataset.id); if(!it) return;
    if (learn.on) return learnCheck(it,node);
    commitTyping();
    msg.push({id:it.id, label:it.label, say:it.say, sym:it.sym, img:it.img, art:hasPic(it)?it:null, pos:it.pos});
    const fl = $("factLine");
    if (it.fact && fl){ fl.dataset.touched="1"; fl.replaceChildren(el("b",null,it.label+". "), document.createTextNode(it.fact));
      if (photoSrcOf(it) && photosOn()){ const cr=el("small","credit","Photo: Wikimedia Commons"); fl.append(cr); photoCredit(it).then(t=>{ if(t) cr.textContent=t; }); } }
    if (isTopic(tab) && S.tapView==="big" && !off("bigview") && (hasPic(it) || (it.img && it.img!=="__idb__"))) showBig(it);
    if (it.fact && state.facts) say(`${it.label}. ${it.fact}`);
    else if (S.speakOnTap) say(it.say||it.label);
    track("taps"); bump(it.label); renderStrip(); pop(node);
  } else if (act==="key"){
    const k = node.dataset.k;
    if (k==="back"){ if (typing) typing=typing.slice(0,-1); else msg.pop(); }
    else if (k==="space"){ commitTyping(true); }
    else if (".?".includes(k)){ typing += k; commitTyping(); }
    else typing += k;
    renderStrip(); refreshPred();
  } else if (act==="pred"){
    const w = node.dataset.w; typing=""; msg.push({label:w, pos:guessPos(w)}); track("taps"); bump(w);
    if (S.speakOnTap) say(w);
    renderStrip(); refreshPred();
  }
}
function commitTyping(speakIt){
  const t = typing.trim(); if(!t) { typing=""; return; }
  msg.push({label:t, pos:guessPos(t)}); bump(t.replace(/[.?!]$/,"")); typing="";
  if (speakIt && S.speakOnTap) say(t);
}
function guessPos(w){ const k=w.toLowerCase(); const hit=CORE.find(c=>c.label.toLowerCase()===k); return hit ? hit.pos : ""; }

/* ---------------- Sparkle look ---------------- */
const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const lively = () => S.look==="sparkle" && !reduced;
function pop(node){ if(!lively()||!node) return; node.classList.remove("pop"); void node.offsetWidth; node.classList.add("pop"); burst(node,7); }
function burst(node,n=8){
  if (!lively() || !node) return;
  const r=node.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
  const cols=["#F2C230","#E5262A","#3B6FD0","#4EB84A","#C45D34","#9A4AC9","#3FB7E8"];
  for(let i=0;i<n;i++){ const s=el("span","spark"); const a=Math.random()*Math.PI*2, d=30+Math.random()*50;
    s.style.left=x+"px"; s.style.top=y+"px"; s.style.background=cols[i%cols.length];
    s.style.setProperty("--dx",Math.cos(a)*d+"px"); s.style.setProperty("--dy",Math.sin(a)*d+"px");
    document.body.append(s); setTimeout(()=>s.remove(),800); }
}
const FLYERS = BIRDS.filter(b=>b.tpl==="flight");
function flyBird(){
  if (!lively()) return;
  const b = FLYERS[Math.floor(Math.random()*FLYERS.length)];
  const f = el("div","flyer"); f.innerHTML = birdSVG(b,{nobg:true});
  const r = $("msg").getBoundingClientRect(); f.style.top = Math.max(0,r.top-20)+"px";
  document.body.append(f); setTimeout(()=>f.remove(),1800);
}

function refreshPred(){ if(tab!=="keyboard") return; const p=document.querySelector(".pred"); if(!p) return;
  p.replaceChildren(...predictions().map(w=>{const b=el("button",null,w); b.dataset.act="pred"; b.dataset.w=w; return b;})); restartScan(); }

// press handling: optional hold-to-select for people who tap by accident
let press = null;
const board = $("board");
board.addEventListener("pointerdown", e=>{
  const t = e.target.closest("[data-act]"); if(!t) return;
  press = {el:t, t:performance.now()};
  if (S.holdMs>0){ t.style.setProperty("--hold", S.holdMs+"ms"); t.classList.add("pressing"); }
});
const endPress = (e, cancel) => {
  if (!press) return; const p = press; press = null; p.el.classList.remove("pressing");
  if (cancel) return;
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-act]");
  if (over===p.el && performance.now()-p.t >= S.holdMs) activate(p.el);
};
document.addEventListener("pointerup", e=>endPress(e,false));
document.addEventListener("pointercancel", e=>endPress(e,true));
board.addEventListener("click", e=>{ const t=e.target.closest("[data-act]"); if(t && e.detail===0) activate(t); }); // keyboard and screen readers
board.addEventListener("contextmenu", e=>e.preventDefault());

$("clrBtn").onclick = () => { msg=[]; typing=""; renderStrip(); refreshPred(); };

    if (!hits.length){ res.append(el("p","note","No word like that yet. Caregivers can add it in Settings, Edit words.")); return; }
    for (const {it,t} of hits){

      b.append(s, txt);

        if (tile){ tile.scrollIntoView({block:"center",inline:"nearest"}); tile.classList.remove("hint"); void tile.offsetWidth; tile.classList.add("hint"); }

};

/* ---------------- Find-it game ----------------
   "Which one is the Blue Jay?" Three birds fly in. Right answer: a big YES flies across, cheers and confetti,
   then the next bird. Wrong answer: a gentle NO, the app says which bird they picked, and asks again.
   After two misses the right bird glows, so every round ends in success. */
let AC = null;
function audio(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==="suspended") AC.resume(); }catch{ AC=null; } return AC; }
function tone(f, t0, dur, type="sine", vol=.14, f2){
  const a = audio(); if(!a) return; const t=a.currentTime+t0, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if (f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(t0, dur, vol, freq, q=0.8){
  const a = audio(); if(!a) return; const t=a.currentTime+t0, n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(0.6+0.4*Math.sin(i/a.sampleRate*2*Math.PI*7));
  const src=a.createBufferSource(); src.buffer=buf; const bp=a.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=freq; bp.Q.value=q;
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*0.3); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp).connect(g).connect(a.destination); src.start(t); src.stop(t+dur);
}
const SND = {
  chirp(){ tone(2300,0,.09,"sine",.07,3500); tone(2700,.13,.09,"sine",.07,3900); tone(2500,.26,.13,"sine",.07,3300); },
  jingle(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.2,"triangle",.11)); },
  yay(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.08,.35,"triangle",.13)); noise(.05,1.6,.22,1400,.6); noise(.15,1.3,.12,2600,1.2);
         for(let i=0;i<8;i++) noise(.2+i*.13+Math.random()*.05,.06,.18,1800,2); },
  uhoh(){ tone(392,0,.22,"sine",.11); tone(311,.25,.34,"sine",.11); }
};

function confetti(n){
  if (S.look!=="sparkle" || reduced) return;
  const cols=["#F2C230","#E5262A","#3B6FD0","#4EB84A","#C45D34","#9A4AC9","#3FB7E8","#F28AB0"];
  for(let i=0;i<n;i++){ const c=el("span","conf"); c.style.left=(Math.random()*100)+"vw"; c.style.background=cols[i%cols.length];
    c.style.setProperty("--t",(1.6+Math.random()*1.4)+"s"); c.style.setProperty("--x",(Math.random()*120-60)+"px"); c.style.setProperty("--r",(Math.random()*900-450)+"deg");
    c.style.animationDelay=(Math.random()*0.5)+"s"; if(i%3===0) c.style.borderRadius="50%";
    document.body.append(c); setTimeout(()=>c.remove(),3800); }
}

function openGame(t){
  let pool = visibleItems(t).filter(pictured);
  if (PACKS[t] && grpOf(t)!=="all"){ const g = pool.filter(it=>it.group===grpOf(t) || !it.builtin); if (g.length>=3) pool = g; }
  if (pool.length < 3){ toast("This group needs at least 3 words with pictures to play."); return; }
  stopScan(); if (synth) synth.cancel();
  const G = state.game ||= {motion:"fly", sound:true, names:false, best:0};
  if (reduced && G.motion==="cross") G.motion="still";
  const what = (PACKS[t] && PACKS[t].noun) || "one";
  const g = el("div","game"); g.setAttribute("role","dialog"); g.setAttribute("aria-label","Find it game");
  g.innerHTML = `
    <span class="g-cloud" style="top:16%;left:6%;width:90px;height:28px"></span><span class="g-cloud" style="top:28%;right:8%;width:120px;height:34px"></span>
    <div class="g-top">
      <button class="g-tool" id="gX" aria-label="${S.lock?"Hold to leave the game":"Leave the game"}">✕<span class="ring"></span></button>
      <div class="g-ask"><small>Which ${what} is</small><b id="gName"></b></div>
      <button class="g-tool" id="gHear" aria-label="Hear it again">🔊</button>
    </div>
    <div class="g-stars" id="gStars" aria-label="Score"></div>
    <div class="g-field" id="gField"></div>
    ${S.scan!=="off"?`<button class="g-switch" id="gSwitch">Tap here (or press Space) to choose</button>`:""}
    <div class="g-banner" id="gBanner" aria-live="assertive"></div>
    <div class="g-start" id="gStart">
      <h2>${PACKS[t] ? esc(PACKS[t].game) : esc(tabMeta(t).name)+" game"}</h2>
      <p>Listen to the name, then tap the right ${what}.</p>
      <div class="g-opts" role="group" aria-label="How birds move">
        <button data-mo="fly">🐦 Fly in</button><button data-mo="cross">💨 Keep flying</button><button data-mo="still">✋ Stay still</button></div>
      <div class="g-opts"><button id="gNames">Show names</button><button id="gSnd">Sounds</button></div>
      <button class="go" id="gGo">▶ Play</button>
    </div>`;
  document.body.append(g);
  const $g = id => g.querySelector("#"+id);
  const field=$g("gField"), banner=$g("gBanner"), stars=$g("gStars");
  const syncOpts = () => {
    g.querySelectorAll("[data-mo]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mo===G.motion));
    $g("gNames").setAttribute("aria-pressed", G.names); $g("gSnd").setAttribute("aria-pressed", G.sound);
  };
  g.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{ G.motion=b.dataset.mo; save(); syncOpts(); });
  $g("gNames").onclick=()=>{ G.names=!G.names; save(); syncOpts(); };
  $g("gSnd").onclick=()=>{ G.sound=!G.sound; save(); syncOpts(); };
  syncOpts();

  let score=0, round=null, busy=false, bag=[], timer=null, scanT=null, scanI=-1;
  const play = name => { if (G.sound && SND[name]) SND[name](); };
  const drawStars = () => { stars.replaceChildren(); const shown=Math.min(score,10);
    for(let i=0;i<shown;i++) stars.append(el("span",null,"⭐"));
    if (score) stars.append(el("span","n",`${score} found${G.best?` · best ${G.best}`:""}`)); };
  const nextTarget = () => { if(!bag.length) bag = pool.map((_,i)=>i).sort(()=>Math.random()-.5); return pool[bag.pop()]; };
  const looksDifferent = (a,b) => !a.art || !b.art || a.art.c.b!==b.art.c.b || a.art.tpl!==b.art.tpl;
  function picture(it){
    const wrap = el("span","art");
    if (it.img){ const i=el("img","pic"); i.src=it.img; i.alt=""; return i; }
    if (hasPic(it)){ wrap.innerHTML = artSVG(it); attachPhoto(it, wrap); if (photoDB[it.id] && !photoDB[it.id].src) {} watchPhoto(it, wrap); return wrap; }
    return el("span","gsym",it.sym||"⭐");
  }
  function ask(){ say(`Which ${what} is ${theName(t, round.target)}?`); }
  function newRound(){
    busy=false; clearTimeout(timer);
    const target = nextTarget();
    const others = pool.filter(it=>it.id!==target.id).sort(()=>Math.random()-.5);
    const picks = [...others.filter(o=>looksDifferent(o,target)), ...others].filter((v,i,a)=>a.indexOf(v)===i).slice(0,2);
    const choices = [target, ...picks].sort(()=>Math.random()-.5);
    round = {target, choices, misses:0};
    $g("gName").textContent = theName(t, target);
    field.className = "g-field" + (G.motion==="cross" ? " cross" : "");
    field.replaceChildren();
    choices.forEach((it,i)=>{
      const b = el("button","g-bird"); b.dataset.id = it.id; b.setAttribute("aria-label", it.label);
      b.append(picture(it)); b.append(el("span","gname", G.names ? it.label : ""));
      if (G.motion==="fly"){ b.classList.add("in"); b.style.animationDelay = `${i*0.25}s, ${0.9+i*0.25}s`; }
      if (G.motion==="cross"){ b.style.top = (6+i*31)+"%"; b.style.setProperty("--dur",(9+i*1.7)+"s"); b.style.setProperty("--delay",(-i*3.1)+"s"); }
      b.addEventListener("pointerdown", e=>{ e.preventDefault(); choose(it,b); });
      b.addEventListener("click", e=>{ if (e.detail===0) choose(it,b); });
      field.append(b);
    });
    play("chirp"); setTimeout(ask, 350); restartGameScan();
  }
  function showBanner(kind, sub){
    banner.replaceChildren();
    const big = el("div","big "+kind, kind==="yes" ? "YES!" : "NO");
    const still = reduced || S.look!=="sparkle";
    big.classList.add(still ? "still" : kind==="yes" ? "flyyes" : "popno");
    banner.append(big); if (sub) banner.append(Object.assign(el("div","sub",sub),{className:"sub "+(still?"still":kind==="yes"?"flyyes":"popno")}));
  }
  function choose(it, node){
    if (busy || !round) return;
    if (it.id===round.target.id){
      busy=true; stopGameScan(); score++; if (score>G.best){ G.best=score; } state.practice.right++; state.practice.tries++; save();
      field.classList.add("done");
      field.querySelectorAll(".g-bird").forEach(b=>{ b.classList.remove("hint"); b.classList.add(b===node?"right":"fade"); });
      node.querySelector(".gname").textContent = it.label;
      showBanner("yes", `That's ${theName(t, it)}!`);
      play("yay"); confetti(score%5===0 ? 140 : 70);
      say(score%5===0 ? `Yes! That's ${theName(t, it)}! Wow, ${score} in a row!` : `Yes! That's ${theName(t, it)}!`);
      drawStars();
      timer = setTimeout(newRound, score%5===0 ? 3400 : 2700);
    } else {
      round.misses++; state.practice.tries++; save();
      node.classList.remove("wrong"); void node.offsetWidth; node.classList.add("wrong");
      showBanner("no", "Try again!"); play("uhoh");
      say(`No, that's ${theName(t, it)}. Which ${what} is ${theName(t, round.target)}?`);
      if (round.misses>=2){ const right = field.querySelector(`[data-id="${CSS.escape(round.target.id)}"]`); right && right.classList.add("hint"); }
    }
  }
  // switch and listening access inside the game
  function stopGameScan(){ clearInterval(scanT); scanT=null; g.querySelectorAll(".scan-on").forEach(n=>n.classList.remove("scan-on")); }
  function restartGameScan(){ stopGameScan(); if (S.scan==="off") return; scanI=-1;
    scanT=setInterval(()=>{ const bs=[...field.querySelectorAll(".g-bird")]; if(!bs.length) return; g.querySelectorAll(".scan-on").forEach(n=>n.classList.remove("scan-on"));
      scanI=(scanI+1)%bs.length; bs[scanI].classList.add("scan-on"); if (S.scan==="listen") say(bs[scanI].getAttribute("aria-label"), true); }, S.scanMs); }
  function scanPick(){ const bs=[...field.querySelectorAll(".g-bird")]; const b=bs[scanI]; if(!b) return; const it=round.choices.find(c=>c.id===b.dataset.id); choose(it,b); }
  const onKey = e => { if (!g.isConnected) return; if (S.scan!=="off" && (e.key===" "||e.key==="Enter") && !$g("gStart")){ e.preventDefault(); scanPick(); } };
  document.addEventListener("keydown", onKey);
  if ($g("gSwitch")) $g("gSwitch").addEventListener("pointerdown", e=>{ e.preventDefault(); scanPick(); });

  $g("gHear").onclick = () => { if (round){ play("chirp"); ask(); } };
  $g("gGo").onclick = () => { audio(); play("jingle"); $g("gStart").remove(); drawStars(); setTimeout(newRound, 450); };
  // leaving: a hold when the caregiver lock is on, so a child doesn't exit by accident
  const close = () => { clearTimeout(timer); stopGameScan(); document.removeEventListener("keydown", onKey); if (synth) synth.cancel(); g.remove(); renderBoard(); restartScan(); };
  const x = $g("gX"); let xt=null;
  x.addEventListener("pointerdown", ()=>{ if(!S.lock) return; x.classList.add("holding"); xt=setTimeout(()=>{ xt="done"; close(); },1000); });
  x.addEventListener("pointerup", ()=>{ if(!S.lock) return; if(xt && xt!=="done"){ clearTimeout(xt); x.classList.remove("holding"); toast("Hold ✕ to leave the game."); } });
  x.addEventListener("pointerleave", ()=>{ if(xt && xt!=="done"){ clearTimeout(xt); x.classList.remove("holding"); } });
  x.addEventListener("click", e=>{ if (!S.lock || e.detail===0) close(); });
}

function startLearn(){ learn.on=true; learn.tab = (isTopic(tab) || (tab==="groups" && sub)) ? tab : "core"; tab = learn.tab; apply(); nextTarget(); }
function stopLearn(){ learn.on=false; learn.target=null; document.querySelectorAll(".tile.hint,.tile.right").forEach(t=>t.classList.remove("hint","right")); renderBanner(); restartScan(); }
function nextTarget(){
  document.querySelectorAll(".tile.hint,.tile.right").forEach(t=>t.classList.remove("hint","right"));
  const h = hiddenSet();
  let pool;
  if (learn.tab && learn.tab!=="core"){ pool = [...itemsById.values()].filter(it=>it!==learn.target); }
  else pool = CORE.filter(it=>coreShown(it,h) && it!==learn.target);
  learn.target = pool[Math.floor(Math.random()*pool.length)] || CORE[0]; learn.misses=0;
  renderBanner(); say("Find " + learn.target.label);
}
function learnCheck(it,node){
  state.practice.tries++;
  if (it.id===learn.target.id){
    state.practice.right++; save(); node.classList.add("right"); say("Yes! " + it.label); burst(node,16);
    renderBanner(); setTimeout(()=>{ if(learn.on) nextTarget(); }, 1500);
  } else {
    learn.misses++; save(); say(it.label);
    if (learn.misses>=2){
      const t = board.querySelector(`[data-id="${learn.target.id}"]`); if (t){ t.classList.remove("hint"); void t.offsetWidth; t.classList.add("hint"); }
      setTimeout(()=>say("Find " + learn.target.label), 900);
    }
  }
}
$("learnBtn").onclick = () => learn.on ? stopLearn() : startLearn();

/* ---------------- Switch and listening scanning ---------------- */
const scan = {timer:null,i:-1,els:[]};
function scanTargets(){
  return [...board.querySelectorAll("[data-scan],[data-act]"), $("speakBtn"), $("formBtn"), $("delBtn"), $("clrBtn"), ...$("tabs").querySelectorAll(".tab")];
}
function stopScan(){ clearInterval(scan.timer); scan.timer=null; document.querySelectorAll(".scan-on").forEach(n=>n.classList.remove("scan-on")); }
function restartScan(delay=0){
  stopScan();
  if (S.scan==="off" || document.querySelector(".sheet,.helpcard,.game,.bigpic")) return;
  setTimeout(()=>{
    if (S.scan==="off" || scan.timer) return;
    scan.els = scanTargets(); scan.i = -1;
    scan.timer = setInterval(stepScan, S.scanMs); stepScan();
  }, delay);
}
function stepScan(){
  document.querySelectorAll(".scan-on").forEach(n=>n.classList.remove("scan-on"));
  if (!scan.els.length) return;
  scan.i = (scan.i+1) % scan.els.length;
  const n = scan.els[scan.i]; n.classList.add("scan-on"); n.scrollIntoView({block:"nearest",inline:"nearest"});
  if (S.scan==="listen") say(n.dataset.w || n.getAttribute("aria-label") || n.textContent, true);
}
function scanSelect(){
  const n = scan.els[scan.i]; if(!n) return;
  stopScan();
  if (n.dataset.act) activate(n); else n.click();
  restartScan(S.scan==="listen" ? 1400 : 250);
}
$("switchBar").addEventListener("pointerdown", e=>{ e.preventDefault(); scanSelect(); });
document.addEventListener("keydown", e=>{
  if (S.scan==="off" || document.querySelector(".sheet,.helpcard,.game,.bigpic")) return;
  if (e.key===" " || e.key==="Enter"){ e.preventDefault(); scanSelect(); }
});

function shrink(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s=160, c=document.createElement("canvas"); c.width=c.height=s; const g=c.getContext("2d");
      const k=Math.min(img.width,img.height); g.drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,s,s);
      res(c.toDataURL("image/jpeg",0.8)); }; img.onerror=rej; img.src=r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function safetyRows(){
    const rows = [];
    rows.push(health.idb ? ["ok","Saved on this device"] : health.idb===false ? ["warn", health.localOK ? "Saved, but with limited room on this device. Keep backup files." : "This device isn't saving changes. Save a backup file now."] : ["wait","Checking this device's storage…"]);
    rows.push(health.persisted ? ["ok","Protected from automatic clean-up"] : ["warn", !installable() ? "This preview can't be protected from clean-up. Open Speakeasy from its own web address and install it. Keep backup files until then." : installed() ? "Not yet protected from automatic clean-up. Keep backup files." : "Install Speakeasy to protect it from automatic clean-up."]);
    rows.push(installed() ? ["ok","Installed as an app"] : ["warn", !installable() ? "This preview can't be installed or used offline. Open Speakeasy from its own web address to install it." : isIOS ? "Not installed yet. In Safari, tap Share, then Add to Home Screen." : "Not installed yet. Use your browser's Install app option."]);
    const lb = state.lastBackup;
    rows.push(lb && Date.now()-lb < 14*864e5 ? ["ok",`Backup file saved ${fmtDay(lb)}`] : ["warn", lb ? `Last backup file ${fmtDay(lb)}. Time for a new one.` : "No backup file yet."]);
  return rows;
}

const stampOf = d => { const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
function track(kind){
  const D = state.stats.days, k = stampOf(new Date()); const r = D[k] ||= {taps:0, said:0}; r[kind] = (r[kind]||0) + 1;
  const keys = Object.keys(D).sort(); while (keys.length > 60) delete D[keys.shift()];
}

// caregiver-only buttons: a 2-second hold when the lock is on
function guarded(btn, action){
  let t = null;
  btn.addEventListener("pointerdown", ()=>{ if (!S.lock) return; btn.classList.add("holding"); t = setTimeout(()=>{ t="done"; btn.classList.remove("holding"); action(); }, 1500); });
  const cancel = tell => { if (t && t!=="done"){ clearTimeout(t); t=null; btn.classList.remove("holding"); if (tell) toast("Caregivers: hold for 2 seconds to open this."); } };
  btn.addEventListener("pointerup", ()=>cancel(true));
  btn.addEventListener("pointerleave", ()=>cancel(false));
  btn.addEventListener("click", e=>{ if (!S.lock || e.detail===0) action(); t = null; });
}

  panel.querySelector("#mClose").onclick = close;
  const go = k => {
    close();
    if (k.startsWith("game:")) return openGame(k.slice(5));
    if (k==="game") return openGame("birds");
    if (k==="practice") return learn.on ? stopLearn() : startLearn();
    if (k==="find") return $("findBtn").onclick();
    if (k==="helppractice") return openHelpPractice();
    if (k==="help") return $("helpBtn").onclick();
    if (k==="guide-talk") return openGuide("talk");
    if (k==="guide-care") return openGuide("care");
    if (k==="guide-faq") return openGuide("faq");
    if (k==="people") return openPeople();
    if (k==="profile") return openProfileEditor();
    if (k==="check") return openLevelCheck();

    if (k==="dash") return openDashboard();
    if (k==="install") return doInstall();
    if (k==="settings") return openSettings();
    if (["words","help-set","voice","safe"].includes(k)) return openSettings(k==="help-set" ? "help" : k);

    document.querySelector(`.tab[data-tab="${CSS.escape(k)}"]`)?.scrollIntoView({inline:"center",block:"nearest"});
  };
  const group = (title, items, opts={}) => {
    items = items.filter(x=>(!(["core","groups","phrases","keyboard"].includes(x[0]) || isTopic(x[0])) || tabsFor().includes(x[0])) && (x[0]!=="find" || lv()>1)

    ["groups","🗂️","Word groups","Feelings, food, people and more"],
    ["phrases","💬","Phrases","Whole sentences, ready to say"],
    ["keyboard","⌨️","Keyboard","Spell any word"]
  ]);
  group("Play and learn", [
    ...topicTabs().filter(t=>PACKS[t]).map(t=>["game:"+t,"🎮",PACKS[t].game, PACKS[t].noun==="one" ? "Find the right picture" : `Find the right ${PACKS[t].noun}`]),
    ["practice","🎯", learn.on ? "Stop practice" : "Practice", learn.on ? "Practice is on now" : "Find words on the board"],
    ["find","🔍","Find a word","See where a word lives"],
    ["helppractice","🆘","Help practice","Learn how to get help"]
  ]);
  group("People", [["people","👥","Who's talking", REG.list.length>1 ? `${REG.list.length} people on this device` : "Switch between people"]]);
  group("How to use", [
    ["guide-talk","👋","How to talk","Simple steps for the user"],
    ["guide-care","📘","Caregiver guide","Set up, teach and keep safe"],
    ["guide-faq","❓","Questions","Type a question, get an answer"]
  ]);
  group("Help", [["help","🆘","Help card","Shows and says who to call","sos"]]);
  group("Caregivers 🔒", [
    ["dash","📊","Dashboard","Progress, setup steps, safety"],
    ["profile","🪪","Edit profile","Name, age, favorites, level"],
    ["check","🧭","Level check","Suggests the right level"],
    ["add","➕","Add a person","Their own words and progress"],
    ["words","✏️","Edit words","Add words and photos"],
    ["help-set","🆘","Set up Help card","Name and emergency contact"],
    ["voice","🔊","Voice","Pick a voice and speed"],
    ["safe","💾","Backups","Keep their words safe"],

  ], {care:true});

/* ---- Caregiver dashboard ---- */
function openDashboard(){
  const {panel, close} = makeSheet("Caregiver dashboard","dash");
  const render = () => {
    const D = state.stats.days, days = [];
    for (let i=6; i>=0; i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push({d, r:D[stampOf(d)]||{taps:0,said:0}, today:i===0}); }
    const taps = days.reduce((n,x)=>n+(x.r.taps||0),0), said = days.reduce((n,x)=>n+(x.r.said||0),0), used = days.filter(x=>x.r.taps>0).length;
    const maxT = Math.max(1, ...days.map(x=>x.r.taps||0));
    const top = Object.entries(state.learned).sort((a,b)=>b[1]-a[1]).slice(0,12);
    const P = state.practice, pct = P.tries ? Math.min(100, Math.round(P.right/P.tries*100)) : null;
    const lb = state.lastBackup, backupOK = !!lb && Date.now()-lb < 14*864e5;
    const tasks = [
      ["Make their profile", !!(state.profile.name && state.profile.age), "profile"],
      ["Do the level check", !!state.profile.check, "check"],
      ["Read the caregiver guide", !!state.guideSeen, "guide"],
      ["Add emergency contacts", hasContacts(), "help"],
      ["Practice getting help", !!state.helpPracticed, "helppractice"],
      ["Choose a voice", !!S.voiceURI, "voice"],
      ["Add their own words or photos", addedWords(state)>0, "words"],
      ["Save a backup file", backupOK, "backup"],
      ["Install Speakeasy as an app", installed(), "install"]
    ];
    const done = tasks.filter(t=>t[1]).length;
    const voice = voices.find(v=>v.voiceURI===S.voiceURI);
    const fact = (v,l) => `<div class="fact"><b>${esc(v)}</b><span>${esc(l)}</span></div>`;
    const who = state.profile.name || "This person", hint = moveUpHint();
    const hintHTML = hint ? `<div class="dcard" style="border-color:var(--verb-bd);margin-bottom:10px"><h4>🌱 Ready for more?</h4><p class="note" style="color:var(--ink)">${esc(who)} uses ${hint.used} of the ${hint.shown} core words showing, at least 3 times each. They may be ready for Level ${lv()+1}.</p><div class="row" style="justify-content:flex-start"><button class="btn primary" data-do="up">Move up to Level ${lv()+1}</button></div></div>` : "";
    panel.innerHTML = `<div class="phead"><h2>Dashboard</h2><button class="btn primary" id="dClose">Done</button></div>
      <p class="note">${esc(state.profile.avatar||"🙂")} ${esc(who)} · Level ${lv()} ${LEVELS[lv()].tag}. These numbers stay on this device and are never sent anywhere.</p>${hintHTML}
      <div class="dgrid">
        <div class="dcard"><h4>✅ Setup steps</h4>
          <div class="progress" role="progressbar" aria-label="Setup steps done" aria-valuemin="0" aria-valuemax="${tasks.length}" aria-valuenow="${done}"><i style="width:${Math.round(done/tasks.length*100)}%"></i></div>
          <p class="note">${done} of ${tasks.length} done${done===tasks.length?". Everything is set up.":""}</p>
          <div>${tasks.map(([t,ok,k])=>`<div class="todo${ok?" done":""}"><span class="tk" aria-hidden="true">${ok?"✅":"⬜"}</span><span class="tt">${esc(t)}</span>${ok?"":`<button class="btn" data-do="${k}">Do it</button>`}</div>`).join("")}</div></div>
        <div class="dcard"><h4>💬 Talking this week</h4>
          <div class="facts">${fact(taps,"words tapped")}${fact(said,"messages spoken")}${fact(used+" of 7","days used")}${fact(Object.keys(state.learned).length,"different words, all time")}</div>
          <div class="bars" role="img" aria-label="Words tapped each day this week: ${days.map(x=>(x.r.taps||0)).join(", ")}">${days.map(x=>`<div class="bar${x.today?" today":""}"><span>${x.r.taps||0}</span><i style="height:${Math.round((x.r.taps||0)/maxT*72)}px"></i><span>${esc(x.d.toLocaleDateString(undefined,{weekday:"short"}))}</span></div>`).join("")}</div></div>
        <div class="dcard"><h4>⭐ Most used words</h4>
          ${top.length ? `<div class="toplist">${top.map(([w,n])=>`<span>${esc(w.replace(/^i(?=$|['’])/,"I"))}<small>${n}</small></span>`).join("")}</div>` : `<p class="note">The words they tap most will show here.</p>`}
          <p class="note">Their favorite words are great ones to model. Use them in short sentences on the board while you talk.</p></div>
        <div class="dcard"><h4>🎯 Practice and games</h4>
          <div class="facts">${fact(P.right,"words and birds found")}${fact(pct===null?"–":pct+"%","of tries were right")}${fact((state.game&&state.game.best)||0,"best bird game streak")}${fact(learn.on?"On":"Off","practice right now")}</div>
          <div class="row" style="justify-content:flex-start"><button class="btn" data-do="practice">${learn.on?"Stop practice":"Start practice"}</button>${topicTabs().find(t=>PACKS[t])?`<button class="btn" data-do="game">${esc(PACKS[topicTabs().find(t=>PACKS[t])].game)}</button>`:""}</div></div>
        <div class="dcard"><h4>💾 Keep their words safe</h4>
          <div class="checks">${checksHTML(safetyRows())}</div>
          <div class="row" style="justify-content:flex-start"><button class="btn primary" data-do="backup">Save backup file</button></div></div>
        <div class="dcard"><h4>⚙️ Current setup</h4>
          <div class="facts">${fact("Level "+lv(),LEVELS[lv()].tag)}${fact(state.profile.age?ageOf(state.profile.age)[1]:"Not set","age group")}${fact(state.profile.interests.length,"favorite things")}${fact(S.board+" buttons","core board")}${fact(S.level==="starter"?"12":S.level==="24"?"24":"All","core words showing")}${fact(voice?voice.name:"Device default","voice")}${fact(S.scan==="off"?"Off":S.scan==="switch"?"Switch":"Listening","scanning")}</div>
          <div class="row" style="justify-content:flex-start"><button class="btn" data-do="settings">Change settings</button><button class="btn" data-do="guide">Caregiver guide</button></div></div>
      </div>`;
    panel.querySelector("#dClose").onclick = close;
    panel.querySelectorAll("[data-do]").forEach(b=>b.onclick = async () => {
      const k = b.dataset.do;
      if (k==="backup"){ if (await saveBackupFile()) render(); return; }
      if (k==="install"){ doInstall(); return; }
      close();
      if (k==="profile") return openProfileEditor();
      if (k==="check") return openLevelCheck();
      if (k==="helppractice") return openHelpPractice();
      if (k==="up"){ setLevel(lv()+1); return; }
      if (k==="guide") openGuide("care");
      else if (k==="practice") learn.on ? stopLearn() : startLearn();
      else if (k==="game") openGame(topicTabs().find(t=>PACKS[t]));
      else if (k==="settings") openSettings();
      else openSettings(k);
    });
  };
  render();
}

const STOPWORDS = new Set("a an the i my me to do how can is it its what why where when does on in of and or for with this that you your be are am not dont don't won't wont cant can't there their they them we our please help want".split(" "));
function faqMatches(text){
  const words = text.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(w=>w.length>1 && !STOPWORDS.has(w)).map(w=>w.replace(/(ing|es|s)$/,"")).filter(w=>w.length>1);
  if (!words.length) return [];
  return FAQ.map(f=>{ const keys = f[3].toLowerCase(), hay = (f[1]+" "+f[2]+" "+f[3]).toLowerCase(); let sc = 0;
      for (const w of words){ if (keys.includes(w)) sc += 3; else if (f[1].toLowerCase().includes(w)) sc += 2; else if (hay.includes(w)) sc += 1; } return {f, sc}; })
    .filter(x=>x.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,6).map(x=>x.f);
}

const SUPPORT_EMAIL = "Mclearn2025@gmail.com";   // McLearn Media support
function openGuide(which="talk", first=false){
  const {panel, close} = makeSheet("How to use Speakeasy","guide");
  let cur = which, query = "";
  // where a step or answer can take you; settings and the profile need the caregiver hold when the lock is on
  const act = (o, btn) => {
    if (o.show){ btn.onclick = () => { const n = typeof o.show==="string" ? document.querySelector(o.show) : o.show(); close(); setTimeout(()=>spotlight(n, cur==="talk" ? o.h : ""), 150); }; return; }
    if (o.faq){ btn.onclick = () => { cur = "faq"; render(); panel.scrollTop = 0; }; return; }
    guarded(btn, () => { close(); if (o.dash) openDashboard(); else if (o.profile) openProfileEditor(); else openSettings(o.go); });
  };
  const actLabel = o => o.show ? "👀 Show me" : o.faq ? "❓ Ask a question" : "Take me there";
  const hasAct = o => o.show || o.go || o.dash || o.profile || o.faq;
  const faqCard = (f, i) => `<div class="faq"><b>${esc(f[1])}</b><p>${esc(f[2])}</p>${hasAct(f[4])?`<span class="sa"><button class="btn" data-fa="${i}">${actLabel(f[4])}${f[4].show?"":`<span class="ring"></span>`}</button></span>`:""}</div>`;
  const groupsHTML = () => [...new Set(FAQ.map(f=>f[0]))].map(t=>`<details class="faqgrp"><summary>${esc(t)}</summary>${FAQ.map((f,i)=>f[0]===t?faqCard(f,i):"").join("")}</details>`).join("");
  const resultsHTML = () => { const q = query.trim(); if (!q) return groupsHTML(); const hits = faqMatches(q);
    return hits.length ? hits.map(f=>faqCard(f, FAQ.indexOf(f))).join("")
      : `<div class="faq"><b>We don't have an answer for that yet.</b><p>Try other words, like voice, photo, level, backup or game. Or open a topic below.</p></div>${groupsHTML()}`; };
  const bindFa = () => panel.querySelectorAll("[data-fa]").forEach(b=>act(FAQ[+b.dataset.fa][4], b));
  const render = () => {
    if (cur==="care" && !state.guideSeen){ state.guideSeen = true; save(); }
    panel.classList.toggle("kid", cur==="talk");
    const steps = cur==="faq" ? [] : GUIDE[cur].filter(s=>!s.need || s.need());
    let body = "";
    if (cur==="faq"){
      body = `<div class="faqbox"><label for="gq" class="note" style="color:var(--ink);font-weight:600">Type your question</label>
        <input type="search" id="gq" value="${esc(query)}" placeholder="Like: no sound, add a photo, change the level" autocomplete="off" enterkeyhint="search"></div>
        <div id="gRes" class="faqlist">${resultsHTML()}</div>
        <div class="faq"><b>Still stuck?</b><p>Email McLearn Media at <span class="sel">${esc(SUPPORT_EMAIL)}</span> and tell us what happened.</p><span class="sa"><button class="btn" id="gCopy">Copy email address</button></span></div>`;
    } else {
      body = `<ol class="steps">${steps.map((s,i)=>`<li class="step"><span class="num" aria-hidden="true">${i+1}</span><span class="sh">${esc(s.h)}</span><span class="sb">${esc(s.b)}</span>
        <span class="sa">${cur==="talk"?`<button class="btn" data-say="${i}">🔊 Read it to me</button>`:""}${hasAct(s)?`<button class="btn" data-go="${i}">${actLabel(s)}${s.show||s.faq?"":`<span class="ring"></span>`}</button>`:""}</span></li>`).join("")}</ol>
        ${cur==="care"?`<p class="note" style="margin-top:12px">${S.lock?"Take me there buttons open settings, so hold them for 2 seconds. ":""}Speakeasy is a communication tool, not therapy. A speech-language pathologist can help choose the right words, settings and goals.</p>`:""}`;
    }
    panel.innerHTML = `<div class="phead"><h2>How to use</h2><button class="btn primary" id="gClose">${first?"Start talking":"Close"}</button></div>
      ${first?`<p class="note">Welcome to Speakeasy. Here's how it works. You can open this again anytime from the Menu.</p>`:""}
      <div class="row" style="justify-content:flex-start;margin-block:8px"><span class="seg" role="group" aria-label="Guide sections">
        <button data-g="talk" aria-pressed="${cur==="talk"}">For the user</button><button data-g="care" aria-pressed="${cur==="care"}">For caregivers</button><button data-g="faq" aria-pressed="${cur==="faq"}">Questions</button></span></div>
      ${body}`;
    panel.querySelector("#gClose").onclick = close;
    panel.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ cur=b.dataset.g; render(); panel.scrollTop=0; });
    panel.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{ const s=steps[+b.dataset.say]; say(`${s.h} ${s.b}`); });
    panel.querySelectorAll("[data-go]").forEach(b=>act(steps[+b.dataset.go], b));
    bindFa();
    const gq = panel.querySelector("#gq");
    if (gq){
      gq.oninput = e => { query = e.target.value; panel.querySelector("#gRes").innerHTML = resultsHTML(); bindFa(); };
      panel.querySelector("#gCopy").onclick = async () => { try { await navigator.clipboard.writeText(SUPPORT_EMAIL); toast("Email address copied."); } catch { const r=document.createRange(); r.selectNodeContents(panel.querySelector(".sel")); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r); toast("Copying is blocked here. The address is selected."); } };
    }
  };
  render();
  if (cur==="faq") setTimeout(()=>panel.querySelector("#gq")?.focus(), 80);
}

async function loadPerson(id){
  REG.active = id; writeReg();
  let d = load();
  if (idb){ try { const fromDB = await idbDo("kv","readonly", st => st.get(idbKey(id))); if (fromDB && ((fromDB.savedAt||0) > (d.savedAt||0) || d._stripped)) d = fromDB; } catch {} }
  adopt(d); msg = []; typing = ""; tab = "core"; sub = null; if (learn.on) stopLearn();
  save(); apply(); updateSafetyDot();
}
async function switchProfile(id){
  if (id===REG.active) return;
  clearTimeout(idbTimer); await flushIDB(); syncReg();
  await loadPerson(id);
  const n = state.profile.name; toast(n ? `Now talking: ${n}` : "Switched profile"); say(n ? `Hi ${n}!` : "Hi!");
}
async function addPerson(){
  clearTimeout(idbTimer); await flushIDB(); syncReg();
  REG.active = "p" + Date.now().toString(36); writeReg();
  adopt({}); S.lvl = 1; Object.assign(S, LEVELS[1].set); state.guideSeen = true; state.profileAsked = true;
  msg = []; typing = ""; tab = "core"; sub = null;
  save(); apply(); openProfileEditor({isNew:true});
}
async function deletePerson(id){
  if (REG.list.length < 2) return;
  try { localStorage.removeItem(lsKey(id)); } catch {}
  if (idb){ try {
    await idbDo("kv","readwrite", st => st.delete(idbKey(id)));
    const all = await idbDo("points","readonly", st => st.getAll());
    for (const p of all||[]) if ((p.pid||"main")===id) await idbDo("points","readwrite", st => st.delete(p.t));
  } catch {} }
  REG.list = REG.list.filter(x=>x.id!==id); writeReg();
  if (REG.active===id){ clearTimeout(idbTimer); idbTimer = null; await loadPerson(REG.list[0].id); }
}
